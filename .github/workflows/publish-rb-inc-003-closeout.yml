name: Publish RB-INC-003 Closeout

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/publish-rb-inc-003-closeout.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: docs/rb-inc-003-closeout
          fetch-depth: 0
      - name: Synchronize registry
        shell: python
        run: |
          from pathlib import Path
          path = Path("docs/registry.md")
          content = path.read_text(encoding="utf-8")
          content = content.replace(
              "| RB-INC-003 | Criação Canônica de Viagem | Implementation Increment | Draft | 0.1.0 |",
              "| RB-INC-003 | Criação Canônica de Viagem | Implementation Increment | Published | 1.0.0 |",
          )
          path.write_text(content, encoding="utf-8")
      - name: Commit registry
        run: |
          git config user.name "routebook-automation"
          git config user.email "routebook-automation@users.noreply.github.com"
          git add docs/registry.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "docs: publish RB-INC-003 registry entry"
          git pull --rebase origin docs/rb-inc-003-closeout
          git push origin HEAD:docs/rb-inc-003-closeout
