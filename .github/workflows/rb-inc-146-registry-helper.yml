name: RB-INC-146 Registry Helper

on:
  push:
    branches:
      - codex/rb-inc-146-vercel-immutable-promotion
    paths:
      - ".github/workflows/rb-inc-146-registry-helper.yml"

permissions:
  contents: write

jobs:
  update-registry:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout increment branch
        uses: actions/checkout@v6
        with:
          ref: codex/rb-inc-146-vercel-immutable-promotion

      - name: Add RB-INC-146 and RB-CTX-146 to registry
        shell: python
        run: |
          from pathlib import Path

          path = Path("docs/registry.md")
          text = path.read_text(encoding="utf-8")

          increment = "| RB-INC-146 | Promoção Imutável de Staged Production Deployment na Vercel | Implementation | Draft | 0.1.0 | [rb-inc-146-vercel-immutable-promotion.md](./implementation/increments/rb-inc-146-vercel-immutable-promotion.md) |"
          context = "| RB-CTX-146 | Context Pack do RB-INC-146 — Promoção Imutável de Staged Production Deployment | Implementation Context Pack | Draft | 0.1.0 | [rb-inc-146-vercel-immutable-promotion.md](./implementation/context-packs/rb-inc-146-vercel-immutable-promotion.md) |"

          if increment in text and context in text:
              raise SystemExit(0)

          anchor = "| RB-CTX-145 | Context Pack do RB-INC-145 — Verificação Efetiva do Production Deployment | Implementation Context Pack | Draft | 0.1.0 | [rb-inc-145-production-release-verification.md](./implementation/context-packs/rb-inc-145-production-release-verification.md) |\n\n## Status possíveis"
          replacement = f"| RB-CTX-145 | Context Pack do RB-INC-145 — Verificação Efetiva do Production Deployment | Implementation Context Pack | Draft | 0.1.0 | [rb-inc-145-production-release-verification.md](./implementation/context-packs/rb-inc-145-production-release-verification.md) |\n{increment}\n{context}\n\n## Status possíveis"

          if anchor not in text:
              raise SystemExit("Registry anchor not found")

          path.write_text(text.replace(anchor, replacement, 1), encoding="utf-8")

      - name: Commit registry update
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- docs/registry.md; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/registry.md
          git commit -m "docs(rb-inc-146): register increment and context pack"
          git push origin HEAD:codex/rb-inc-146-vercel-immutable-promotion
