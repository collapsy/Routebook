name: Format RB-INC-003 Trip

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/format-rb-inc-003-trip.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/rb-inc-003-trip-creation
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write --ignore-path /dev/null modules/trip-management/src/trip.ts
      - run: |
          git config user.name "routebook-automation"
          git config user.email "routebook-automation@users.noreply.github.com"
          git add modules/trip-management/src/trip.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: format trip aggregate"
          git pull --rebase origin feature/rb-inc-003-trip-creation
          git push origin HEAD:feature/rb-inc-003-trip-creation
