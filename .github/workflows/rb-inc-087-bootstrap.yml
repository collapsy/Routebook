name: RB-INC-087 Bootstrap

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize
    paths:
      - .github/workflows/rb-inc-087-bootstrap.yml

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.head_ref == 'feature/rb-inc-087-account-membership-trip-authorization'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/rb-inc-087-account-membership-trip-authorization
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: corepack enable
      - name: Patch composition and governance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          schema = Path("packages/database/src/schema.ts")
          content = schema.read_text(encoding="utf-8")
          anchor = 'export const trips = pgTable("trips", {\n  id: uuid("id").primaryKey(),'
          replacement = anchor + '\n  accountId: uuid("account_id"),'
          if 'accountId: uuid("account_id")' not in content:
              if anchor not in content:
                  raise SystemExit("trips schema anchor not found")
              schema.write_text(content.replace(anchor, replacement, 1), encoding="utf-8")

          index = Path("packages/database/src/index.ts")
          content = index.read_text(encoding="utf-8")
          auth_anchor = '} from "./auth-schema";'
          identity_exports = '\nexport { accountMemberships, accounts } from "./identity-schema";'
          if 'from "./identity-schema"' not in content:
              content = content.replace(auth_anchor, auth_anchor + identity_exports, 1)
          repository_exports = '\nexport {\n  createPostgresTripAuthorizationReader,\n  DrizzleTripAuthorizationRepository,\n} from "./trip-authorization-repository";\n'
          client_anchor = 'export { closeDatabase, getDatabase } from "./client";\n'
          if 'from "./trip-authorization-repository"' not in content:
              content = content.replace(client_anchor, client_anchor + repository_exports, 1)
          index.write_text(content, encoding="utf-8")

          journal = Path("packages/database/drizzle/meta/_journal.json")
          data = json.loads(journal.read_text(encoding="utf-8"))
          if not any(entry["tag"] == "0021_create_accounts_and_trip_authorization" for entry in data["entries"]):
              data["entries"].append({
                  "idx": 21,
                  "version": "7",
                  "when": 1785711000000,
                  "tag": "0021_create_accounts_and_trip_authorization",
                  "breakpoints": True,
              })
          journal.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          registry = Path("docs/registry.md")
          content = registry.read_text(encoding="utf-8")
          anchor = "| RB-CTX-086 | Context Pack do RB-INC-086 | Implementation Context | Draft | 0.1.0 | [rb-inc-086-better-auth-session-foundation.md](./implementation/context-packs/rb-inc-086-better-auth-session-foundation.md) |"
          rows = "\n".join([
              "| RB-INC-087 | Account Membership e Autorização Server-Side de Trip | Implementation | Draft | 0.1.0 | [rb-inc-087-account-membership-trip-authorization.md](./implementation/increments/rb-inc-087-account-membership-trip-authorization.md) |",
              "| RB-CTX-087 | Context Pack do RB-INC-087 | Implementation Context | Draft | 0.1.0 | [rb-inc-087-account-membership-trip-authorization.md](./implementation/context-packs/rb-inc-087-account-membership-trip-authorization.md) |",
          ])
          if "| RB-INC-087 |" not in content:
              if anchor not in content:
                  raise SystemExit("RB-CTX-086 registry anchor not found")
              registry.write_text(content.replace(anchor, anchor + "\n" + rows, 1), encoding="utf-8")

          matrix = Path("docs/implementation/traceability-matrix.md")
          content = matrix.read_text(encoding="utf-8")
          anchor = "| RB-INC-086 | RB-SEC-001, RB-DATA-001–002, RB-ADR-007–008 e RB-INC-085 | #197 | `feature/rb-inc-086-better-auth-session-foundation`, PR #198 | Better Auth 1.6.14, schema e migration 0020, rota Next.js e resolução server-side de sessão | runs 30769434778 e 30769434775; migration 0020, PostgreSQL real, smoke, build Turbopack e E2E responsivo verdes | Pronto para integração |"
          row = "| RB-INC-087 | RB-SEC-001, RB-DATA-001–002, RB-ADR-007–008 e RB-INC-085–086 | #199 | `feature/rb-inc-087-account-membership-trip-authorization`, PR #200 | Account, Membership, matriz deny-by-default e autorização PostgreSQL de Trip | validações finais em execução | Em validação |"
          if "| RB-INC-087 |" not in content:
              if anchor not in content:
                  raise SystemExit("RB-INC-086 traceability anchor not found")
              matrix.write_text(content.replace(anchor, anchor + "\n" + row, 1), encoding="utf-8")
          PY
      - name: Resolve lockfile and format
        run: |
          pnpm install --lockfile-only
          pnpm exec prettier --write \
            modules/identity-access/package.json \
            modules/identity-access/tsconfig.json \
            modules/identity-access/eslint.config.mjs \
            modules/identity-access/src/identity.ts \
            modules/identity-access/src/identity.test.ts \
            modules/identity-access/src/trip-authorization.ts \
            modules/identity-access/src/trip-authorization.test.ts \
            modules/identity-access/src/index.ts \
            packages/database/package.json \
            packages/database/src/identity-schema.ts \
            packages/database/src/trip-authorization-repository.ts \
            packages/database/src/trip-authorization-repository-postgres.test.ts \
            packages/database/src/schema.ts \
            packages/database/src/index.ts \
            packages/database/drizzle/meta/_journal.json \
            docs/implementation/increments/rb-inc-087-account-membership-trip-authorization.md \
            docs/implementation/context-packs/rb-inc-087-account-membership-trip-authorization.md \
            docs/implementation/traceability-matrix.md \
            docs/registry.md
          rm .github/workflows/rb-inc-087-bootstrap.yml
      - name: Commit bootstrap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add modules/identity-access packages/database docs pnpm-lock.yaml .github/workflows/rb-inc-087-bootstrap.yml
          git commit -m "build: integrate RB-INC-087 contracts"
          git push origin HEAD:feature/rb-inc-087-account-membership-trip-authorization
