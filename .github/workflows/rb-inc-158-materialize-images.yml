name: RB-INC-158 Materialize Images

on:
  push:
    branches:
      - codex/rb-inc-158-pipa-visual-coverage
    paths:
      - .github/workflows/rb-inc-158-materialize-images.yml

permissions:
  contents: write

jobs:
  materialize-governed-images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: codex/rb-inc-158-pipa-visual-coverage

      - name: Materialize governed Commons assets
        run: node scripts/materialize-place-images.mjs --materialize

      - name: Verify materialized assets offline
        run: node scripts/materialize-place-images.mjs --verify

      - name: Register RB-INC-158 documents
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const path = "docs/registry.md";
          let text = fs.readFileSync(path, "utf8");
          if (!text.includes("| RB-INC-158 |")) {
            const marker = "\n## Status possíveis";
            const rows = [
              "| RB-INC-158 | Expansão Governada da Cobertura Visual dos Places de Pipa | Implementation | Draft | 0.1.0 | [rb-inc-158-pipa-visual-coverage.md](./implementation/increments/rb-inc-158-pipa-visual-coverage.md) |",
              "| RB-CTX-158 | Context Pack do RB-INC-158 — Expansão Governada da Cobertura Visual dos Places de Pipa | Implementation Context Pack | Draft | 0.1.0 | [rb-inc-158-pipa-visual-coverage.md](./implementation/context-packs/rb-inc-158-pipa-visual-coverage.md) |",
            ].join("\n");
            if (!text.includes(marker)) throw new Error("Registry marker not found");
            text = text.replace(marker, `\n${rows}\n${marker}`);
            fs.writeFileSync(path, text);
          }
          NODE

      - name: Validate documentation
        run: node scripts/validate-docs.mjs

      - name: Commit governed assets and integrity
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/data/pipa-place-images.json apps/web/public/place-images/pipa docs/registry.md
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No materialization changes to commit."
            exit 1
          fi
          git commit -m "chore: materialize RB-INC-158 place images"
          git push origin HEAD:codex/rb-inc-158-pipa-visual-coverage
