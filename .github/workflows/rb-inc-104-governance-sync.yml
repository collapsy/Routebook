name: RB-INC-104 Governance Sync

on:
  push:
    branches:
      - feature/rb-inc-104-persisted-itinerary-proposal-edit
    paths:
      - ".github/workflows/rb-inc-104-governance-sync.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/rb-inc-104-persisted-itinerary-proposal-edit
      - name: Synchronize registry and traceability
        shell: python
        run: |
          from pathlib import Path

          registry_path = Path("docs/registry.md")
          registry = registry_path.read_text()
          anchor = "| RB-CTX-103 | Context Pack do RB-INC-103 | Implementation Context | Draft | 0.1.0 | [rb-inc-103-edit-itinerary-proposal-activity.md](./implementation/context-packs/rb-inc-103-edit-itinerary-proposal-activity.md) |"
          rows = """| RB-INC-104 | Serviço de Aplicação para Edição Persistida de Itinerary Proposal | Implementation | Draft | 0.1.0 | [rb-inc-104-persisted-itinerary-proposal-edit.md](./implementation/increments/rb-inc-104-persisted-itinerary-proposal-edit.md) |
          | RB-CTX-104 | Context Pack do RB-INC-104 | Implementation Context | Draft | 0.1.0 | [rb-inc-104-persisted-itinerary-proposal-edit.md](./implementation/context-packs/rb-inc-104-persisted-itinerary-proposal-edit.md) |"""
          if "| RB-INC-104 |" not in registry:
              if anchor not in registry:
                  raise SystemExit("RB-CTX-103 registry anchor not found")
              registry = registry.replace(anchor, anchor + "\n" + rows, 1)
              registry_path.write_text(registry)

          matrix_path = Path("docs/implementation/traceability-matrix.md")
          matrix = matrix_path.read_text()
          section = """## Evidências previstas do RB-INC-104

          | Evidência | Localização |
          | --- | --- |
          | definição do incremento | `docs/implementation/increments/rb-inc-104-persisted-itinerary-proposal-edit.md` |
          | Context Pack | `docs/implementation/context-packs/rb-inc-104-persisted-itinerary-proposal-edit.md` |
          | application service | `modules/proposal-management/src/service.ts` |
          | testes do service | `modules/proposal-management/src/edit-itinerary-proposal-service.test.ts` |
          | integração PostgreSQL | `packages/database/src/edit-itinerary-proposal-service-postgres.test.ts` |
          | repository | `packages/database/src/proposal-repository.ts` |
          | schema de Proposal | `packages/database/src/proposal-schema.ts` |
          | migration | `packages/database/drizzle/0023_allow_ready_itinerary_proposal_edits.sql` |
          | journal de migrations | `packages/database/drizzle/meta/_journal.json` |
          | rastreabilidade | issue #237 e PR #238 |

          """
          if "## Evidências previstas do RB-INC-104" not in matrix:
              marker = "## Cadeia mínima"
              if marker not in matrix:
                  raise SystemExit("traceability marker not found")
              matrix = matrix.replace(marker, section + marker, 1)
              matrix_path.write_text(matrix)
      - name: Commit canonical governance and remove helper
        run: |
          git config user.name "collapsy"
          git config user.email "38116052+collapsy@users.noreply.github.com"
          git add docs/registry.md docs/implementation/traceability-matrix.md
          git rm .github/workflows/rb-inc-104-governance-sync.yml
          git commit -m "docs(rb-inc-104): sync registry and traceability"
          git push
