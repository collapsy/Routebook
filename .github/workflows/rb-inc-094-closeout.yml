name: RB-INC-094 Temporary Closeout

on:
  push:
    branches:
      - feature/rb-inc-094-deterministic-itinerary-proposal-generator

permissions:
  contents: write

jobs:
  closeout:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: feature/rb-inc-094-deterministic-itinerary-proposal-generator
          fetch-depth: 0

      - name: Register final evidence
        run: |
          python - <<'PY'
          from pathlib import Path

          increment_path = Path("docs/implementation/increments/rb-inc-094-deterministic-itinerary-proposal-generator.md")
          increment = increment_path.read_text()
          increment = increment.replace(
              "- [ ] exports, registry, Context Pack e matriz estão atualizados;\n- [ ] CI integral está verde no SHA definitivo.",
              "- [x] exports, registry, Context Pack e matriz estão atualizados;\n- [x] CI integral está verde no SHA de fechamento documental.",
          )
          increment = increment.replace(
              "- governança já publicada na branch: Increment, Context Pack e registry;\n- matriz de rastreabilidade: atualização pendente antes do CI definitivo;\n- Engineering Validation, Documentation Validation, job, SHA, quantidade total de testes e E2E: pendentes do fechamento definitivo da PR #214.",
              "- governança publicada na branch: Increment, Context Pack, registry e matriz de rastreabilidade;\n- SHA de fechamento documental: `61d8e0635ccbf29ce92d38df75c0529bb04689e1`;\n- Engineering Validation: run `31060389877`, job `92486885615`;\n- Documentation Validation: run `31060389870`, job `92486884413`;\n- 228 documentos registrados;\n- 551 testes aprovados, incluindo 10 testes do adapter determinístico;\n- migrations, smoke, build e 71 testes Playwright responsivos aprovados.",
          )
          increment_path.write_text(increment)

          matrix_path = Path("docs/implementation/traceability-matrix.md")
          matrix = matrix_path.read_text()
          old = "| RB-INC-094 | RB-UC-022, RB-FR-087–096, RB-ARC-003, decisão #118 e RB-INC-052–057, RB-INC-093 | #213 | `feature/rb-inc-094-deterministic-itinerary-proposal-generator`, PR #214 | porta interna, contratos normalizados e adapter puro com ordenação canônica, balanceamento, append, duração padrão explícita, validade e lifecycle `ready` | 228 documentos registrados; 10 testes do adapter implementados; runs, job, SHA, suíte total, smoke, build e Playwright responsivo pendentes do CI definitivo | Em validação |"
          new = "| RB-INC-094 | RB-UC-022, RB-FR-087–096, RB-ARC-003, decisão #118 e RB-INC-052–057, RB-INC-093 | #213 | `feature/rb-inc-094-deterministic-itinerary-proposal-generator`, PR #214 | porta interna, contratos normalizados e adapter puro com ordenação canônica, balanceamento, append, duração padrão explícita, validade e lifecycle `ready` | runs 31060389877 e 31060389870, jobs 92486885615 e 92486884413, SHA 61d8e063; 228 documentos, migrations, 551 testes, smoke, build e 71 Playwright responsivos verdes | Pronto para integração |"
          if old not in matrix:
              raise SystemExit("Linha pendente do RB-INC-094 não encontrada")
          matrix_path.write_text(matrix.replace(old, new))

          Path(".github/workflows/rb-inc-094-closeout.yml").unlink()
          PY

      - name: Commit closeout
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/implementation/increments/rb-inc-094-deterministic-itinerary-proposal-generator.md
          git add docs/implementation/traceability-matrix.md
          git add .github/workflows/rb-inc-094-closeout.yml
          git commit -m "docs(rb-inc-094): registrar evidências de fechamento"
          git push origin HEAD:feature/rb-inc-094-deterministic-itinerary-proposal-generator
