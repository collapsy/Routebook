name: RB-INC-147 Registry Helper

on:
  push:
    branches:
      - codex/rb-inc-147-focused-recommendations
    paths:
      - ".github/workflows/rb-inc-147-registry-helper.yml"

permissions:
  contents: write

jobs:
  update-registry:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout increment branch
        uses: actions/checkout@v6
        with:
          ref: codex/rb-inc-147-focused-recommendations

      - name: Register increment and document temporary exception
        shell: python
        run: |
          from pathlib import Path

          registry = Path("docs/registry.md")
          text = registry.read_text(encoding="utf-8")
          increment = "| RB-INC-147 | Recommendations Focadas com Divulgação Progressiva | Implementation | Draft | 0.1.0 | [rb-inc-147-focused-recommendations.md](./implementation/increments/rb-inc-147-focused-recommendations.md) |"
          context = "| RB-CTX-147 | Context Pack do RB-INC-147 — Recommendations Focadas com Divulgação Progressiva | Implementation Context Pack | Draft | 0.1.0 | [rb-inc-147-focused-recommendations.md](./implementation/context-packs/rb-inc-147-focused-recommendations.md) |"

          if increment not in text or context not in text:
              anchor = "| RB-CTX-146 | Context Pack do RB-INC-146 — Promoção Imutável de Staged Production Deployment | Implementation Context Pack | Draft | 0.1.0 | [rb-inc-146-vercel-immutable-promotion.md](./implementation/context-packs/rb-inc-146-vercel-immutable-promotion.md) |\n\n## Status possíveis"
              replacement = f"| RB-CTX-146 | Context Pack do RB-INC-146 — Promoção Imutável de Staged Production Deployment | Implementation Context Pack | Draft | 0.1.0 | [rb-inc-146-vercel-immutable-promotion.md](./implementation/context-packs/rb-inc-146-vercel-immutable-promotion.md) |\n{increment}\n{context}\n\n## Status possíveis"
              if anchor not in text:
                  raise SystemExit("Registry anchor not found")
              registry.write_text(text.replace(anchor, replacement, 1), encoding="utf-8")

          increment_doc = Path("docs/implementation/increments/rb-inc-147-focused-recommendations.md")
          increment_text = increment_doc.read_text(encoding="utf-8")
          increment_note = (
              "\n\n## 18. Exceção operacional temporária para o Registry\n\n"
              "Para atualizar `docs/registry.md` sem reescrever manualmente o arquivo extenso pelo connector, foi utilizado exclusivamente na branch o helper `.github/workflows/rb-inc-147-registry-helper.yml`.\n\n"
              "A exceção é limitada à manutenção documental: o helper apenas registra `RB-INC-147`/`RB-CTX-147`, documenta esta exceção e remove o próprio arquivo antes do estado final da branch. Ele não altera CI canônico, aplicação, domínio, dados, secrets ou Production e não deve aparecer no diff final da PR.\n"
          )
          if "## 18. Exceção operacional temporária para o Registry" not in increment_text:
              increment_doc.write_text(increment_text.rstrip() + increment_note, encoding="utf-8")

          context_doc = Path("docs/implementation/context-packs/rb-inc-147-focused-recommendations.md")
          context_text = context_doc.read_text(encoding="utf-8")
          context_note = (
              "\n\n## 20. Exceção operacional temporária para o Registry\n\n"
              "Fica autorizada exclusivamente durante a preparação desta branch a criação transitória de `.github/workflows/rb-inc-147-registry-helper.yml` para registrar `RB-INC-147` e `RB-CTX-147` em `docs/registry.md`.\n\n"
              "O helper deve remover a si próprio no mesmo ciclo, não pode modificar workflows canônicos, executar Production, acessar secrets de aplicação ou permanecer no diff final. Qualquer outro arquivo sob `.github/workflows/**` continua proibido.\n"
          )
          if "## 20. Exceção operacional temporária para o Registry" not in context_text:
              context_doc.write_text(context_text.rstrip() + context_note, encoding="utf-8")

      - name: Remove temporary helper and commit documentation
        shell: bash
        run: |
          set -euo pipefail
          git rm --ignore-unmatch .github/workflows/rb-inc-147-registry-helper.yml
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/registry.md docs/implementation/increments/rb-inc-147-focused-recommendations.md docs/implementation/context-packs/rb-inc-147-focused-recommendations.md
          git commit -m "docs(rb-inc-147): register increment and context pack"
          git push origin HEAD:codex/rb-inc-147-focused-recommendations
