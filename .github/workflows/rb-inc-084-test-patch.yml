name: RB-INC-084 Test Patch

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize
    paths:
      - .github/workflows/rb-inc-084-test-patch.yml

permissions:
  contents: write

jobs:
  patch-test:
    if: github.head_ref == 'feature/rb-inc-084-apply-itinerary-proposal-transaction'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/rb-inc-084-apply-itinerary-proposal-transaction
          fetch-depth: 0

      - name: Preserve Decision invocation event on failure
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          test = Path("packages/database/src/apply-itinerary-proposal-transaction.test.ts")
          content = test.read_text(encoding="utf-8")
          pattern = re.compile(
              r'\s*vi\.mocked\(context\.fragments\.decision\.persist\)\.mockRejectedValueOnce\(\s*new Error\("falha intencional na Decision"\),\s*\);'
          )
          replacement = '''
              vi.mocked(context.fragments.decision.persist).mockImplementationOnce(async () => {
                context.events.push("persist-decision");
                throw new Error("falha intencional na Decision");
              });'''
          content, count = pattern.subn(replacement, content, count=1)
          if count != 1:
              raise SystemExit(f"Expected one Decision failure mock, found {count}")
          test.write_text(content, encoding="utf-8")
          Path(".github/workflows/rb-inc-084-test-patch.yml").unlink()
          PY

      - name: Commit test correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/database/src/apply-itinerary-proposal-transaction.test.ts .github/workflows/rb-inc-084-test-patch.yml
          git commit -m "fix(database): preserve Decision failure event"
          git push origin HEAD:feature/rb-inc-084-apply-itinerary-proposal-transaction

# regex-trigger
