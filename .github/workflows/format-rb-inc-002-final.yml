name: Format RB-INC-002 Final

on:
  push:
    branches:
      - feature/rb-inc-002-product-shell
    paths:
      - ".github/workflows/format-rb-inc-002-final.yml"

permissions:
  contents: write

jobs:
  format:
    name: Format product shell stylesheet
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v6
        with:
          ref: feature/rb-inc-002-product-shell

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format stylesheet
        run: pnpm exec prettier --write --ignore-path /dev/null apps/web/app/product-shell.css

      - name: Commit formatting
        run: |
          git config user.name "routebook-automation"
          git config user.email "routebook-automation@users.noreply.github.com"
          git add apps/web/app/product-shell.css

          if git diff --cached --quiet; then
            exit 0
          fi

          git commit -m "style: format product shell stylesheet"
          git push origin HEAD:feature/rb-inc-002-product-shell
