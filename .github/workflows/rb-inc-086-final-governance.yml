name: RB-INC-086 Final Governance

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize
    paths:
      - .github/workflows/rb-inc-086-final-governance.yml

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'feature/rb-inc-086-better-auth-session-foundation'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/rb-inc-086-better-auth-session-foundation
          fetch-depth: 0
      - name: Record final evidence
        run: |
          python - <<'PY'
          from pathlib import Path

          matrix = Path("docs/implementation/traceability-matrix.md")
          content = matrix.read_text(encoding="utf-8")
          old = "| RB-INC-086 | RB-SEC-001, RB-DATA-001–002, RB-ADR-007–008 e RB-INC-085 | #197 | `feature/rb-inc-086-better-auth-session-foundation`, PR #198 | Better Auth 1.6.14, schema e migration 0020, rota Next.js e resolução server-side de sessão | validações finais em execução | Em validação |"
          new = "| RB-INC-086 | RB-SEC-001, RB-DATA-001–002, RB-ADR-007–008 e RB-INC-085 | #197 | `feature/rb-inc-086-better-auth-session-foundation`, PR #198 | Better Auth 1.6.14, schema e migration 0020, rota Next.js e resolução server-side de sessão | runs 30769434778 e 30769434775; migration 0020, PostgreSQL real, smoke, build Turbopack e E2E responsivo verdes | Pronto para integração |"
          if old not in content:
              raise SystemExit("RB-INC-086 traceability row not found")
          matrix.write_text(content.replace(old, new, 1), encoding="utf-8")
          Path(".github/workflows/rb-inc-086-final-governance.yml").unlink()
          PY
      - name: Commit final governance
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/implementation/traceability-matrix.md .github/workflows/rb-inc-086-final-governance.yml
          git commit -m "docs: record RB-INC-086 final validation"
          git push origin HEAD:feature/rb-inc-086-better-auth-session-foundation
