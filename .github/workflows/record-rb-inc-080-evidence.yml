name: Record RB-INC-080 Evidence

on:
  push:
    branches:
      - feature/rb-inc-080-decision-transactional-repository

permissions:
  contents: write

jobs:
  record:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/rb-inc-080-decision-transactional-repository
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Record approved evidence
        run: |
          python3 - <<'PY'
          from pathlib import Path

          increment = Path("docs/implementation/increments/rb-inc-080-decision-transactional-repository.md")
          text = increment.read_text()
          text = text.replace("- [ ] validações finais do CI aprovadas.", "- [x] validações finais do CI aprovadas.")
          text = text.replace(
              "As evidências serão registradas após a aprovação dos workflows da PR #184.",
              "- Documentation Validation `30752604088`: aprovada;\n- Engineering Validation `30752604108`: aprovada;\n- 200 documentos encontrados e registrados;\n- formatação, documentação, lint e typecheck aprovados;\n- migrations PostgreSQL existentes aplicadas com sucesso;\n- suíte integral aprovada, incluindo persistência global, idempotência, executor escopado e rollback da Decision;\n- smoke do servidor de desenvolvimento aprovado;\n- build de produção aprovado;\n- 56 testes Playwright responsivos aprovados;\n- registry e matriz de rastreabilidade sincronizados com `RB-INC-080` e `RB-CTX-080`;\n- HEAD validado: `d6725c3e78fba276fd8cc8216ed895febd7eec05`.",
          )
          increment.write_text(text)

          matrix = Path("docs/implementation/traceability-matrix.md")
          text = matrix.read_text()
          old = "| RB-INC-080 | RB-ADR-006, RB-ADR-027, RB-ARC-003–004, RB-DATA-002 e RB-INC-073–074, RB-INC-076, RB-INC-078–079 | #183 | `feature/rb-inc-080-decision-transactional-repository`, PR #184 | repository de Decision com executor escopado, idempotência preservada e rollback externo | PR #184; validação em andamento | Em validação |"
          new = "| RB-INC-080 | RB-ADR-006, RB-ADR-027, RB-ARC-003–004, RB-DATA-002 e RB-INC-073–074, RB-INC-076, RB-INC-078–079 | #183 | `feature/rb-inc-080-decision-transactional-repository`, PR #184 | repository de Decision com executor escopado, idempotência preservada e rollback externo | runs 30752604088 e 30752604108; 200 documentos, migrations, suíte integral, build e 56 E2E responsivos verdes | Integrado |"
          if old not in text:
              raise SystemExit("Linha de rastreabilidade do RB-INC-080 não encontrada")
          matrix.write_text(text.replace(old, new))
          PY
      - run: >-
          pnpm exec prettier --write
          docs/implementation/increments/rb-inc-080-decision-transactional-repository.md
          docs/implementation/traceability-matrix.md
      - run: git rm .github/workflows/record-rb-inc-080-evidence.yml
      - name: Commit evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/implementation
          git commit -m "docs(database): registrar evidências do RB-INC-080"
          git push origin HEAD:feature/rb-inc-080-decision-transactional-repository
