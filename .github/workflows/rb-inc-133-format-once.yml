name: Format RB-INC-133 once

on:
  push:
    branches:
      - codex/rb-inc-133-production-migration-gate
    paths:
      - .github/workflows/rb-inc-133-format-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/rb-inc-133-production-migration-gate
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write packages/database/src/migration-ledger-status.test.ts
      - name: Commit exact formatter output
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/rb-inc-133-format-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/database/src/migration-ledger-status.test.ts .github/workflows/rb-inc-133-format-once.yml
          git commit -m "style(database): apply repository Prettier"
          git push origin HEAD:codex/rb-inc-133-production-migration-gate
