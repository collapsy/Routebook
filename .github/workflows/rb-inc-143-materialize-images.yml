name: RB-INC-143 Materialize Place Images

# Temporary helper for RB-INC-143. Remove before PR readiness. This run inspects public Commons author metadata before materialization.
on:
  push:
    branches:
      - codex/rb-inc-143-place-images
    paths:
      - ".github/workflows/rb-inc-143-materialize-images.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rb-inc-143-materialize-place-images
  cancel-in-progress: false

jobs:
  materialize:
    name: Materialize curated Wikimedia assets
    if: github.ref == 'refs/heads/codex/rb-inc-143-place-images'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: codex/rb-inc-143-place-images
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Inspect public Commons author metadata for Sibauma
        shell: bash
        run: |
          node - <<'NODE'
          const userAgent = "RouteBookPlaceImageBot/0.1 (https://github.com/collapsy/Routebook)";
          const query = new URLSearchParams({
            action: "query",
            format: "json",
            formatversion: "2",
            titles: "File:Praia de Sibaúma.jpeg",
            prop: "imageinfo",
            iiprop: "extmetadata",
            iiextmetadatafilter: "Artist|LicenseShortName|LicenseUrl",
            origin: "*",
          });
          const response = await fetch(`https://commons.wikimedia.org/w/api.php?${query}`, {
            headers: { "User-Agent": userAgent, "Api-User-Agent": userAgent },
          });
          if (!response.ok) throw new Error(`Commons metadata respondeu ${response.status}`);
          const payload = await response.json();
          const metadata = payload.query?.pages?.[0]?.imageinfo?.[0]?.extmetadata ?? {};
          const strip = (value = "") => value.replace(/<[^>]*>/g, " ").replace(/\s+/g, " ").trim();
          console.log(`Sibauma Artist: ${strip(metadata.Artist?.value)}`);
          console.log(`Sibauma License: ${strip(metadata.LicenseShortName?.value)}`);
          console.log(`Sibauma LicenseUrl: ${strip(metadata.LicenseUrl?.value)}`);
          NODE

      - name: Materialize curated images
        run: pnpm materialize:place-images

      - name: Verify curated images offline
        run: pnpm test:place-images

      - name: Require scoped diff
        shell: bash
        run: |
          set -euo pipefail
          unexpected="$(git status --short | awk '{print $2}' | grep -Ev '^(apps/web/data/pipa-place-images\.json|apps/web/public/place-images/pipa/)' || true)"
          if [[ -n "$unexpected" ]]; then
            echo "::error::Materialização alterou caminho não autorizado:"
            echo "$unexpected"
            exit 1
          fi

      - name: Commit binary assets to feature branch
        shell: bash
        run: |
          set -euo pipefail
          git add apps/web/data/pipa-place-images.json apps/web/public/place-images/pipa/
          if git diff --cached --quiet; then
            echo "Assets já materializados; nenhuma alteração necessária."
            exit 0
          fi
          git config user.name "routebook-ci"
          git config user.email "routebook-ci@users.noreply.github.com"
          git commit -m "feat(place-images): materialize curated Pipa assets"
          git push origin HEAD:codex/rb-inc-143-place-images
