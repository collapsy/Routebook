name: Prepare RB-INC-002

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/prepare-rb-inc-002.yml"

permissions:
  contents: write

jobs:
  prepare:
    name: Format and synchronize increment
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v6
        with:
          ref: feature/rb-inc-002-product-shell

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Normalize product shell styles
        run: sed -i '/^[[:space:]]*aria-busy: true;[[:space:]]*$/d' apps/web/app/product-shell.css

      - name: Format new implementation files
        run: |
          pnpm exec prettier --write --ignore-path /dev/null \
            apps/web/app/layout.tsx \
            apps/web/app/product-shell.css \
            apps/web/app/page.tsx \
            apps/web/app/not-found.tsx \
            apps/web/app/viagens/layout.tsx \
            apps/web/app/viagens/page.tsx \
            apps/web/app/viagens/loading.tsx \
            apps/web/app/viagens/error.tsx \
            apps/web/app/viagens/nova/page.tsx \
            apps/web/components/app-shell.tsx \
            apps/web/components/empty-trips-state.tsx \
            apps/web/components/empty-trips-state.test.tsx \
            apps/web/components/product-error-state.tsx \
            apps/web/components/product-error-state.test.tsx \
            apps/web/e2e/home.spec.ts \
            apps/web/e2e/product-shell.spec.ts

      - name: Synchronize document registry
        shell: python
        run: |
          from pathlib import Path

          path = Path("docs/registry.md")
          content = path.read_text(encoding="utf-8")
          row = "| RB-INC-002 | Product Shell e Minhas Viagens | Implementation Increment | Draft | 0.1.0 | [rb-inc-002-product-shell.md](./implementation/increments/rb-inc-002-product-shell.md) |"
          anchor = "| RB-INC-001 | Bootstrap do Monorepo | Implementation Increment | Published | 1.0.0 | [rb-inc-001-monorepo-bootstrap.md](./implementation/increments/rb-inc-001-monorepo-bootstrap.md) |"

          if row not in content:
              content = content.replace(anchor, f"{anchor}\n{row}")
              path.write_text(content, encoding="utf-8")

      - name: Commit preparation
        run: |
          git config user.name "routebook-automation"
          git config user.email "routebook-automation@users.noreply.github.com"
          git add apps/web docs/registry.md

          if git diff --cached --quiet; then
            exit 0
          fi

          git commit -m "chore: format and register RB-INC-002"
          git push origin HEAD:feature/rb-inc-002-product-shell
