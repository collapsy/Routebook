name: Temporary RB040 Maintenance

on:
  push:
    branches:
      - feature/rb-inc-040-recommendation-persistence
    paths:
      - ".github/workflows/temporary-rb040-maintenance.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: corepack enable
      - name: Synchronize lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Format changed files
        run: pnpm exec prettier --write modules/decision-intelligence/src/recommendation-fingerprint.ts modules/decision-intelligence/src/recommendation-fingerprint.test.ts modules/decision-intelligence/src/repository.ts modules/decision-intelligence/src/index.ts packages/database/src/schema.ts packages/database/src/recommendation-repository.ts packages/database/src/recommendation-repository.test.ts packages/database/src/index.ts packages/database/package.json packages/database/drizzle/0007_create_recommendations.sql packages/database/drizzle/meta/_journal.json docs/implementation/increments/rb-inc-040-recommendation-persistence.md docs/implementation/context-packs/rb-inc-040-recommendation-persistence.md docs/registry.md
      - name: Commit generated changes
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml modules/decision-intelligence packages/database docs
          git commit -m "chore: synchronize RB-INC-040 generated files"
          git push origin "HEAD:${{ github.ref_name }}"
