name: RB-INC-090 Lockfile

on:
  push:
    branches:
      - feature/rb-inc-090-authenticated-trip-workspace
    paths:
      - ".github/workflows/rb-inc-090-lockfile.yml"

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: feature/rb-inc-090-authenticated-trip-workspace

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Update lockfile
        run: pnpm install --lockfile-only

      - name: Remove workflow and commit
        shell: bash
        run: |
          rm .github/workflows/rb-inc-090-lockfile.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml .github/workflows/rb-inc-090-lockfile.yml
          git commit -m "chore: update lockfile for identity access dependency"
          git push origin HEAD:feature/rb-inc-090-authenticated-trip-workspace
