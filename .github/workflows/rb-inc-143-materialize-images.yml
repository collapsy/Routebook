name: RB-INC-143 Finalize Temporary Helper

# Final one-shot run: register RB-INC-143/RB-CTX-143 and remove this helper.
on:
  push:
    branches:
      - codex/rb-inc-143-place-images
    paths:
      - ".github/workflows/rb-inc-143-materialize-images.yml"

permissions:
  contents: write

jobs:
  finalize:
    name: Finalize RB-INC-143 temporary helper
    if: github.ref == 'refs/heads/codex/rb-inc-143-place-images'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: codex/rb-inc-143-place-images
          fetch-depth: 1

      - name: Register RB-INC-143 and RB-CTX-143
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("docs/registry.md")
          text = path.read_text(encoding="utf-8")
          inc = "| RB-INC-143 | Enriquecimento Governado de Imagens Reais dos Places de Pipa | Implementation | Draft | 0.1.0 | [rb-inc-143-place-images.md](./implementation/increments/rb-inc-143-place-images.md) |"
          ctx = "| RB-CTX-143 | Context Pack do RB-INC-143 — Enriquecimento Governado de Imagens Reais | Implementation Context Pack | Draft | 0.1.0 | [rb-inc-143-place-images.md](./implementation/context-packs/rb-inc-143-place-images.md) |"
          anchor = "| RB-CTX-142 | Context Pack do RB-INC-142 — Descoberta Orgânica e Ingestão Governada de Places | Implementation Context Pack | Draft | 0.1.0 | [rb-inc-142-organic-place-ingestion.md](./implementation/context-packs/rb-inc-142-organic-place-ingestion.md) |"

          if inc not in text or ctx not in text:
              if anchor not in text:
                  raise SystemExit("Âncora RB-CTX-142 não encontrada no Registry.")
              text = text.replace(anchor, f"{anchor}\n{inc}\n{ctx}", 1)
              path.write_text(text, encoding="utf-8")
          PY

      - name: Validate documentation
        run: node scripts/validate-docs.mjs

      - name: Remove temporary helper and require scoped diff
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/rb-inc-143-materialize-images.yml
          unexpected="$(git status --short --untracked-files=all | awk '{print $2}' | grep -Ev '^(docs/registry\.md|\.github/workflows/rb-inc-143-materialize-images\.yml)$' || true)"
          if [[ -n "$unexpected" ]]; then
            echo "::error::Finalização alterou caminho não autorizado:"
            echo "$unexpected"
            exit 1
          fi

      - name: Commit finalization to feature branch
        shell: bash
        run: |
          set -euo pipefail
          git add docs/registry.md .github/workflows/rb-inc-143-materialize-images.yml
          git config user.name "routebook-ci"
          git config user.email "routebook-ci@users.noreply.github.com"
          git commit -m "docs(rb-inc-143): register increment and remove temporary helper"
          git push origin HEAD:codex/rb-inc-143-place-images
