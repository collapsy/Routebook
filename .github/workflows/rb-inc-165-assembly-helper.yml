name: RB-INC-165 Assembly Helper

on:
  push:
    branches:
      - codex/rb-inc-165-itinerary-daily-timeline
    paths:
      - .github/workflows/rb-inc-165-assembly-helper.yml

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/rb-inc-165-itinerary-daily-timeline
          fetch-depth: 0

      - name: Apply mechanical RB-165 alignment
        shell: python
        run: |
          from pathlib import Path

          registry = Path("docs/registry.md")
          text = registry.read_text()
          anchor = "| RB-CTX-164 | Context Pack do RB-INC-164 — Identidade única e catálogo external-first de Places | Implementation Context Pack | Draft | 0.1.0 | [rb-inc-164-unified-place-identity.md](./implementation/context-packs/rb-inc-164-unified-place-identity.md) |"
          additions = "\n| RB-INC-165 | Roteiro diário operacional e timeline contextual | Implementation | Draft | 0.1.0 | [rb-inc-165-itinerary-daily-timeline.md](./implementation/increments/rb-inc-165-itinerary-daily-timeline.md) |\n| RB-CTX-165 | Context Pack do RB-INC-165 — Roteiro diário operacional e timeline contextual | Implementation Context Pack | Draft | 0.1.0 | [rb-inc-165-itinerary-daily-timeline.md](./implementation/context-packs/rb-inc-165-itinerary-daily-timeline.md) |"
          if "| RB-INC-165 |" not in text:
              if anchor not in text:
                  raise SystemExit("Registry anchor not found")
              text = text.replace(anchor, anchor + additions)
              registry.write_text(text)

          page = Path("apps/web/app/viagens/[tripId]/roteiro/page.tsx")
          text = page.read_text()
          category_anchor = 'const proposalErrorMessages: Readonly<Record<string, string>> = {'
          category_block = '''const categoryLabels = {\n  beach: "Praia",\n  gastronomy: "Gastronomia",\n  nature: "Natureza",\n  nightlife: "Vida noturna",\n} as const;\n\n'''
          if "const categoryLabels =" not in text:
              text = text.replace(category_anchor, category_block + category_anchor)
          text = text.replace('place ? ` · ${place.category}` : ""', 'place ? ` · ${categoryLabels[place.category]}` : ""')
          page.write_text(text)

          itinerary = Path("apps/web/e2e/itinerary.spec.ts")
          text = itinerary.read_text()
          old = '''  const journey = page.getByRole("navigation", { name: "Jornada de planejamento" });\n  await expect(journey).toContainText("1. Explorar");\n  await expect(journey).toContainText("2. Salvos");\n  await expect(journey).toContainText("3. Roteiro");\n  await expect(journey).toContainText("4. Revisar");'''
          new = '''  await expect(\n    page.getByRole("navigation", { name: "Jornada de planejamento" }),\n  ).toHaveCount(0);\n  await expect(page.getByRole("link", { name: "Revisar" })).toBeVisible();'''
          if old not in text:
              raise SystemExit("Old journey assertion not found")
          text = text.replace(old, new)
          text = text.replace('test("orienta um dia vazio pela jornada antes das ações manuais"', 'test("prioriza a timeline do dia vazio antes das ações secundárias"')

          replacements = {
            '  await submitAndExpectActionRedirect(\n    page,\n    () => page.getByRole("button", { name: `Remover ${activityTitle} do roteiro` }).click(),': '  await page.locator(`summary[aria-label="Opções de ${activityTitle}"]`).click();\n  await submitAndExpectActionRedirect(\n    page,\n    () => page.getByRole("button", { name: `Remover ${activityTitle} do roteiro` }).click(),',
            '  await page.locator(`summary[aria-label="Editar ${activityTitle}"]`).click();': '  await page.locator(`summary[aria-label="Opções de ${activityTitle}"]`).click();\n  await page.locator(`summary[aria-label="Editar ${activityTitle}"]`).click();',
            '  await submitAndExpectActionRedirect(\n    page,\n    () => page.getByRole("button", { name: `Subir ${secondTitle} no roteiro` }).click(),': '  await page.locator(`summary[aria-label="Opções de ${secondTitle}"]`).click();\n  await submitAndExpectActionRedirect(\n    page,\n    () => page.getByRole("button", { name: `Subir ${secondTitle} no roteiro` }).click(),',
            '  await page.locator(`summary[aria-label="Mover ${activityTitle} para outro dia"]`).click();': '  await page.locator(`summary[aria-label="Opções de ${activityTitle}"]`).click();\n  await page.locator(`summary[aria-label="Mover ${activityTitle} para outro dia"]`).click();',
          }
          for source, target in replacements.items():
              if source not in text:
                  raise SystemExit(f"E2E replacement anchor missing: {source[:80]}")
              text = text.replace(source, target, 1)
          itinerary.write_text(text)

          active = Path("apps/web/e2e/active-trip-experience.spec.ts")
          text = active.read_text()
          anchor = '''  const activity = page.locator(".itinerary-day-card").filter({ hasText: "Passeio do Dia atual" });\n  await expect(activity).toBeVisible();'''
          replacement = anchor + '''\n  await activity.locator('summary[aria-label="Opções de Passeio do Dia atual"]').click();'''
          if anchor not in text:
              raise SystemExit("Active trip activity anchor missing")
          text = text.replace(anchor, replacement, 1)
          active.write_text(text)

      - name: Remove helper and commit
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/rb-inc-165-assembly-helper.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            apps/web/app/viagens/'[tripId]'/roteiro/page.tsx \
            apps/web/e2e/itinerary.spec.ts \
            apps/web/e2e/active-trip-experience.spec.ts \
            docs/registry.md
          git commit -m "chore: finalize RB-165 assembly"
          git push origin HEAD:codex/rb-inc-165-itinerary-daily-timeline
