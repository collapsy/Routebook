name: RB-INC-093 E2E Diagnostic Patch

on:
  pull_request:
    paths:
      - ".github/workflows/documentation-validation.yml"

permissions:
  contents: write

jobs:
  apply-e2e-diagnostics:
    name: Apply bounded acceptance diagnostics
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Patch test diagnostics and restore workflow
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const path = "apps/web/e2e/itinerary-proposal-review.spec.ts";
          let source = fs.readFileSync(path, "utf8");

          const openHelper = 'async function openAcceptance(page: Page, tripId: string): Promise<void> {\n  await page.goto(`/viagens/${tripId}/roteiro/proposta`);\n  await page.getByText("Aceitar proposta", { exact: true }).click();\n  await page.getByRole("checkbox", { name: /atualizará o Roteiro/i }).check();\n}';
          const helpers = `${openHelper}

async function submitAcceptance(
  page: Page,
  tripId: string,
  kind: "applied" | "replay",
): Promise<void> {
  const expectedPath = \`/viagens/\${tripId}/roteiro?propostaAceita=\${kind}\`;
  await page.getByRole("button", { name: "Confirmar e aceitar proposta" }).click();

  await expect
    .poll(
      async () => {
        const currentUrl = new URL(page.url());
        if (\`\${currentUrl.pathname}\${currentUrl.search}\` === expectedPath) {
          return expectedPath;
        }

        const alert = page.getByRole("alert");
        if (await alert.isVisible().catch(() => false)) {
          return \`alert:\${await alert.textContent()}\`;
        }

        const status = page.getByRole("status");
        if (await status.isVisible().catch(() => false)) {
          return \`status:\${await status.textContent()}\`;
        }

        if (
          await page
            .getByText("Aplicando a proposta e atualizando o Roteiro…")
            .isVisible()
            .catch(() => false)
        ) {
          return "pending";
        }

        return \`url:\${currentUrl.pathname}\${currentUrl.search}\`;
      },
      { timeout: 15_000 },
    )
    .toBe(expectedPath);
}`;

          const appliedBlock = '  await Promise.all([\n    page.waitForURL(/\\/roteiro\\?propostaAceita=applied$/),\n    page.getByRole("button", { name: "Confirmar e aceitar proposta" }).click(),\n  ]);';
          const replayBlock = '    await Promise.all([\n      replayPage.waitForURL(/\\/roteiro\\?propostaAceita=replay$/),\n      replayPage.getByRole("button", { name: "Confirmar e aceitar proposta" }).click(),\n    ]);';

          if (!source.includes(openHelper)) throw new Error("openAcceptance helper marker not found");
          if (source.split(appliedBlock).length - 1 !== 2) {
            throw new Error("expected exactly two applied submission blocks");
          }
          if (!source.includes(replayBlock)) throw new Error("replay submission marker not found");

          source = source.replace(openHelper, helpers);
          source = source.replace(
            appliedBlock,
            '  await submitAcceptance(page, fixture.tripId, "applied");',
          );
          source = source.replace(
            appliedBlock,
            '    await submitAcceptance(page, fixture.tripId, "applied");',
          );
          source = source.replace(
            replayBlock,
            '    await submitAcceptance(replayPage, fixture.tripId, "replay");',
          );
          fs.writeFileSync(path, source);
          NODE

          git fetch origin main
          git checkout origin/main -- .github/workflows/documentation-validation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/e2e/itinerary-proposal-review.spec.ts .github/workflows/documentation-validation.yml
          git commit -m "test: bound acceptance navigation and surface action errors"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
