name: RB-INC-088 Fix Rollback Test

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize
    paths:
      - .github/workflows/rb-inc-088-fix-rollback-test.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'feature/rb-inc-088-personal-account-authenticated-trip'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/rb-inc-088-personal-account-authenticated-trip
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: corepack enable
      - name: Patch wrapped error assertion
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          path = Path("packages/database/src/authenticated-trip-service-postgres.test.ts")
          content = path.read_text(encoding="utf-8")

          helper = '''
          function errorChainContains(error: unknown, expected: string): boolean {
            let current: unknown = error;
            const visited = new Set<unknown>();

            while (current instanceof Error && !visited.has(current)) {
              visited.add(current);
              if (current.message.includes(expected)) return true;
              current = current.cause;
            }

            return false;
          }
          '''
          if "function errorChainContains" not in content:
              marker = "\n\nbeforeAll(async () => {"
              if marker not in content:
                  raise SystemExit("beforeAll marker not found")
              content = content.replace(marker, "\n" + helper + marker, 1)

          pattern = re.compile(
              r'''    try \{\n      await expect\(\n        createPostgresAuthenticatedTrip\(\n          \{ userId: rollbackUserId, trip: tripInput\("Rollback autenticado"\) \},\n          database,\n          now,\n        \),\n      \)\.rejects\.toThrow\("RB-INC-088 forced Trip failure"\);\n    \} finally \{'''
          )
          replacement = '''    let failure: unknown;
            try {
              await createPostgresAuthenticatedTrip(
                { userId: rollbackUserId, trip: tripInput("Rollback autenticado") },
                database,
                now,
              );
            } catch (error) {
              failure = error;
            } finally {'''
          content, count = pattern.subn(replacement, content, count=1)
          if count != 1:
              raise SystemExit(f"rollback assertion replacements: {count}")

          marker = "    const ownerships = await database"
          position = content.rfind(marker)
          if position < 0:
              raise SystemExit("rollback ownership query not found")
          assertions = '''    expect(failure).toBeInstanceOf(Error);
            expect(errorChainContains(failure, "RB-INC-088 forced Trip failure")).toBe(true);

          '''
          content = content[:position] + assertions + content[position:]
          path.write_text(content, encoding="utf-8")
          PY
          pnpm install --frozen-lockfile
          pnpm exec prettier --write packages/database/src/authenticated-trip-service-postgres.test.ts
          rm .github/workflows/rb-inc-088-fix-rollback-test.yml
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/database/src/authenticated-trip-service-postgres.test.ts .github/workflows/rb-inc-088-fix-rollback-test.yml
          git commit -m "test: assert wrapped PostgreSQL rollback cause"
          git push origin HEAD:feature/rb-inc-088-personal-account-authenticated-trip
