name: RB-INC-085 Final Governance

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize
    paths:
      - .github/workflows/rb-inc-085-final-governance.yml

permissions:
  contents: write

jobs:
  patch-governance:
    if: github.head_ref == 'feature/rb-inc-085-postgres-accept-itinerary-proposal-service'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/rb-inc-085-postgres-accept-itinerary-proposal-service
          fetch-depth: 0

      - name: Record final RB-INC-085 evidence
        run: |
          python - <<'PY'
          from pathlib import Path

          matrix = Path("docs/implementation/traceability-matrix.md")
          content = matrix.read_text(encoding="utf-8")
          old = "| RB-INC-085 | RB-ARC-002–003, RB-DATA-002, RB-ADR-027 e RB-INC-072, RB-INC-084 | #195 | `feature/rb-inc-085-postgres-accept-itinerary-proposal-service`, PR #196 | composition root concreta, normalização antecipada e mapeamentos allowlisted de domínio e PostgreSQL | validações finais em execução | Em validação |"
          new = "| RB-INC-085 | RB-ARC-002–003, RB-DATA-002, RB-ADR-027 e RB-INC-072, RB-INC-084 | #195 | `feature/rb-inc-085-postgres-accept-itinerary-proposal-service`, PR #196 | composition root concreta, normalização antecipada e mapeamentos allowlisted de domínio e PostgreSQL | runs 30767412654 e 30767412648; suíte integral, PostgreSQL real, smoke, build e E2E responsivo verdes | Pronto para integração |"
          if old not in content:
              raise SystemExit("RB-INC-085 traceability row not found")
          matrix.write_text(content.replace(old, new, 1), encoding="utf-8")
          Path(".github/workflows/rb-inc-085-final-governance.yml").unlink()
          PY

      - name: Commit final governance
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/implementation/traceability-matrix.md .github/workflows/rb-inc-085-final-governance.yml
          git commit -m "docs: record RB-INC-085 final validation"
          git push origin HEAD:feature/rb-inc-085-postgres-accept-itinerary-proposal-service
