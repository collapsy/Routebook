name: RB-INC-093 Replay Contract Patch

on:
  pull_request:
    paths:
      - ".github/workflows/documentation-validation.yml"

permissions:
  contents: write

jobs:
  apply-replay-contract:
    name: Apply replay contract correction
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Patch contract, tests and restore workflow
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("node:fs");

          function replace(path, before, after) {
            const source = fs.readFileSync(path, "utf8");
            if (!source.includes(before)) {
              throw new Error(`Patch marker not found in ${path}`);
            }
            fs.writeFileSync(path, source.replace(before, after));
          }

          replace(
            "apps/web/lib/itinerary-proposal-acceptance.ts",
            `function proposalStatusError(
              proposal: ItineraryProposal,
              now: Date,
            ): AcceptItineraryProposalActionState | null {
              if (proposal.status === "expired") {
                return acceptItineraryProposalActionError("proposal-expired");
              }
              if (proposal.status !== "ready") {
                return acceptItineraryProposalActionError("proposal-not-ready");
              }
              if (
                !(proposal.validUntil instanceof Date) ||
                Number.isNaN(proposal.validUntil.getTime()) ||
                now.getTime() >= proposal.validUntil.getTime()
              ) {
                return acceptItineraryProposalActionError("proposal-expired");
              }
              return null;
            }`.replace(/^            /gm, ""),
            `function proposalStatusError(
              proposal: ItineraryProposal,
              now: Date,
            ): AcceptItineraryProposalActionState | null {
              if (proposal.status === "accepted") return null;
              if (proposal.status === "expired") {
                return acceptItineraryProposalActionError("proposal-expired");
              }
              if (proposal.status !== "ready") {
                return acceptItineraryProposalActionError("proposal-not-ready");
              }
              if (
                !(proposal.validUntil instanceof Date) ||
                Number.isNaN(proposal.validUntil.getTime()) ||
                now.getTime() >= proposal.validUntil.getTime()
              ) {
                return acceptItineraryProposalActionError("proposal-expired");
              }
              return null;
            }`.replace(/^            /gm, ""),
          );

          replace(
            "apps/web/lib/itinerary-proposal-acceptance.ts",
            `  if (itinerary.version !== request.expectedItineraryVersion) {
                return acceptItineraryProposalActionError("itinerary-version-mismatch");
              }`.replace(/^              /gm, ""),
            `  if (
                proposal.status === "ready" &&
                itinerary.version !== request.expectedItineraryVersion
              ) {
                return acceptItineraryProposalActionError("itinerary-version-mismatch");
              }`.replace(/^              /gm, ""),
          );

          replace(
            "apps/web/lib/itinerary-proposal-acceptance.test.ts",
            `  it("detecta versão concorrente antes da transação", async () => {`,
            `  it("encaminha Proposal accepted à reserva idempotente mesmo após a versão avançar", async () => {
              const execute = vi.fn(async () => success("replay"));
              const deps = dependencies({
                proposalRepository: {
                  findById: vi.fn(async () => proposal({ status: "accepted", acceptedAt: decidedAt })),
                },
                itineraryRepository: { findByTripId: vi.fn(async () => itinerary(5)) },
                acceptItineraryProposal: { execute },
              });

              await expect(executeAcceptItineraryProposalAction(input(), deps)).resolves.toEqual({
                status: "success",
                ...success("replay"),
              });
              expect(execute).toHaveBeenCalledOnce();
            });

            it("detecta versão concorrente antes da transação", async () => {`.replace(/^            /gm, ""),
          );
          NODE

          git fetch origin main
          git checkout origin/main -- .github/workflows/documentation-validation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/lib/itinerary-proposal-acceptance.ts apps/web/lib/itinerary-proposal-acceptance.test.ts .github/workflows/documentation-validation.yml
          git commit -m "fix: preserve idempotent replay through web acceptance boundary"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
