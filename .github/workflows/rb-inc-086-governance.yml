name: RB-INC-086 Governance

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize
    paths:
      - .github/workflows/rb-inc-086-governance.yml

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'feature/rb-inc-086-better-auth-session-foundation'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/rb-inc-086-better-auth-session-foundation
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: corepack enable
      - name: Register RB-INC-086
        run: |
          python - <<'PY'
          from pathlib import Path

          registry = Path("docs/registry.md")
          content = registry.read_text(encoding="utf-8")
          anchor = "| RB-CTX-085 | Context Pack do RB-INC-085 | Implementation Context | Draft | 0.1.0 | [rb-inc-085-postgres-accept-itinerary-proposal-service.md](./implementation/context-packs/rb-inc-085-postgres-accept-itinerary-proposal-service.md) |"
          rows = "\n".join([
              "| RB-INC-086 | Fundação Better Auth e Sessão Server-Side | Implementation | Draft | 0.1.0 | [rb-inc-086-better-auth-session-foundation.md](./implementation/increments/rb-inc-086-better-auth-session-foundation.md) |",
              "| RB-CTX-086 | Context Pack do RB-INC-086 | Implementation Context | Draft | 0.1.0 | [rb-inc-086-better-auth-session-foundation.md](./implementation/context-packs/rb-inc-086-better-auth-session-foundation.md) |",
          ])
          if "| RB-INC-086 |" not in content:
              if anchor not in content:
                  raise SystemExit("RB-CTX-085 registry anchor not found")
              content = content.replace(anchor, anchor + "\n" + rows, 1)
              registry.write_text(content, encoding="utf-8")

          matrix = Path("docs/implementation/traceability-matrix.md")
          content = matrix.read_text(encoding="utf-8")
          anchor = "| RB-INC-085 | RB-ARC-002–003, RB-DATA-002, RB-ADR-027 e RB-INC-072, RB-INC-084 | #195 | `feature/rb-inc-085-postgres-accept-itinerary-proposal-service`, PR #196 | composition root concreta, normalização antecipada e mapeamentos allowlisted de domínio e PostgreSQL | runs 30767412654 e 30767412648; suíte integral, PostgreSQL real, smoke, build e E2E responsivo verdes | Pronto para integração |"
          row = "| RB-INC-086 | RB-SEC-001, RB-DATA-001–002, RB-ADR-007–008 e RB-INC-085 | #197 | `feature/rb-inc-086-better-auth-session-foundation`, PR #198 | Better Auth 1.6.14, schema e migration 0020, rota Next.js e resolução server-side de sessão | validações finais em execução | Em validação |"
          if "| RB-INC-086 |" not in content:
              if anchor not in content:
                  raise SystemExit("RB-INC-085 traceability anchor not found")
              content = content.replace(anchor, anchor + "\n" + row, 1)
              matrix.write_text(content, encoding="utf-8")
          PY
      - name: Apply canonical formatting
        run: |
          pnpm install --frozen-lockfile
          pnpm exec prettier --write \
            apps/web/lib/auth-postgres.test.ts \
            docs/implementation/increments/rb-inc-086-better-auth-session-foundation.md \
            docs/implementation/context-packs/rb-inc-086-better-auth-session-foundation.md \
            docs/implementation/traceability-matrix.md \
            docs/registry.md
          rm .github/workflows/rb-inc-086-governance.yml
      - name: Commit governance
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/lib/auth-postgres.test.ts docs/implementation/increments/rb-inc-086-better-auth-session-foundation.md docs/implementation/context-packs/rb-inc-086-better-auth-session-foundation.md docs/implementation/traceability-matrix.md docs/registry.md .github/workflows/rb-inc-086-governance.yml
          git commit -m "docs: register and format RB-INC-086"
          git push origin HEAD:feature/rb-inc-086-better-auth-session-foundation
