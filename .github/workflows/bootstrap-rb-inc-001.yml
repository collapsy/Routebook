          base64 --decode /tmp/routebook-scaffold.tar.gz.b64 > /tmp/routebook-scaffold.tar.gz
          tar -xzf /tmp/routebook-scaffold.tar.gz -C .
          rm -f .github/workflows/bootstrap-rb-inc-001.yml

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Resolve exact stable dependencies
        run: |
          pnpm add -Dw turbo@latest prettier@latest --save-exact
          pnpm --filter @routebook/eslint-config add eslint-config-next@latest --save-exact
          pnpm --filter @routebook/web add next@latest react@latest react-dom@latest --save-exact
          pnpm --filter @routebook/web add -D \
            "@routebook/eslint-config@workspace:*" \
            "@routebook/typescript-config@workspace:*" \
            @playwright/test@latest \
            @tailwindcss/postcss@latest \
            @testing-library/jest-dom@latest \
            @testing-library/react@latest \
            @testing-library/user-event@latest \
            @types/node@latest \
            @types/react@latest \
            @types/react-dom@latest \
            @vitejs/plugin-react@latest \
            eslint@latest \
            jsdom@latest \
            tailwindcss@latest \
            typescript@latest \
            vite-tsconfig-paths@latest \
            vitest@latest \
            --save-exact

      - name: Commit scaffold and lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "feat(rb-inc-001): bootstrap executable monorepo"
          git push origin HEAD:feature/rb-inc-001-monorepo-bootstrap

      - name: Check formatting
        run: pnpm format:check

      - name: Validate documentation
        run: pnpm docs:validate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Run component tests
        run: pnpm test

      - name: Build application
        run: pnpm build

      - name: Install Playwright Chromium
        run: pnpm --filter @routebook/web exec playwright install --with-deps chromium

      - name: Run smoke tests
        run: pnpm test:e2e
