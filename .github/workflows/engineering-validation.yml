name: Engineering Validation

on:
  pull_request:
    paths:
      - ".github/workflows/engineering-validation.yml"
      - "docs/**"

permissions:
  contents: write

jobs:
  register-rb-inc-041:
    name: Register RB-INC-041 documentation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Register documents and traceability
        shell: python
        run: |
          from pathlib import Path

          registry_path = Path("docs/registry.md")
          registry = registry_path.read_text()
          registry_marker = "| RB-AI-007 |"
          registry_rows = (
              "| RB-INC-041 | Experiência de Recommendations Contextualizadas | Implementation Increment | Draft | 0.1.0 | [rb-inc-041-recommendations-experience.md](./implementation/increments/rb-inc-041-recommendations-experience.md) |\n"
              "| RB-CTX-041 | Context Pack do RB-INC-041 | Implementation Context Pack | Draft | 0.1.0 | [rb-inc-041-recommendations-experience.md](./implementation/context-packs/rb-inc-041-recommendations-experience.md) |\n"
          )
          if "| RB-INC-041 |" not in registry:
              registry_path.write_text(registry.replace(registry_marker, registry_rows + registry_marker))

          matrix_path = Path("docs/implementation/traceability-matrix.md")
          matrix = matrix_path.read_text()
          row_marker = "| RB-INC-005 | RB-PRD-004, RB-DOM-001, RB-DOM-003, RB-ARC-004, RB-DATA-001, RB-DATA-002 | #13 | `feature/rb-inc-005-traveler-context`, PR pendente | `traveler-profile`, migration, formulário de contexto e resumo na visão inicial | evidências pendentes dos workflows definitivos | Em execução |\n"
          rows = (
              "| RB-INC-038 | RB-FR-097–103, RB-BR-REC-002–011, RB-BR-DEC-002–007 | #83 | `feature/rb-inc-038-recommendation-core`, PR #88 | `modules/decision-intelligence`, Recommendation e Context Snapshot | run 30577548188, job 90989479708, SHA cc4d36d | Verde em Draft |\n"
              "| RB-INC-039 | RB-FR-097–103, RB-BR-REC-002–011 | #84 | `feature/rb-inc-039-deterministic-recommendations`, PR #89 | geração determinística, Reasons, Limitations, score e Confidence | run 30578729497, job 90993423544, SHA a6037c1 | Verde em Draft |\n"
              "| RB-INC-040 | RB-BR-REC-002–011, RB-ARC-004, RB-DATA-001, RB-DATA-002 | #85 | `feature/rb-inc-040-recommendation-persistence`, PR #90 | repository, schema, migration 0007, adapter e lifecycle | run 30580262262, job 90998461192, SHA 190ebd9 | Verde em Draft |\n"
              "| RB-INC-041 | RB-FR-097–103, RB-BR-REC-002–011, RB-UX-001–006, RB-DS-002–003 | #86 | `feature/rb-inc-041-recommendations-experience`, PR #91 | rota contextual, cards, composição e ação Ignorar | evidências pendentes do workflow definitivo | Em execução |\n"
          )
          if "| RB-INC-041 |" not in matrix:
              matrix = matrix.replace(row_marker, row_marker + rows)
              matrix_path.write_text(matrix)

      - name: Format documentation
        run: pnpm exec prettier --write docs/implementation/increments/rb-inc-041-recommendations-experience.md docs/implementation/context-packs/rb-inc-041-recommendations-experience.md docs/implementation/traceability-matrix.md docs/registry.md

      - name: Commit documentation registry
        shell: bash
        run: |
          if git diff --quiet -- docs; then
            echo "Documentation already registered."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          git commit -m "docs: register RB-INC-041"
          git push origin "HEAD:${{ github.head_ref }}"
