name: Engineering Validation

on:
  pull_request:
    paths:
      - ".github/workflows/engineering-validation.yml"
      - "apps/**"
      - "modules/**"
      - "docs/**"
      - "README.md"
      - "pnpm-lock.yaml"

permissions:
  contents: write

jobs:
  finalize-rb-inc-041:
    name: Finalize RB-INC-041 generated changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Apply deterministic patches
        shell: python
        run: |
          from pathlib import Path

          generator_path = Path("modules/decision-intelligence/src/deterministic-recommendations.ts")
          generator = generator_path.read_text()
          accommodation_marker = "  if (!context.accommodationCoordinate) {\n"
          interest_limitation = '''  if (context.interests.length === 0) {
            limitations.push({
              code: "traveler-interests-unavailable",
              message:
                "Nenhum interesse do grupo foi informado; a correspondência de categorias não participou do score.",
            });
          }

          '''
          if "traveler-interests-unavailable" not in generator:
              generator = generator.replace(accommodation_marker, interest_limitation + accommodation_marker)
              generator_path.write_text(generator)

          overview_path = Path("apps/web/app/viagens/[tripId]/page.tsx")
          overview = overview_path.read_text()
          overview = overview.replace(
              'import type { TripMapPoint } from "../../../lib/trip-map";\n',
              'import { resolveTripDestinationId } from "../../../lib/trip-destination";\nimport type { TripMapPoint } from "../../../lib/trip-map";\n',
          )
          local_resolver = '''function resolveDestinationId(destinationName: string): string | null {
            const normalized = destinationName.trim().toLocaleLowerCase("pt-BR");
            return normalized.includes("pipa") ? "pipa-rn-br" : null;
          }

          '''
          overview = overview.replace(local_resolver, "")
          overview = overview.replace(
              "const destinationId = resolveDestinationId(trip.destination.name);",
              "const destinationId = resolveTripDestinationId(trip.destination.name);",
          )
          recommendation_section = '''
                <section className="traveler-context-summary" aria-labelledby="recommendations-title">
                  <p className="product-eyebrow">Sugestões contextualizadas</p>
                  <h2 id="recommendations-title">Transforme o Contexto em uma lista explicável</h2>
                  <p>
                    As Recommendations usam apenas dados conhecidos da Viagem. Elas não salvam Lugares nem
                    alteram o Roteiro automaticamente.
                  </p>
                  <Link
                    className="product-secondary-action"
                    href={`/viagens/${tripId}/recomendacoes`}
                  >
                    Ver sugestões contextualizadas
                  </Link>
                </section>

          '''
          next_steps_marker = '      <section className="trip-next-steps" aria-labelledby="trip-next-steps-title">\n'
          if "recommendations-title" not in overview:
              overview = overview.replace(next_steps_marker, recommendation_section + next_steps_marker)
          overview_path.write_text(overview)

          screen_path = Path("docs/ux/screen-inventory.md")
          screen = screen_path.read_text()
          screen = screen.replace('version: "0.1.0"', 'version: "0.2.0"', 1)
          screen = screen.replace("last_updated: null", 'last_updated: "2026-07-30"', 1)
          screen_section = '''

          ---

          ## Superfície contextual — Recommendations da Viagem

          **Rota:** `/viagens/[tripId]/recomendacoes`

          **Papel:** transformar o Contexto já informado em uma lista pequena, ordenada e explicável de Places publicados, sem executar Decisions automáticas.

          **Entrada:** ação explícita na Visão Geral da Trip. A superfície não adiciona um sexto item à navegação global.

          **Conteúdo essencial:**

          - nome, categoria e resumo existente do Place;
          - distância geodésica da Accommodation, quando disponível;
          - RecommendationReasons baseadas em dados conhecidos;
          - RecommendationLimitations para Contexto ou dados indisponíveis;
          - RecommendationConfidence qualitativa, distinta de score e avaliação pública;
          - estado salvo ou planejado, quando aplicável;
          - acesso aos detalhes e ação `Ignorar`.

          **Estados:** carregando, Recommendations disponíveis, geração parcial, nenhum candidato publicado, erro recuperável, rejeitada, invalidada e lista atualizada após mudança do Contexto.

          **Acessibilidade:** um `h1` inequívoco, cards nomeados de forma acessível, Reasons e Limitations compreensíveis em texto, sucesso com `role="status"`, falha com `role="alert"`, foco visível, teclado e ausência de informação comunicada somente por cor.

          **Limites:** a tela não apresenta score bruto, estrelas, porcentagem arbitrária, preço, avaliação pública, horário, disponibilidade, rota, trânsito, duração ou texto atribuído à IA.
          '''
          if "## Superfície contextual — Recommendations da Viagem" not in screen:
              screen = screen.rstrip() + screen_section + "\n"
          screen_path.write_text(screen)

          wireframes_path = Path("docs/ux/wireframes.md")
          wireframes = wireframes_path.read_text()
          wireframes = wireframes.replace('version: "0.2.0"', 'version: "0.3.0"', 1)
          wireframes = wireframes.replace('last_updated: "2026-07-17"', 'last_updated: "2026-07-30"', 1)
          wireframe_section = '''

          ---

          ## Wireframe contextual — Recommendations da Viagem

          ```text
          ┌──────────────────────────────────────────────────────────────┐
          │ ← Voltar para a visão da viagem                            │
          │ DECISION INTELLIGENCE DETERMINÍSTICA                        │
          │ Sugestões para [nome da viagem]                             │
          │ Usa Contexto conhecido; nenhuma escolha é automática.       │
          ├──────────────────────────────────────────────────────────────┤
          │ [Aviso de Contexto parcial, quando aplicável]                │
          │ [Revisar Contexto]                                           │
          ├──────────────────────────────────────────────────────────────┤
          │ [Categoria]                                                  │
          │ Nome do Place                                                │
          │ Resumo publicado                                             │
          │ [Confiança qualitativa] [Salvo] [Já está no roteiro]         │
          │ Distância em linha reta + limitação da medida                │
          │                                                              │
          │ Por que foi sugerido                                         │
          │ • Reason baseada em dado conhecido                           │
          │                                                              │
          │ O que não foi possível considerar                            │
          │ • Limitation explícita                                       │
          │                                                              │
          │ [Ver detalhes] [Ignorar]                                     │
          └──────────────────────────────────────────────────────────────┘
          ```

          Em mobile, os cards ocupam uma coluna e as ações empilham. Em desktop, a lista pode usar duas colunas sem alterar a ordem semântica. Recommendations não entram na navegação global e não executam mudanças em Saved Place ou Itinerary.
          '''
          if "## Wireframe contextual — Recommendations da Viagem" not in wireframes:
              wireframes = wireframes.rstrip() + wireframe_section + "\n"
          wireframes_path.write_text(wireframes)

          registry_path = Path("docs/registry.md")
          registry = registry_path.read_text()
          registry = registry.replace(
              "| RB-UX-003 | Inventário de Telas | Experience | Published | 0.1.0 |",
              "| RB-UX-003 | Inventário de Telas | Experience | Published | 0.2.0 |",
          )
          registry = registry.replace(
              "| RB-UX-004 | Wireframes | Experience | Published | 0.2.0 |",
              "| RB-UX-004 | Wireframes | Experience | Published | 0.3.0 |",
          )
          registry_path.write_text(registry)

          readme_path = Path("README.md")
          readme = readme_path.read_text()
          readme = readme.replace(
              "| Mapas, Lugares, Roteiro e Recomendações | Não iniciados |",
              "| Contexto, Hospedagem, Lugares, salvos, mapas e Roteiro | Implementados nos incrementos integrados |\n| Recommendations determinísticas, explicáveis e persistidas | Implementadas no ciclo RB-INC-038–041 |\n| Decisions explícitas sobre Recommendations | Em implementação no RB-INC-042 |",
          )
          old_state = "A aplicação já cria uma `Trip` canônica, gera identidade interna, valida período e ownership, persiste o agregado e mantém a Viagem visível após recarregar a página."
          new_state = "A aplicação já cria e persiste Trips, Contexto dos viajantes, Accommodation, catálogo de Places, Saved Places, mapas, distância geodésica e Itinerary manual. O ciclo RB-INC-038–041 adiciona Recommendations determinísticas com Context Snapshot, Reasons, Limitations, Confidence qualitativa, persistência e rejeição explícita, sem uso de LLM ou mutação automática do Roteiro."
          readme = readme.replace(old_state, new_state)
          old_modules = '''├── modules/
          │   └── trip-management/
          ├── packages/
          │   ├── database/
          │   ├── eslint-config/
          │   ├── typescript-config/
          │   ├── domain/
          │   └── maps/'''
          new_modules = '''├── modules/
          │   ├── decision-intelligence/
          │   ├── geo-distance/
          │   ├── place-catalog/
          │   ├── saved-places/
          │   ├── traveler-profile/
          │   └── trip-management/
          ├── packages/
          │   ├── database/
          │   ├── eslint-config/
          │   └── typescript-config/'''
          readme = readme.replace(old_modules, new_modules)
          readme = readme.replace(
              "`modules/trip-management` contém o agregado e suas invariantes. `packages/database` contém schema, migration e adapter Drizzle. `packages/domain` e `packages/maps` permanecem placeholders documentais.",
              "Os módulos de domínio preservam ownership por bounded context. `modules/decision-intelligence` contém Recommendations, geração determinística e contratos de Decision; `packages/database` contém schemas, migrations e adapters Drizzle; `apps/web` concentra a composição e a experiência navegável.",
          )
          readme = readme.replace(
              "- [`docs/implementation/increments/rb-inc-003-trip-creation.md`](./docs/implementation/increments/rb-inc-003-trip-creation.md): escopo e evidências da criação de Viagem;",
              "- [`docs/implementation/increments/rb-inc-041-recommendations-experience.md`](./docs/implementation/increments/rb-inc-041-recommendations-experience.md): experiência explicável de Recommendations;",
          )
          readme_path.write_text(readme)

      - name: Synchronize lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile

      - name: Format changed files
        run: pnpm exec prettier --write README.md apps/web/app/viagens/[tripId]/page.tsx apps/web/app/viagens/[tripId]/recomendacoes apps/web/components/recommendation-card.tsx apps/web/components/recommendation-card.module.css apps/web/components/recommendation-card.test.tsx apps/web/e2e/recommendations-experience.spec.ts apps/web/lib/recommendation-experience.ts apps/web/lib/recommendation-experience.test.ts apps/web/lib/trip-destination.ts apps/web/package.json modules/decision-intelligence/src/deterministic-recommendations.ts modules/decision-intelligence/src/deterministic-recommendations-context.test.ts docs/ux/screen-inventory.md docs/ux/wireframes.md docs/implementation docs/registry.md pnpm-lock.yaml

      - name: Commit finalization
        shell: bash
        run: |
          if git diff --quiet; then
            echo "RB-INC-041 files already synchronized."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md apps/web modules/decision-intelligence docs pnpm-lock.yaml
          git commit -m "chore: finalize RB-INC-041 generated changes"
          git push origin "HEAD:${{ github.head_ref }}"
