name: Prepare RB-INC-003 Dependencies

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/prepare-rb-inc-003-dependencies.yml"

permissions:
  contents: write

jobs:
  prepare:
    name: Resolve exact database dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v6
        with:
          ref: feature/rb-inc-003-trip-creation

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Resolve exact runtime dependencies
        run: pnpm --filter @routebook/database add --save-exact drizzle-orm@0.45.2 postgres@3.4.9

      - name: Resolve exact migration tooling
        run: pnpm --filter @routebook/database add --save-dev --save-exact drizzle-kit@0.31.10 tsx@4.22.5

      - name: Format manifests
        run: pnpm exec prettier --write package.json apps/web/package.json modules/trip-management/package.json packages/database/package.json pnpm-workspace.yaml

      - name: Commit manifests and lockfile
        run: |
          git config user.name "routebook-automation"
          git config user.email "routebook-automation@users.noreply.github.com"
          git add package.json apps/web/package.json modules/trip-management/package.json packages/database/package.json pnpm-workspace.yaml pnpm-lock.yaml

          if git diff --cached --quiet; then
            exit 0
          fi

          git commit -m "chore: lock RB-INC-003 database dependencies"
          git push origin HEAD:feature/rb-inc-003-trip-creation
