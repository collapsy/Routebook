name: Overture Place Discovery

on:
  pull_request:
    paths:
      - ".github/workflows/overture-place-discovery.yml"
      - "scripts/normalize-overture-places.mjs"
      - "scripts/normalize-overture-places.test.mjs"
      - "apps/web/lib/overture-place-search.ts"
      - "apps/web/lib/overture-place-search.test.ts"
      - "apps/web/package.json"
      - "modules/place-catalog/src/external-place.ts"
      - "pnpm-lock.yaml"
  workflow_dispatch:
  schedule:
    - cron: "17 8 20 * *"

permissions:
  contents: read

concurrency:
  group: overture-place-discovery
  cancel-in-progress: true

jobs:
  discover-pipa:
    name: Discover Pipa place candidates
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install official Overture client
        run: pip install --disable-pip-version-check overturemaps==1.0.1

      - name: Resolve latest Overture release from public S3
        id: overture-release
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import re
          import urllib.parse
          import urllib.request
          import xml.etree.ElementTree as ET

          endpoint = "https://overturemaps-us-west-2.s3.us-west-2.amazonaws.com/"
          query = urllib.parse.urlencode(
              {"list-type": "2", "prefix": "release/", "delimiter": "/"}
          )
          with urllib.request.urlopen(f"{endpoint}?{query}", timeout=30) as response:
              root = ET.fromstring(response.read())

          namespace = {"s3": "http://s3.amazonaws.com/doc/2006-03-01/"}
          releases = []
          for prefix in root.findall("s3:CommonPrefixes/s3:Prefix", namespace):
              match = re.fullmatch(r"release/(\d{4}-\d{2}-\d{2}\.\d+)/", prefix.text or "")
              if match:
                  releases.append(match.group(1))

          if not releases:
              raise SystemExit("Nenhuma release Overture foi encontrada no bucket público.")

          print(f"release={max(releases)}")
          PY

      - name: Download Pipa and Tibau do Sul places
        shell: bash
        env:
          OVERTURE_RELEASE: ${{ steps.overture-release.outputs.release }}
        run: |
          set -euo pipefail
          echo "Using Overture release: ${OVERTURE_RELEASE}"
          # The CLI release callback currently consults the optional STAC catalog even
          # when --no-stac is requested. The official Python API accepts an explicit
          # release and stac=False, so it can read the same public S3 layout directly.
          python - <<'PY'
          import os

          from overturemaps import record_batch_reader
          from overturemaps.writers import copy, get_writer

          release = os.environ["OVERTURE_RELEASE"]
          bbox = (-35.15, -6.33, -34.98, -6.15)  # west,south,east,north
          reader = record_batch_reader(
              "place",
              bbox=bbox,
              release=release,
              connect_timeout=30,
              request_timeout=120,
              stac=False,
          )
          if reader is None:
              raise SystemExit("A consulta Overture não retornou um reader para a área de Pipa.")

          with get_writer(
              "geojson",
              "/tmp/overture-pipa-places.geojson",
              schema=reader.schema,
          ) as writer:
              copy(reader, writer)
          PY

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Smoke live PMTiles adapter used by product
        env:
          ROUTEBOOK_LIVE_OVERTURE: "1"
        run: pnpm --filter @routebook/web exec vitest run lib/overture-place-search.test.ts

      - name: Normalize governed candidates
        run: |
          node scripts/normalize-overture-places.mjs \
            --input /tmp/overture-pipa-places.geojson \
            --output /tmp/routebook-pipa-place-candidates.json \
            --min-confidence 0.7 \
            --limit 200

      - name: Summarize candidate artifact
        shell: bash
        run: |
          set -euo pipefail
          node -e '
            const fs = require("node:fs");
            const payload = JSON.parse(fs.readFileSync("/tmp/routebook-pipa-place-candidates.json", "utf8"));
            const counts = payload.candidates.reduce((acc, candidate) => {
              acc[candidate.category] = (acc[candidate.category] ?? 0) + 1;
              return acc;
            }, {});
            console.log(`Candidates: ${payload.candidateCount}/${payload.inputFeatureCount}`);
            console.log(`Rejected: ${payload.rejectedCount}`);
            console.log(`By category: ${JSON.stringify(counts)}`);
          '

      - name: Upload discovery artifact
        uses: actions/upload-artifact@v6
        with:
          name: routebook-pipa-place-candidates
          path: /tmp/routebook-pipa-place-candidates.json
          if-no-files-found: error
          retention-days: 14
