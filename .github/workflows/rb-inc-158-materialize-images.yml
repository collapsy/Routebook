name: RB-INC-158 Image Audit

on:
  push:
    branches:
      - codex/rb-inc-158-pipa-visual-coverage
    paths:
      - .github/workflows/rb-inc-158-materialize-images.yml

permissions:
  contents: read

jobs:
  audit-commons-candidates:
    runs-on: ubuntu-latest
    steps:
      - name: Audit Wikimedia Commons candidates
        shell: bash
        run: |
          node <<'NODE'
          const API = "https://commons.wikimedia.org/w/api.php";
          const USER_AGENT = "RouteBookPlaceImageBot/0.1 (https://github.com/collapsy/Routebook)";
          const targets = [
            { slug: "santuario-ecologico-de-pipa", query: '"Santuário Ecológico de Pipa"' },
            { slug: "praia-de-cacimbinhas", query: '"Praia Cacimbinhas" Tibau do Sul' },
            { slug: "praia-de-sibauma", query: '"Praia de Sibaúma" Tibau do Sul' },
            { slug: "praia-das-minas", query: '"Praia das Minas" Pipa Tibau do Sul' },
            { slug: "praia-do-centro", query: '"Praia de Pipa" Tibau do Sul' },
          ];

          function stripHtml(value = "") {
            return value
              .replace(/<[^>]*>/g, " ")
              .replaceAll("&amp;", "&")
              .replaceAll("&quot;", '"')
              .replaceAll("&#039;", "'")
              .replace(/\s+/g, " ")
              .trim();
          }

          for (const target of targets) {
            const query = new URLSearchParams({
              action: "query",
              format: "json",
              formatversion: "2",
              generator: "search",
              gsrsearch: target.query,
              gsrnamespace: "6",
              gsrlimit: "8",
              prop: "imageinfo",
              iiprop: "url|size|mime|sha1|extmetadata",
              iiurlwidth: "1280",
              iiextmetadatafilter: "Artist|LicenseShortName|LicenseUrl|ImageDescription|Credit",
              origin: "*",
            });
            const response = await fetch(`${API}?${query}`, {
              headers: { "User-Agent": USER_AGENT, "Api-User-Agent": USER_AGENT },
            });
            if (!response.ok) throw new Error(`Commons ${target.slug}: HTTP ${response.status}`);
            const payload = await response.json();
            const candidates = (payload.query?.pages ?? []).map((page) => {
              const info = page.imageinfo?.[0] ?? {};
              const metadata = info.extmetadata ?? {};
              return {
                title: page.title,
                descriptionUrl: info.descriptionurl,
                mime: info.mime,
                sha1: info.sha1,
                artist: stripHtml(metadata.Artist?.value),
                license: stripHtml(metadata.LicenseShortName?.value),
                licenseUrl: stripHtml(metadata.LicenseUrl?.value),
                description: stripHtml(metadata.ImageDescription?.value),
              };
            });
            console.log(`ROUTEBOOK_IMAGE_AUDIT ${target.slug}`);
            console.log(JSON.stringify(candidates, null, 2));
          }
          NODE
