name: Record RB-INC-078 Evidence

on:
  push:
    branches:
      - feature/rb-inc-078-itinerary-transactional-repository

permissions:
  contents: write

jobs:
  record:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/rb-inc-078-itinerary-transactional-repository
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Record approved evidence
        run: |
          python3 - <<'PY'
          from pathlib import Path

          increment = Path("docs/implementation/increments/rb-inc-078-itinerary-transactional-repository.md")
          text = increment.read_text()
          text = text.replace("- [ ] validações finais do CI aprovadas.", "- [x] validações finais do CI aprovadas.")
          text = text.replace(
              "As evidências serão registradas após a aprovação dos workflows da PR #180.",
              "- Documentation Validation `30751388318`: aprovada;\n- Engineering Validation `30751388307`: aprovada;\n- 196 documentos encontrados e registrados;\n- instalação congelada, formatação, documentação, lint e typecheck aprovados;\n- migrations PostgreSQL existentes aplicadas com sucesso;\n- suíte integral aprovada, incluindo modo global, executor escopado, ausência de nested transaction e rollback externo;\n- smoke do servidor de desenvolvimento aprovado;\n- build de produção aprovado;\n- 56 testes Playwright responsivos aprovados;\n- registry e matriz de rastreabilidade sincronizados com `RB-INC-078` e `RB-CTX-078`;\n- HEAD validado: `0c93ce331e1e1bad89eca9d7e41f03d9394944de`.",
          )
          increment.write_text(text)

          matrix = Path("docs/implementation/traceability-matrix.md")
          text = matrix.read_text()
          old = "| RB-INC-078 | RB-ADR-006, RB-ADR-027, RB-ARC-003–004, RB-DATA-002 e RB-INC-070, RB-INC-073–077 | #179 | `feature/rb-inc-078-itinerary-transactional-repository`, PR #180 | repository de Itinerary com executor escopado, modo global preservado e rollback externo | PR #180; validação em andamento | Em validação |"
          new = "| RB-INC-078 | RB-ADR-006, RB-ADR-027, RB-ARC-003–004, RB-DATA-002 e RB-INC-070, RB-INC-073–077 | #179 | `feature/rb-inc-078-itinerary-transactional-repository`, PR #180 | repository de Itinerary com executor escopado, modo global preservado e rollback externo | runs 30751388318 e 30751388307; 196 documentos, migrations, suíte integral, build e 56 E2E responsivos verdes | Integrado |"
          if old not in text:
              raise SystemExit("Linha de rastreabilidade do RB-INC-078 não encontrada")
          matrix.write_text(text.replace(old, new))
          PY
      - run: >-
          pnpm exec prettier --write
          docs/implementation/increments/rb-inc-078-itinerary-transactional-repository.md
          docs/implementation/traceability-matrix.md
      - run: git rm .github/workflows/record-rb-inc-078-evidence.yml
      - name: Commit evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/implementation
          git commit -m "docs(database): registrar evidências do RB-INC-078"
          git push origin HEAD:feature/rb-inc-078-itinerary-transactional-repository
