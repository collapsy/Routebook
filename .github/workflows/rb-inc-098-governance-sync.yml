name: RB-INC-098 Governance Sync

on:
  push:
    branches:
      - feature/rb-inc-098-postgres-authoritative-itinerary-proposal-context

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/rb-inc-098-postgres-authoritative-itinerary-proposal-context
      - name: Synchronize canonical governance
        run: |
          python3 - <<'PY'
          from pathlib import Path

          registry = Path("docs/registry.md")
          registry_text = registry.read_text()
          registry_rows = """| RB-INC-097 | Composição Autoritativa da Geração de Itinerary Proposal | Implementation | Draft | 0.1.0 | [rb-inc-097-authoritative-itinerary-proposal-generation.md](./implementation/increments/rb-inc-097-authoritative-itinerary-proposal-generation.md) |
          | RB-CTX-097 | Context Pack do RB-INC-097 | Implementation Context | Draft | 0.1.0 | [rb-inc-097-authoritative-itinerary-proposal-generation.md](./implementation/context-packs/rb-inc-097-authoritative-itinerary-proposal-generation.md) |
          | RB-INC-098 | Adapter PostgreSQL do Contexto Autoritativo de Itinerary Proposal | Implementation | Draft | 0.1.0 | [rb-inc-098-postgres-authoritative-itinerary-proposal-context.md](./implementation/increments/rb-inc-098-postgres-authoritative-itinerary-proposal-context.md) |
          | RB-CTX-098 | Context Pack do RB-INC-098 | Implementation Context | Draft | 0.1.0 | [rb-inc-098-postgres-authoritative-itinerary-proposal-context.md](./implementation/context-packs/rb-inc-098-postgres-authoritative-itinerary-proposal-context.md) |

          """
          if "| RB-INC-097 |" not in registry_text:
              registry_text = registry_text.replace("## Status possíveis", registry_rows + "## Status possíveis")
          registry.write_text(registry_text)

          matrix = Path("docs/implementation/traceability-matrix.md")
          matrix_text = matrix.read_text()
          evidence = """## Evidências do RB-INC-097

          | Evidência | Localização/resultado |
          | --- | --- |
          | definição do incremento | `docs/implementation/increments/rb-inc-097-authoritative-itinerary-proposal-generation.md` |
          | Context Pack | `docs/implementation/context-packs/rb-inc-097-authoritative-itinerary-proposal-generation.md` |
          | composição autoritativa | `modules/proposal-management/src/authoritative-itinerary-proposal-generation.ts` |
          | exports | `modules/proposal-management/src/index.ts` |
          | rastreabilidade | issue #219 e PR #220 |
          | CI | Engineering Validation `31067491527`, job `92508196343` |
          | integração | merge commit `8c8cce11d894feadd1f23a8d78c503642651628d` |

          ## Evidências previstas do RB-INC-098

          | Evidência | Localização |
          | --- | --- |
          | definição do incremento | `docs/implementation/increments/rb-inc-098-postgres-authoritative-itinerary-proposal-context.md` |
          | Context Pack | `docs/implementation/context-packs/rb-inc-098-postgres-authoritative-itinerary-proposal-context.md` |
          | adapter PostgreSQL | `packages/database/src/authoritative-itinerary-proposal-generation-context.ts` |
          | testes de integração | `packages/database/src/authoritative-itinerary-proposal-generation-context-postgres.test.ts` |
          | exports | `packages/database/src/index.ts` |
          | rastreabilidade | issue #221 e PR #222 |
          | schema | reutilização de `packages/database/src/schema.ts`, sem migration |

          """
          if "## Evidências do RB-INC-097" not in matrix_text:
              matrix_text = matrix_text.replace("## Cadeia mínima", evidence + "## Cadeia mínima")
          matrix.write_text(matrix_text)
          PY
      - name: Commit governance synchronization
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "collapsy"
          git config user.email "38116052+collapsy@users.noreply.github.com"
          git add docs/registry.md docs/implementation/traceability-matrix.md
          git commit -m "docs(rb-inc-098): synchronize registry and traceability"
          git push
