name: RB-INC-098 Format Diagnostic

on:
  workflow_dispatch:
  push:
    branches:
      - feature/rb-inc-098-postgres-authoritative-itinerary-proposal-context

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Format target files
        run: pnpm exec prettier --write packages/database/src/authoritative-itinerary-proposal-generation-context.ts packages/database/src/authoritative-itinerary-proposal-generation-context-postgres.test.ts
      - uses: actions/upload-artifact@v4
        with:
          name: rb-inc-098-formatted
          path: |
            packages/database/src/authoritative-itinerary-proposal-generation-context.ts
            packages/database/src/authoritative-itinerary-proposal-generation-context-postgres.test.ts
