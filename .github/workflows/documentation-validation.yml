name: Documentation Governance Update

on:
  pull_request:
    paths:
      - ".github/workflows/documentation-validation.yml"

permissions:
  contents: write

jobs:
  update-traceability:
    name: Update RB-INC-092 traceability
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Update matrix and restore canonical workflow
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("node:fs");

          const path = "docs/implementation/traceability-matrix.md";
          const marker = "\n## Evidências do RB-INC-003";
          const row = "| RB-INC-092 | RB-UX-004–006, RB-DS-002–003, RB-SEC-001, RB-ADR-007–008, RB-ADR-027 e RB-INC-091 | #209 | `feature/rb-inc-092-itinerary-proposal-acceptance-experience`, PR #210 | experiência autorizada de aceite, confirmação explícita, bloqueio de decisões concorrentes e feedback `applied`/`replay` | runs 30869999535 e 30869999538, job 91869867843, SHA 76cda755; 224 documentos, migrations, 540 testes, smoke, build e 65 E2E responsivos executados | Pronto para integração |";

          let matrix = fs.readFileSync(path, "utf8");
          if (!matrix.includes("| RB-INC-092 |")) {
            if (!matrix.includes(marker)) {
              throw new Error("Traceability insertion marker not found");
            }
            matrix = matrix.replace(marker, `\n${row}\n${marker}`);
            fs.writeFileSync(path, matrix);
          }
          NODE

          git fetch origin main
          git checkout origin/main -- .github/workflows/documentation-validation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/implementation/traceability-matrix.md .github/workflows/documentation-validation.yml
          git commit -m "docs: complete RB-INC-092 traceability governance"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
