name: RB-INC-075 Documentation Sync

on:
  push:
    branches:
      - feature/rb-inc-075-proposal-application-transaction-fragment

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Synchronize registry and traceability
        run: node scripts/sync-rb-inc-075-docs.mjs

      - name: Commit synchronized documentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: registrar RB-INC-075"
          git push origin "HEAD:${GITHUB_REF_NAME}"
