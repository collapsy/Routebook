name: RB-INC-158 Image Audit

on:
  push:
    branches:
      - codex/rb-inc-158-pipa-visual-coverage
    paths:
      - .github/workflows/rb-inc-158-materialize-images.yml

permissions:
  contents: read

jobs:
  audit-commons-candidates:
    runs-on: ubuntu-latest
    steps:
      - name: Audit exact Wikimedia Commons candidates
        shell: bash
        run: |
          node <<'NODE'
          const { writeFile } = require("node:fs/promises");
          const API = "https://commons.wikimedia.org/w/api.php";
          const USER_AGENT = "RouteBookPlaceImageBot/0.1 (https://github.com/collapsy/Routebook)";
          const targets = [
            {
              slug: "santuario-ecologico-de-pipa",
              fileTitle: "File:Santuário Ecológico de Pipa.jpg",
            },
            {
              slug: "praia-de-cacimbinhas",
              fileTitle: "File:A vista da Praia Cacimbinhas de acima das rochas.JPG",
            },
            {
              slug: "praia-do-centro",
              fileTitle: "File:PipaBeachView.JPG",
            },
            {
              slug: "praia-de-sibauma",
              fileTitle: "File:Praia de Sibaúma.jpeg",
            },
          ];

          function stripHtml(value = "") {
            return value
              .replace(/<[^>]*>/g, " ")
              .replaceAll("&amp;", "&")
              .replaceAll("&quot;", '"')
              .replaceAll("&#039;", "'")
              .replace(/\s+/g, " ")
              .trim();
          }

          (async () => {
            const audit = [];
            for (const target of targets) {
              const query = new URLSearchParams({
                action: "query",
                format: "json",
                formatversion: "2",
                titles: target.fileTitle,
                prop: "imageinfo",
                iiprop: "url|size|mime|sha1|extmetadata",
                iiurlwidth: "1280",
                iiextmetadatafilter: "Artist|LicenseShortName|LicenseUrl|ImageDescription|Credit",
                origin: "*",
              });
              const response = await fetch(`${API}?${query}`, {
                headers: { "User-Agent": USER_AGENT, "Api-User-Agent": USER_AGENT },
              });
              if (!response.ok) throw new Error(`Commons ${target.slug}: HTTP ${response.status}`);
              const payload = await response.json();
              const page = payload.query?.pages?.[0];
              const info = page?.imageinfo?.[0] ?? {};
              const metadata = info.extmetadata ?? {};
              audit.push({
                ...target,
                resolvedTitle: page?.title,
                missing: Boolean(page?.missing),
                descriptionUrl: info.descriptionurl,
                originalUrl: info.url,
                thumbnailUrl: info.thumburl,
                width: info.width,
                height: info.height,
                mime: info.mime,
                sha1: info.sha1,
                artist: stripHtml(metadata.Artist?.value),
                license: stripHtml(metadata.LicenseShortName?.value),
                licenseUrl: stripHtml(metadata.LicenseUrl?.value),
                description: stripHtml(metadata.ImageDescription?.value),
              });
            }
            await writeFile("commons-audit.json", `${JSON.stringify(audit, null, 2)}\n`);
          })().catch((error) => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE

      - name: Upload audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: rb-inc-158-commons-audit
          path: commons-audit.json
          if-no-files-found: error
          retention-days: 1
