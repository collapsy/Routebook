name: RB-INC-084 Date Patch

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize
    paths:
      - .github/workflows/rb-inc-084-date-patch.yml

permissions:
  contents: write

jobs:
  patch-dates:
    if: github.head_ref == 'feature/rb-inc-084-apply-itinerary-proposal-transaction'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/rb-inc-084-apply-itinerary-proposal-transaction
          fetch-depth: 0

      - name: Serialize PostgreSQL timestamp parameters
        run: |
          python - <<'PY'
          from pathlib import Path

          repository = Path("packages/database/src/proposal-application-repository.ts")
          content = repository.read_text(encoding="utf-8")
          create_old = '''            ${application.startedAt},
                      ${application.startedAt},
                      ${application.startedAt}'''
          create_new = '''            ${application.startedAt.toISOString()},
                      ${application.startedAt.toISOString()},
                      ${application.startedAt.toISOString()}'''
          terminal_old = '''            completed_at = ${application.completedAt},
                      failure_code = ${application.status === "failed" ? application.failureCode : null},
                      updated_at = ${application.completedAt}'''
          terminal_new = '''            completed_at = ${application.completedAt.toISOString()},
                      failure_code = ${application.status === "failed" ? application.failureCode : null},
                      updated_at = ${application.completedAt.toISOString()}'''
          if create_old not in content:
              raise SystemExit("Started timestamp block not found")
          if terminal_old not in content:
              raise SystemExit("Terminal timestamp block not found")
          content = content.replace(create_old, create_new, 1)
          content = content.replace(terminal_old, terminal_new, 1)
          repository.write_text(content, encoding="utf-8")
          Path(".github/workflows/rb-inc-084-date-patch.yml").unlink()
          PY

      - name: Commit timestamp serialization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/database/src/proposal-application-repository.ts .github/workflows/rb-inc-084-date-patch.yml
          git commit -m "fix(database): serialize proposal application timestamps"
          git push origin HEAD:feature/rb-inc-084-apply-itinerary-proposal-transaction
