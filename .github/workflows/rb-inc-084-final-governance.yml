name: RB-INC-084 Final Governance

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize
    paths:
      - .github/workflows/rb-inc-084-final-governance.yml

permissions:
  contents: write

jobs:
  patch-governance:
    if: github.head_ref == 'feature/rb-inc-084-apply-itinerary-proposal-transaction'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/rb-inc-084-apply-itinerary-proposal-transaction
          fetch-depth: 0

      - name: Record final RB-INC-084 evidence
        run: |
          python - <<'PY'
          from pathlib import Path

          matrix = Path("docs/implementation/traceability-matrix.md")
          content = matrix.read_text(encoding="utf-8")
          old = "| RB-INC-084 | RB-ADR-027, RB-ARC-003–004, RB-DATA-002 e RB-INC-072–075, RB-INC-079, RB-INC-083 | #191 | `feature/rb-inc-084-apply-itinerary-proposal-transaction`, PR #194 | composição PostgreSQL dos quatro fragments em uma única transação física | validações finais em execução | Em validação |"
          new = "| RB-INC-084 | RB-ADR-027, RB-ARC-003–004, RB-DATA-002 e RB-INC-072–075, RB-INC-079, RB-INC-083 | #191 | `feature/rb-inc-084-apply-itinerary-proposal-transaction`, PR #194 | composição PostgreSQL dos quatro fragments em uma única transação física | runs 30766253051 e 30766253063; migration 0019, suíte integral, smoke, build e E2E responsivo verdes | Pronto para integração |"
          if old not in content:
              raise SystemExit("RB-INC-084 traceability row not found")
          matrix.write_text(content.replace(old, new, 1), encoding="utf-8")
          Path(".github/workflows/rb-inc-084-final-governance.yml").unlink()
          PY

      - name: Commit final governance
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/implementation/traceability-matrix.md .github/workflows/rb-inc-084-final-governance.yml
          git commit -m "docs: record RB-INC-084 final validation"
          git push origin HEAD:feature/rb-inc-084-apply-itinerary-proposal-transaction
