name: Engineering Validation

on:
  pull_request:
    paths:
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - ".node-version"
      - ".npmrc"
      - ".prettierignore"
      - "prettier.config.mjs"
      - "apps/**"
      - "packages/**"
      - "scripts/**"
      - "docs/**"
      - ".github/workflows/engineering-validation.yml"
  push:
    branches:
      - main
    paths:
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - ".node-version"
      - ".npmrc"
      - ".prettierignore"
      - "prettier.config.mjs"
      - "apps/**"
      - "packages/**"
      - "scripts/**"
      - "docs/**"
      - ".github/workflows/engineering-validation.yml"

permissions:
  contents: read

concurrency:
  group: engineering-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate monorepo
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Validate documentation
        run: pnpm docs:validate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Run component tests
        run: pnpm test

      - name: Build application
        run: pnpm build

      - name: Install Playwright Chromium
        run: pnpm --filter @routebook/web exec playwright install --with-deps chromium

      - name: Run smoke tests
        run: pnpm test:e2e
