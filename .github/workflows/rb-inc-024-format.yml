name: RB-INC-024 Formatter

on:
  push:
    branches:
      - feature/rb-inc-024-itinerary-persistence

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format schema
        run: pnpm exec prettier --write packages/database/src/schema.ts

      - name: Commit exact formatter output
        run: |
          if git diff --quiet -- packages/database/src/schema.ts; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/database/src/schema.ts
          git commit -m "style(database): apply exact schema formatting"
          git push origin HEAD:feature/rb-inc-024-itinerary-persistence
