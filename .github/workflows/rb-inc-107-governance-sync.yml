name: RB-INC-107 Governance Sync

on:
  push:
    branches:
      - feature/rb-inc-107-itinerary-proposal-edit-e2e
    paths:
      - .github/workflows/rb-inc-107-governance-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/rb-inc-107-itinerary-proposal-edit-e2e
          fetch-depth: 0

      - name: Synchronize registry and traceability
        shell: python
        run: |
          from pathlib import Path

          registry = Path("docs/registry.md")
          text = registry.read_text()
          rows = """| RB-INC-107 | E2E Integral da Edição de Itinerary Proposal | Implementation | Draft | 0.1.0 | [rb-inc-107-itinerary-proposal-edit-e2e.md](./implementation/increments/rb-inc-107-itinerary-proposal-edit-e2e.md) |
          | RB-CTX-107 | Context Pack do RB-INC-107 | Implementation Context | Draft | 0.1.0 | [rb-inc-107-itinerary-proposal-edit-e2e.md](./implementation/context-packs/rb-inc-107-itinerary-proposal-edit-e2e.md) |
          """
          if "| RB-INC-107 |" not in text:
              text = text.replace("\n## Status possíveis", "\n" + rows + "\n## Status possíveis", 1)
          registry.write_text(text)

          matrix = Path("docs/implementation/traceability-matrix.md")
          text = matrix.read_text()
          for old in ['last_updated: "2026-08-08"', 'last_updated: "2026-08-07"']:
              text = text.replace(old, 'last_updated: "2026-08-09"', 1)
          section = """## Evidências previstas do RB-INC-107

          | Evidência | Localização/resultado |
          | --- | --- |
          | definição do incremento | `docs/implementation/increments/rb-inc-107-itinerary-proposal-edit-e2e.md` |
          | Context Pack | `docs/implementation/context-packs/rb-inc-107-itinerary-proposal-edit-e2e.md` |
          | E2E integral de edição | `apps/web/e2e/itinerary-proposal-editing.spec.ts` |
          | autenticação/Trip E2E | `apps/web/e2e/support/authenticated-trip.ts` |
          | fronteira UI | `apps/web/components/itinerary-proposal-activity-editor.tsx` |
          | Server Action | `apps/web/app/viagens/[tripId]/roteiro/proposta/edit-action.ts` |
          | application service | `editAndPersistItineraryProposalProposedActivity` |
          | persistência | `DrizzleItineraryProposalRepository` e PostgreSQL |
          | prova de isolamento | id/version/Activities do Itinerary comparados antes/depois |
          | concorrência | Proposal transicionada para `rejected` antes do submit; `proposal-not-ready` sem sobrescrita |
          | rastreabilidade | issue #243 e PR #244 |
          | SHA técnico validado | `35b4b75859ffa6e4decd7b498189da84ff3a6a76` |
          | Engineering Validation técnico | #1329, run `31327843734`, success em format, docs, lint, typecheck, migrations, testes, smoke, build e Playwright responsivo |
          | migration | nenhuma nova migration; cadeia RB-INC-104–106 reutilizada |

          """
          if "## Evidências previstas do RB-INC-107" not in text:
              text = text.replace("## Cadeia mínima", section + "## Cadeia mínima", 1)
          matrix.write_text(text)

      - name: Commit canonical governance and remove helper
        run: |
          rm .github/workflows/rb-inc-107-governance-sync.yml
          git config user.name "collapsy"
          git config user.email "38116052+collapsy@users.noreply.github.com"
          git add docs/registry.md docs/implementation/traceability-matrix.md .github/workflows/rb-inc-107-governance-sync.yml
          git commit -m "docs(rb-inc-107): synchronize canonical governance"
          git push origin HEAD:feature/rb-inc-107-itinerary-proposal-edit-e2e
