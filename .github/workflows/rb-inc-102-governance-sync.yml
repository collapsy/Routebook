name: RB-INC-102 Governance Sync

on:
  push:
    branches:
      - feature/rb-inc-102-authorized-itinerary-proposal-generation-e2e
    paths:
      - ".github/workflows/rb-inc-102-governance-sync.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/rb-inc-102-authorized-itinerary-proposal-generation-e2e
      - name: Synchronize registry and traceability
        shell: python
        run: |
          from pathlib import Path

          registry_path = Path("docs/registry.md")
          registry = registry_path.read_text()
          registry_anchor = "| RB-CTX-101 | Context Pack do RB-INC-101 | Implementation Context | Draft | 0.1.0 | [rb-inc-101-authorized-itinerary-proposal-generation-experience.md](./implementation/context-packs/rb-inc-101-authorized-itinerary-proposal-generation-experience.md) |"
          registry_rows = """| RB-INC-102 | Integração E2E da Geração Autorizada de Itinerary Proposal | Implementation | Draft | 0.1.0 | [rb-inc-102-authorized-itinerary-proposal-generation-e2e.md](./implementation/increments/rb-inc-102-authorized-itinerary-proposal-generation-e2e.md) |
          | RB-CTX-102 | Context Pack do RB-INC-102 | Implementation Context | Draft | 0.1.0 | [rb-inc-102-authorized-itinerary-proposal-generation-e2e.md](./implementation/context-packs/rb-inc-102-authorized-itinerary-proposal-generation-e2e.md) |"""
          if "| RB-INC-102 |" not in registry:
              if registry_anchor not in registry:
                  raise SystemExit("RB-CTX-101 registry anchor not found")
              registry = registry.replace(registry_anchor, registry_anchor + "\n" + registry_rows, 1)
              registry_path.write_text(registry)

          matrix_path = Path("docs/implementation/traceability-matrix.md")
          matrix = matrix_path.read_text()
          matrix_section = """## Evidências previstas do RB-INC-102

          | Evidência | Localização |
          | --- | --- |
          | definição do incremento | `docs/implementation/increments/rb-inc-102-authorized-itinerary-proposal-generation-e2e.md` |
          | Context Pack | `docs/implementation/context-packs/rb-inc-102-authorized-itinerary-proposal-generation-e2e.md` |
          | E2E de geração | `apps/web/e2e/itinerary-proposal-generation.spec.ts` |
          | experiência | `apps/web/app/viagens/[tripId]/roteiro/proposta/page.tsx` |
          | Server Action | `apps/web/app/viagens/[tripId]/roteiro/proposta/generate-action.ts` |
          | persistência | `packages/database/src/proposal-repository.ts` |
          | rastreabilidade | issue #231 e PR #234 |
          | migration | nenhuma nova migration; contratos existentes reutilizados |

          """
          if "## Evidências previstas do RB-INC-102" not in matrix:
              marker = "## Cadeia mínima"
              if marker not in matrix:
                  raise SystemExit("traceability marker not found")
              matrix = matrix.replace(marker, matrix_section + marker, 1)
              matrix_path.write_text(matrix)
      - name: Commit canonical governance
        run: |
          git config user.name "collapsy"
          git config user.email "38116052+collapsy@users.noreply.github.com"
          git add docs/registry.md docs/implementation/traceability-matrix.md
          git rm .github/workflows/rb-inc-102-governance-sync.yml
          git commit -m "docs(rb-inc-102): sync registry and traceability"
          git push
