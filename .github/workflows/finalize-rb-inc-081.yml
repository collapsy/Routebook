name: Finalize RB-INC-081

on:
  push:
    branches:
      - feature/rb-inc-081-itinerary-proposal-acceptance-decision

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/rb-inc-081-itinerary-proposal-acceptance-decision
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Update governance indexes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          registry = Path("docs/registry.md")
          text = registry.read_text()
          if "| RB-INC-081 |" not in text:
              rows = [
                  "| RB-INC-081 | Decision de Aceite de Itinerary Proposal | Implementation | Draft | 0.1.0 | [rb-inc-081-itinerary-proposal-acceptance-decision.md](./implementation/increments/rb-inc-081-itinerary-proposal-acceptance-decision.md) |",
                  "| RB-CTX-081 | Context Pack do RB-INC-081 | Implementation Context | Draft | 0.1.0 | [rb-inc-081-itinerary-proposal-acceptance-decision.md](./implementation/context-packs/rb-inc-081-itinerary-proposal-acceptance-decision.md) |",
              ]
              lines = text.splitlines()
              index = max(i for i, line in enumerate(lines) if line.startswith("| RB-")) + 1
              lines[index:index] = rows
              registry.write_text("\n".join(lines) + "\n")

          matrix = Path("docs/implementation/traceability-matrix.md")
          text = matrix.read_text()
          if "| RB-INC-081 |" not in text:
              row = "| RB-INC-081 | RB-DOM-001, RB-DOM-003–004, RB-ADR-027 e RB-INC-072, RB-INC-079–080 | #185 | `feature/rb-inc-081-itinerary-proposal-acceptance-decision`, PR #186 | Decision de aceite com option, snapshot, effect e invariantes cruzadas | PR #186; validação em andamento | Em validação |"
              lines = text.splitlines()
              indexes = [i for i, line in enumerate(lines) if line.startswith("| RB-INC-")]
              lines.insert((max(indexes) + 1) if indexes else len(lines), row)
              matrix.write_text("\n".join(lines) + "\n")
          PY
      - name: Apply canonical formatting
        run: >-
          pnpm exec prettier --write
          modules/decision-intelligence/src/decision.ts
          modules/decision-intelligence/src/itinerary-proposal-decision.test.ts
          modules/decision-intelligence/src/index.ts
          docs/implementation/increments/rb-inc-081-itinerary-proposal-acceptance-decision.md
          docs/implementation/context-packs/rb-inc-081-itinerary-proposal-acceptance-decision.md
          docs/implementation/traceability-matrix.md
          docs/registry.md
      - run: git rm .github/workflows/finalize-rb-inc-081.yml
      - name: Commit governance and formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add modules/decision-intelligence/src docs/implementation docs/registry.md
          git commit -m "docs(decision-intelligence): concluir governança do RB-INC-081"
          git push origin HEAD:feature/rb-inc-081-itinerary-proposal-acceptance-decision
