name: Finalize RB-INC-002

on:
  push:
    branches:
      - feature/rb-inc-002-product-shell
    paths:
      - ".github/workflows/finalize-rb-inc-002.yml"

permissions:
  contents: write

jobs:
  finalize:
    name: Synchronize final metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v6
        with:
          ref: feature/rb-inc-002-product-shell

      - name: Synchronize registry and CSS
        shell: python
        run: |
          from pathlib import Path

          registry = Path("docs/registry.md")
          content = registry.read_text(encoding="utf-8")
          content = content.replace(
              "| RB-INC-002 | Product Shell e Minhas Viagens | Implementation Increment | Draft | 0.1.0 |",
              "| RB-INC-002 | Product Shell e Minhas Viagens | Implementation Increment | Published | 1.0.0 |",
          )
          registry.write_text(content, encoding="utf-8")

          stylesheet = Path("apps/web/app/product-shell.css")
          css = stylesheet.read_text(encoding="utf-8")
          css = css.replace("\n.loading-card {\n}\n", "\n")
          stylesheet.write_text(css, encoding="utf-8")

      - name: Commit final metadata
        run: |
          git config user.name "routebook-automation"
          git config user.email "routebook-automation@users.noreply.github.com"
          git add docs/registry.md apps/web/app/product-shell.css

          if git diff --cached --quiet; then
            exit 0
          fi

          git commit -m "docs: finalize RB-INC-002 publication"
          git push origin HEAD:feature/rb-inc-002-product-shell
