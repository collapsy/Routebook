name: Temporary Format Sync

on:
  pull_request:
    paths:
      - ".github/workflows/temporary-format-sync.yml"

permissions:
  contents: write

jobs:
  format:
    name: Format changed sources
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format sources
        run: pnpm exec prettier --write modules/decision-intelligence/src/recommendation.ts modules/decision-intelligence/src/recommendation.test.ts

      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet -- modules/decision-intelligence/src; then
            echo "Sources already formatted."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add modules/decision-intelligence/src
          git commit -m "style: format decision intelligence sources"
          git push origin "HEAD:${{ github.head_ref }}"
