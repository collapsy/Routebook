name: Finalize RB-INC-078

on:
  push:
    branches:
      - feature/rb-inc-078-itinerary-transactional-repository

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/rb-inc-078-itinerary-transactional-repository
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Update governance indexes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          registry = Path("docs/registry.md")
          registry_text = registry.read_text()
          if "| RB-INC-078 |" not in registry_text:
              rows = [
                  "| RB-INC-078 | Repository Transacional de Itinerary | Implementation | Draft | 0.1.0 | [rb-inc-078-itinerary-transactional-repository.md](./implementation/increments/rb-inc-078-itinerary-transactional-repository.md) |",
                  "| RB-CTX-078 | Context Pack do RB-INC-078 | Implementation Context | Draft | 0.1.0 | [rb-inc-078-itinerary-transactional-repository.md](./implementation/context-packs/rb-inc-078-itinerary-transactional-repository.md) |",
              ]
              lines = registry_text.splitlines()
              index = max(i for i, line in enumerate(lines) if line.startswith("| RB-")) + 1
              lines[index:index] = rows
              registry.write_text("\n".join(lines) + "\n")

          matrix = Path("docs/implementation/traceability-matrix.md")
          matrix_text = matrix.read_text()
          if "| RB-INC-078 |" not in matrix_text:
              row = "| RB-INC-078 | RB-ADR-006, RB-ADR-027, RB-ARC-003–004, RB-DATA-002 e RB-INC-070, RB-INC-073–077 | #179 | `feature/rb-inc-078-itinerary-transactional-repository`, PR #180 | repository de Itinerary com executor escopado, modo global preservado e rollback externo | PR #180; validação em andamento | Em validação |"
              lines = matrix_text.splitlines()
              indexes = [i for i, line in enumerate(lines) if line.startswith("| RB-INC-")]
              index = (max(indexes) + 1) if indexes else len(lines)
              lines.insert(index, row)
              matrix.write_text("\n".join(lines) + "\n")
          PY
      - name: Apply canonical formatting
        run: >-
          pnpm exec prettier --write
          packages/database/src/itinerary-repository.ts
          packages/database/src/itinerary-repository.test.ts
          packages/database/src/index.ts
          docs/implementation/increments/rb-inc-078-itinerary-transactional-repository.md
          docs/implementation/context-packs/rb-inc-078-itinerary-transactional-repository.md
          docs/implementation/traceability-matrix.md
          docs/registry.md
      - run: git rm .github/workflows/finalize-rb-inc-078.yml
      - name: Commit governance and formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/database/src docs/implementation docs/registry.md
          git commit -m "docs(database): concluir governança do RB-INC-078"
          git push origin HEAD:feature/rb-inc-078-itinerary-transactional-repository
