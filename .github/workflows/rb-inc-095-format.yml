name: RB-INC-095 Temporary Formatter

on:
  push:
    branches:
      - feature/rb-inc-095-itinerary-proposal-generation-orchestration

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: feature/rb-inc-095-itinerary-proposal-generation-orchestration
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply canonical formatting
        run: >-
          pnpm exec prettier --write
          docs/implementation/context-packs/rb-inc-095-itinerary-proposal-generation-orchestration.md
          docs/implementation/increments/rb-inc-095-itinerary-proposal-generation-orchestration.md
          docs/implementation/traceability-matrix.md
          docs/registry.md
          modules/proposal-management/src/index.ts
          modules/proposal-management/src/itinerary-proposal-generation-service.test.ts
          modules/proposal-management/src/itinerary-proposal-generation-service.ts

      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/rb-inc-095-format.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style(rb-inc-095): aplicar formatação canônica"
          git push origin HEAD:feature/rb-inc-095-itinerary-proposal-generation-orchestration
