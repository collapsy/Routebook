name: RB-INC-160 branch cleanup

on:
  push:
    branches:
      - codex/rb-inc-160-complete-pipa-trip-guide

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: codex/rb-inc-160-complete-pipa-trip-guide
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Restore scoped Registry and format RB-INC-160 files
        run: node scripts/rb-inc-160-branch-cleanup.mjs
      - name: Commit cleanup
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/registry.md apps/web/e2e/trip-day-guide.spec.ts apps/web/lib/pipa-day-guide.test.ts apps/web/lib/pipa-day-guide.ts
          git commit -m "chore: clean RB-INC-160 branch diff"
          git push
