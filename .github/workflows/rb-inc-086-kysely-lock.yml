name: RB-INC-086 Kysely Lockfile

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize
    paths:
      - .github/workflows/rb-inc-086-kysely-lock.yml

permissions:
  contents: write

jobs:
  refresh:
    if: github.head_ref == 'feature/rb-inc-086-better-auth-session-foundation'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/rb-inc-086-better-auth-session-foundation
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: corepack enable
      - name: Refresh compatible lockfile
        run: |
          pnpm install --lockfile-only
          rm .github/workflows/rb-inc-086-kysely-lock.yml
      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/package.json pnpm-lock.yaml .github/workflows/rb-inc-086-kysely-lock.yml
          git commit -m "build: pin Kysely for Better Auth compatibility"
          git push origin HEAD:feature/rb-inc-086-better-auth-session-foundation
