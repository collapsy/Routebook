name: Sync RB-INC-001 Registry

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/sync-rb-inc-001-registry.yml"

permissions:
  contents: write

jobs:
  sync-registry:
    name: Synchronize document registry
    if: github.head_ref == 'feature/rb-inc-001-monorepo-bootstrap'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v6
        with:
          ref: feature/rb-inc-001-monorepo-bootstrap

      - name: Update RB-INC-001 registry row
        shell: python
        run: |
          from pathlib import Path

          path = Path("docs/registry.md")
          content = path.read_text(encoding="utf-8")
          old = "| RB-INC-001 | Bootstrap do Monorepo | Implementation Increment | Planned | 0.1.0 | [rb-inc-001-monorepo-bootstrap.md](./implementation/increments/rb-inc-001-monorepo-bootstrap.md) |"
          new = "| RB-INC-001 | Bootstrap do Monorepo | Implementation Increment | Published | 1.0.0 | [rb-inc-001-monorepo-bootstrap.md](./implementation/increments/rb-inc-001-monorepo-bootstrap.md) |"

          if old not in content:
              raise SystemExit("Expected RB-INC-001 registry row was not found")

          path.write_text(content.replace(old, new, 1), encoding="utf-8")

      - name: Commit registry synchronization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/registry.md
          git commit -m "docs(rb-inc-001): publish registry entry"
          git push origin HEAD:feature/rb-inc-001-monorepo-bootstrap
