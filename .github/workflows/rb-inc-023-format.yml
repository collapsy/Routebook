name: RB-INC-023 Formatter

on:
  push:
    branches:
      - feature/rb-inc-023-itinerary-core

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format itinerary
        run: pnpm exec prettier --write modules/trip-management/src/itinerary.ts

      - name: Commit exact formatter output
        run: |
          if git diff --quiet -- modules/trip-management/src/itinerary.ts; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add modules/trip-management/src/itinerary.ts
          git commit -m "style(itinerary): apply exact prettier output"
          git push origin HEAD:feature/rb-inc-023-itinerary-core
