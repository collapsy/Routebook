name: Refresh RB-INC-005 Lockfile

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/fix-rb-inc-005-types.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/rb-inc-005-traveler-context
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm exec prettier --write modules/traveler-profile/src/profile.test.ts modules/traveler-profile/package.json
      - name: Commit changes
        run: |
          git config user.name "routebook-automation"
          git config user.email "routebook-automation@users.noreply.github.com"
          git add pnpm-lock.yaml modules/traveler-profile
          git commit -m "fix: align traveler profile types and lockfile"
          git pull --rebase origin feature/rb-inc-005-traveler-context
          git push origin HEAD:feature/rb-inc-005-traveler-context
