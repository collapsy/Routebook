name: Format RB-INC-022

on:
  push:
    branches:
      - feature/rb-inc-022-trip-map

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: feature/rb-inc-022-trip-map

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format trip map files
        run: pnpm exec prettier --write apps/web/components/trip-map.tsx apps/web/components/trip-map.test.tsx

      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/components/trip-map.tsx apps/web/components/trip-map.test.tsx
          git commit -m "fix(web): apply repository prettier output"
          git push
