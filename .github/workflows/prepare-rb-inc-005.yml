name: Prepare RB-INC-005

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/prepare-rb-inc-005.yml"

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/rb-inc-005-traveler-context
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm exec prettier --write modules/traveler-profile packages/database apps/web/app/viagens apps/web/components/traveler-context-form.tsx apps/web/e2e/product-shell.spec.ts docs/implementation docs/registry.md
      - name: Commit preparation
        run: |
          git config user.name "routebook-automation"
          git config user.email "routebook-automation@users.noreply.github.com"
          git add pnpm-lock.yaml modules/traveler-profile packages/database apps/web/app/viagens apps/web/components/traveler-context-form.tsx apps/web/e2e/product-shell.spec.ts docs/implementation docs/registry.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: prepare RB-INC-005 validation"
          git pull --rebase origin feature/rb-inc-005-traveler-context
          git push origin HEAD:feature/rb-inc-005-traveler-context
