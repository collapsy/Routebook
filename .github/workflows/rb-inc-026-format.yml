name: RB-INC-026 Formatter

on:
  push:
    branches:
      - feature/rb-inc-026-saved-place-to-itinerary

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format saved place journey
        run: pnpm exec prettier --write apps/web/e2e/itinerary.spec.ts

      - name: Commit exact formatter output
        run: |
          if git diff --quiet -- apps/web/e2e/itinerary.spec.ts; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/e2e/itinerary.spec.ts
          git commit -m "style(web): apply exact saved place journey formatting"
          git push origin HEAD:feature/rb-inc-026-saved-place-to-itinerary
