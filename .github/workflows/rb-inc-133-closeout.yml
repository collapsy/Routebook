name: RB-INC-133 Closeout

on:
  push:
    branches:
      - codex/rb-inc-133-closeout
    paths:
      - .github/workflows/rb-inc-133-closeout.yml

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/rb-inc-133-closeout
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - run: corepack enable

      - run: pnpm install --frozen-lockfile

      - name: Atualizar evidências canônicas
        run: python scripts/rb-inc-133-closeout.py

      - name: Formatar documentação
        run: pnpm exec prettier --write docs/implementation/increments/rb-inc-133-production-migration-gate.md docs/implementation/context-packs/rb-inc-133-production-migration-gate.md docs/implementation/traceability-matrix.md

      - name: Validar documentação
        run: pnpm docs:validate

      - name: Remover artefatos temporários e publicar closeout
        shell: bash
        run: |
          set -euo pipefail
          rm -f _noop
          git rm .github/workflows/rb-inc-133-closeout.yml scripts/rb-inc-133-closeout.py
          git add docs/implementation/increments/rb-inc-133-production-migration-gate.md \
            docs/implementation/context-packs/rb-inc-133-production-migration-gate.md \
            docs/implementation/traceability-matrix.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: consolidar evidências do RB-INC-133"
          git push origin HEAD:codex/rb-inc-133-closeout
