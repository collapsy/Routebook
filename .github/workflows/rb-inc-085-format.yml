name: RB-INC-085 Format

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize
    paths:
      - .github/workflows/rb-inc-085-format.yml

permissions:
  contents: write

jobs:
  format:
    if: github.head_ref == 'feature/rb-inc-085-postgres-accept-itinerary-proposal-service'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/rb-inc-085-postgres-accept-itinerary-proposal-service
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Apply canonical formatting
        run: |
          pnpm exec prettier --write \
            packages/database/src/accept-itinerary-proposal-service.ts \
            packages/database/src/accept-itinerary-proposal-service.test.ts \
            packages/database/src/accept-itinerary-proposal-service-postgres.test.ts
          rm .github/workflows/rb-inc-085-format.yml
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/database/src/accept-itinerary-proposal-service.ts packages/database/src/accept-itinerary-proposal-service.test.ts packages/database/src/accept-itinerary-proposal-service-postgres.test.ts .github/workflows/rb-inc-085-format.yml
          git commit -m "style(database): format RB-INC-085 service"
          git push origin HEAD:feature/rb-inc-085-postgres-accept-itinerary-proposal-service
