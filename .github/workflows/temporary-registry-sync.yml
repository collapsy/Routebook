name: Temporary Registry Sync

on:
  pull_request:
    paths:
      - ".github/workflows/temporary-registry-sync.yml"

permissions:
  contents: write

jobs:
  registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
      - name: Insert registry entries
        shell: python
        run: |
          from pathlib import Path
          path = Path("docs/registry.md")
          text = path.read_text()
          marker = "| RB-AI-007 |"
          rows = (
              "| RB-INC-039 | Geração Determinística e Explicável de Recommendations | Implementation Increment | Draft | 0.1.0 | [rb-inc-039-deterministic-recommendations.md](./implementation/increments/rb-inc-039-deterministic-recommendations.md) |\n"
              "| RB-CTX-039 | Context Pack do RB-INC-039 | Implementation Context Pack | Draft | 0.1.0 | [rb-inc-039-deterministic-recommendations.md](./implementation/context-packs/rb-inc-039-deterministic-recommendations.md) |\n"
          )
          if "| RB-INC-039 |" not in text:
              text = text.replace(marker, rows + marker)
              path.write_text(text)
      - name: Commit registry
        shell: bash
        run: |
          if git diff --quiet -- docs/registry.md; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/registry.md
          git commit -m "docs: register RB-INC-039"
          git push origin "HEAD:${{ github.head_ref }}"
