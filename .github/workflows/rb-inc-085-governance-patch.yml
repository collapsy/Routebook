name: RB-INC-085 Governance Patch

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize
    paths:
      - .github/workflows/rb-inc-085-governance-patch.yml

permissions:
  contents: write

jobs:
  patch-governance:
    if: github.head_ref == 'feature/rb-inc-085-postgres-accept-itinerary-proposal-service'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/rb-inc-085-postgres-accept-itinerary-proposal-service
          fetch-depth: 0

      - name: Register RB-INC-085 governance
        run: |
          python - <<'PY'
          from pathlib import Path

          registry = Path("docs/registry.md")
          registry_text = registry.read_text(encoding="utf-8")
          registry_rows = (
              "| RB-INC-085 | Integração Concreta do AcceptItineraryProposal | Implementation | Draft | 0.1.0 | [rb-inc-085-postgres-accept-itinerary-proposal-service.md](./implementation/increments/rb-inc-085-postgres-accept-itinerary-proposal-service.md) |\n"
              "| RB-CTX-085 | Context Pack do RB-INC-085 | Implementation Context | Draft | 0.1.0 | [rb-inc-085-postgres-accept-itinerary-proposal-service.md](./implementation/context-packs/rb-inc-085-postgres-accept-itinerary-proposal-service.md) |\n"
          )
          if "| RB-INC-085 |" not in registry_text:
              marker = "| RB-CTX-084 | Context Pack do RB-INC-084 | Implementation Context | Draft | 0.1.0 | [rb-inc-084-apply-itinerary-proposal-transaction.md](./implementation/context-packs/rb-inc-084-apply-itinerary-proposal-transaction.md) |\n"
              if marker not in registry_text:
                  raise SystemExit("RB-CTX-084 marker not found in registry")
              registry_text = registry_text.replace(marker, marker + registry_rows, 1)
              registry.write_text(registry_text, encoding="utf-8")

          matrix = Path("docs/implementation/traceability-matrix.md")
          matrix_text = matrix.read_text(encoding="utf-8")
          matrix_row = "| RB-INC-085 | RB-ARC-002–003, RB-DATA-002, RB-ADR-027 e RB-INC-072, RB-INC-084 | #195 | `feature/rb-inc-085-postgres-accept-itinerary-proposal-service`, PR #196 | composition root concreta, normalização antecipada e mapeamentos allowlisted de domínio e PostgreSQL | validações finais em execução | Em validação |\n"
          if "| RB-INC-085 |" not in matrix_text:
              lines = matrix_text.splitlines(keepends=True)
              insertion = None
              for index, line in enumerate(lines):
                  if line.startswith("| RB-INC-084 |"):
                      insertion = index + 1
              if insertion is None:
                  marker = "\n## Evidências do RB-INC-003\n"
                  if marker not in matrix_text:
                      raise SystemExit("Traceability insertion point not found")
                  matrix_text = matrix_text.replace(marker, "\n" + matrix_row + marker, 1)
              else:
                  lines.insert(insertion, matrix_row)
                  matrix_text = "".join(lines)
              matrix.write_text(matrix_text, encoding="utf-8")

          Path(".github/workflows/rb-inc-085-governance-patch.yml").unlink()
          PY

      - name: Commit governance updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/registry.md docs/implementation/traceability-matrix.md .github/workflows/rb-inc-085-governance-patch.yml
          git commit -m "docs: register RB-INC-085 governance"
          git push origin HEAD:feature/rb-inc-085-postgres-accept-itinerary-proposal-service
