name: RB-INC-167 canonical formatting

on:
  push:
    branches:
      - codex/rb-inc-167-google-place-photos-refresh

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Format RB-INC-167 files
        shell: bash
        run: |
          pnpm exec prettier --write \
            'apps/web/app/viagens/[tripId]/lugares/page.tsx' \
            apps/web/components/external-place-image-preview.tsx \
            apps/web/lib/google-place-photo.ts \
            turbo.json
          rm .github/workflows/rb-inc-167-format-helper.yml
      - name: Commit canonical formatting
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style: format RB-INC-167 refresh"
          git push
