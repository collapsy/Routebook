name: RB-INC-086 pnpm 11 Lockfile

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize
    paths:
      - .github/workflows/rb-inc-086-pnpm11-lock.yml

permissions:
  contents: write

jobs:
  refresh:
    if: github.head_ref == 'feature/rb-inc-086-better-auth-session-foundation'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/rb-inc-086-better-auth-session-foundation
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: corepack enable
      - name: Refresh lockfile from workspace settings
        run: |
          pnpm install --lockfile-only
          rm .github/workflows/rb-inc-086-pnpm11-lock.yml
      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-workspace.yaml pnpm-lock.yaml .github/workflows/rb-inc-086-pnpm11-lock.yml
          git commit -m "build: apply pnpm 11 Kysely override"
          git push origin HEAD:feature/rb-inc-086-better-auth-session-foundation
