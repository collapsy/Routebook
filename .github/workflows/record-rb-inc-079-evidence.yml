name: Record RB-INC-079 Evidence

on:
  push:
    branches:
      - feature/rb-inc-079-itinerary-transaction-fragment

permissions:
  contents: write

jobs:
  record:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/rb-inc-079-itinerary-transaction-fragment
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Record approved evidence
        run: |
          python3 - <<'PY'
          from pathlib import Path

          increment = Path("docs/implementation/increments/rb-inc-079-itinerary-transaction-fragment.md")
          text = increment.read_text()
          text = text.replace("- [ ] validações finais do CI aprovadas.", "- [x] validações finais do CI aprovadas.")
          text = text.replace(
              "As evidências serão registradas após a aprovação dos workflows da PR #182.",
              "- Documentation Validation `30752064982`: aprovada;\n- Engineering Validation `30752064966`: aprovada;\n- 198 documentos encontrados e registrados;\n- formatação, documentação, lint e typecheck aprovados;\n- migrations PostgreSQL existentes aplicadas com sucesso;\n- suíte integral aprovada, incluindo os sete cenários do fragment;\n- smoke do servidor de desenvolvimento aprovado;\n- build de produção aprovado;\n- 56 testes Playwright responsivos aprovados;\n- registry e matriz de rastreabilidade sincronizados com `RB-INC-079` e `RB-CTX-079`;\n- HEAD validado: `ca9e6c8c739dbbad11d9b59a782c32cb813411c2`.",
          )
          increment.write_text(text)

          matrix = Path("docs/implementation/traceability-matrix.md")
          text = matrix.read_text()
          old = "| RB-INC-079 | RB-ADR-027, RB-ARC-003–004, RB-DOM-003–004 e RB-INC-070, RB-INC-072–074, RB-INC-078 | #181 | `feature/rb-inc-079-itinerary-transaction-fragment`, PR #182 | fragment de Itinerary com leitura, validação, aplicação integral e persistência escopada | PR #182; validação em andamento | Em validação |"
          new = "| RB-INC-079 | RB-ADR-027, RB-ARC-003–004, RB-DOM-003–004 e RB-INC-070, RB-INC-072–074, RB-INC-078 | #181 | `feature/rb-inc-079-itinerary-transaction-fragment`, PR #182 | fragment de Itinerary com leitura, validação, aplicação integral e persistência escopada | runs 30752064982 e 30752064966; 198 documentos, migrations, suíte integral, build e 56 E2E responsivos verdes | Integrado |"
          if old not in text:
              raise SystemExit("Linha de rastreabilidade do RB-INC-079 não encontrada")
          matrix.write_text(text.replace(old, new))
          PY
      - run: >-
          pnpm exec prettier --write
          docs/implementation/increments/rb-inc-079-itinerary-transaction-fragment.md
          docs/implementation/traceability-matrix.md
      - run: git rm .github/workflows/record-rb-inc-079-evidence.yml
      - name: Commit evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/implementation
          git commit -m "docs(database): registrar evidências do RB-INC-079"
          git push origin HEAD:feature/rb-inc-079-itinerary-transaction-fragment
