name: RB-INC-088 Fix Rollback Test

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize
    paths:
      - .github/workflows/rb-inc-088-fix-rollback-test.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'feature/rb-inc-088-personal-account-authenticated-trip'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/rb-inc-088-personal-account-authenticated-trip
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: corepack enable
      - name: Patch wrapped error assertion
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("packages/database/src/authenticated-trip-service-postgres.test.ts")
          content = path.read_text(encoding="utf-8")
          anchor = '''function tripInput(name: string) {
            return {
              name,
              startDate: "2026-08-22",
              endDate: "2026-08-29",
              accommodationName: "Condomínio Solar Água",
              accommodationAddress: "Pipa, Tibau do Sul - RN",
            };
          }
          '''
          helper = anchor + '''
          function errorChainContains(error: unknown, expected: string): boolean {
            let current: unknown = error;
            const visited = new Set<unknown>();

            while (current instanceof Error && !visited.has(current)) {
              visited.add(current);
              if (current.message.includes(expected)) return true;
              current = current.cause;
            }

            return false;
          }
          '''
          if "function errorChainContains" not in content:
              if anchor not in content:
                  raise SystemExit("tripInput anchor not found")
              content = content.replace(anchor, helper, 1)

          old = '''    try {
              await expect(
                createPostgresAuthenticatedTrip(
                  { userId: rollbackUserId, trip: tripInput("Rollback autenticado") },
                  database,
                  now,
                ),
              ).rejects.toThrow("RB-INC-088 forced Trip failure");
            } finally {
          '''
          new = '''    let failure: unknown;
            try {
              await createPostgresAuthenticatedTrip(
                { userId: rollbackUserId, trip: tripInput("Rollback autenticado") },
                database,
                now,
              );
            } catch (error) {
              failure = error;
            } finally {
          '''
          if old not in content:
              raise SystemExit("rollback assertion anchor not found")
          content = content.replace(old, new, 1)

          assertion_anchor = '''    const ownerships = await database
          '''
          assertion = '''    expect(failure).toBeInstanceOf(Error);
            expect(errorChainContains(failure, "RB-INC-088 forced Trip failure")).toBe(true);

          ''' + assertion_anchor
          if assertion_anchor not in content:
              raise SystemExit("ownership assertion anchor not found")
          content = content.replace(assertion_anchor, assertion, 1)
          path.write_text(content, encoding="utf-8")
          PY
          pnpm install --frozen-lockfile
          pnpm exec prettier --write packages/database/src/authenticated-trip-service-postgres.test.ts
          rm .github/workflows/rb-inc-088-fix-rollback-test.yml
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/database/src/authenticated-trip-service-postgres.test.ts .github/workflows/rb-inc-088-fix-rollback-test.yml
          git commit -m "test: assert wrapped PostgreSQL rollback cause"
          git push origin HEAD:feature/rb-inc-088-personal-account-authenticated-trip
