name: RB-INC-094 Temporary Formatter

on:
  push:
    branches:
      - feature/rb-inc-094-deterministic-itinerary-proposal-generator

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: feature/rb-inc-094-deterministic-itinerary-proposal-generator
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply canonical formatting
        run: >-
          pnpm exec prettier --write
          modules/proposal-management/src/deterministic-itinerary-proposal-generator.ts
          modules/proposal-management/src/deterministic-itinerary-proposal-generator.test.ts

      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add modules/proposal-management/src/deterministic-itinerary-proposal-generator.ts
          git add modules/proposal-management/src/deterministic-itinerary-proposal-generator.test.ts
          if git diff --cached --quiet; then
            echo "No formatting changes required."
          else
            git commit -m "style(proposal): aplicar Prettier no adapter determinístico"
            git push origin HEAD:feature/rb-inc-094-deterministic-itinerary-proposal-generator
          fi
