name: RB-INC-138 Temporary Autofix

on:
  push:
    branches:
      - codex/rb-inc-138-delete-trip
    paths:
      - .github/workflows/rb-inc-138-autofix.yml

permissions:
  contents: write

jobs:
  autofix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: codex/rb-inc-138-delete-trip

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format changed files
        run: pnpm format

      - name: Register RB-INC-138 documents
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const path = "docs/registry.md";
          let content = fs.readFileSync(path, "utf8");
          const inc = "| RB-INC-138 | Exclusão Segura de Viagem | Implementation | Draft | 0.1.0 | [rb-inc-138-delete-trip.md](./implementation/increments/rb-inc-138-delete-trip.md) |";
          const ctx = "| RB-CTX-138 | Context Pack do RB-INC-138 — Exclusão Segura de Viagem | Implementation Context Pack | Draft | 0.1.0 | [rb-inc-138-delete-trip.md](./implementation/context-packs/rb-inc-138-delete-trip.md) |";
          if (!content.includes(inc)) {
            const anchor = "| RB-CTX-137 | Context Pack do RB-INC-137 — Cobertura do Catálogo de Pipa | Implementation Context Pack | Draft | 0.1.0 | [rb-inc-137-pipa-catalog-coverage.md](./implementation/context-packs/rb-inc-137-pipa-catalog-coverage.md) |";
            if (!content.includes(anchor)) throw new Error("Registry anchor not found");
            content = content.replace(anchor, `${anchor}\n${inc}\n${ctx}`);
            fs.writeFileSync(path, content);
          }
          NODE
          pnpm prettier --write docs/registry.md

      - name: Remove temporary workflow
        run: rm .github/workflows/rb-inc-138-autofix.yml

      - name: Commit autofix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: format RB-INC-138 and register docs"
          git push origin HEAD:codex/rb-inc-138-delete-trip
