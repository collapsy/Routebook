name: Finalize RB-INC-082

on:
  push:
    branches:
      - feature/rb-inc-082-persist-itinerary-proposal-decision

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/rb-inc-082-persist-itinerary-proposal-decision
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Update governance indexes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          registry = Path("docs/registry.md")
          text = registry.read_text()
          if "| RB-INC-082 |" not in text:
              rows = [
                  "| RB-INC-082 | Persistência PostgreSQL da Decision de Aceite | Implementation | Draft | 0.1.0 | [rb-inc-082-persist-itinerary-proposal-decision.md](./implementation/increments/rb-inc-082-persist-itinerary-proposal-decision.md) |",
                  "| RB-CTX-082 | Context Pack do RB-INC-082 | Implementation Context | Draft | 0.1.0 | [rb-inc-082-persist-itinerary-proposal-decision.md](./implementation/context-packs/rb-inc-082-persist-itinerary-proposal-decision.md) |",
              ]
              lines = text.splitlines()
              index = max(i for i, line in enumerate(lines) if line.startswith("| RB-")) + 1
              lines[index:index] = rows
              registry.write_text("\n".join(lines) + "\n")

          matrix = Path("docs/implementation/traceability-matrix.md")
          text = matrix.read_text()
          if "| RB-INC-082 |" not in text:
              row = "| RB-INC-082 | RB-DATA-002, RB-ADR-006, RB-ADR-027 e RB-INC-080–081 | #187 | `feature/rb-inc-082-persist-itinerary-proposal-decision`, PR #188 | check constraint e migration para persistir a Decision de aceite com round trip e rollback | PR #188; validação em andamento | Em validação |"
              lines = text.splitlines()
              indexes = [i for i, line in enumerate(lines) if line.startswith("| RB-INC-")]
              lines.insert((max(indexes) + 1) if indexes else len(lines), row)
              matrix.write_text("\n".join(lines) + "\n")
          PY
      - name: Apply canonical formatting
        run: >-
          pnpm exec prettier --write
          packages/database/src/decision-schema.ts
          packages/database/src/itinerary-proposal-decision-repository.test.ts
          packages/database/drizzle/meta/_journal.json
          docs/implementation/increments/rb-inc-082-persist-itinerary-proposal-decision.md
          docs/implementation/context-packs/rb-inc-082-persist-itinerary-proposal-decision.md
          docs/implementation/traceability-matrix.md
          docs/registry.md
      - run: git rm .github/workflows/finalize-rb-inc-082.yml
      - name: Commit governance and formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/database docs/implementation docs/registry.md
          git commit -m "docs(database): concluir governança do RB-INC-082"
          git push origin HEAD:feature/rb-inc-082-persist-itinerary-proposal-decision
