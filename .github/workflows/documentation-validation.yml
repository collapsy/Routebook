name: RB-INC-093 Diagnostic Formatting

on:
  pull_request:
    paths:
      - ".github/workflows/documentation-validation.yml"

permissions:
  contents: write

jobs:
  format-diagnostic:
    name: Format acceptance diagnostic
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          package-manager-cache: false

      - name: Install dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Format and restore workflow
        shell: bash
        run: |
          pnpm exec prettier --write apps/web/e2e/00-itinerary-proposal-acceptance-diagnostic.spec.ts
          git fetch origin main
          git checkout origin/main -- .github/workflows/documentation-validation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/e2e/00-itinerary-proposal-acceptance-diagnostic.spec.ts .github/workflows/documentation-validation.yml
          git commit -m "test: format acceptance diagnostic"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
