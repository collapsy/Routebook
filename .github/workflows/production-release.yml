name: Production Release

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: SHA exato de main a promover
        required: true
        type: string
      confirm_production_promotion:
        description: Confirmação humana explícita para executar staged deployment e promoção em Production
        required: true
        default: false
        type: boolean
      approve_high_risk_migrations:
        description: Aprovação humana explícita para migrations de alto risco pendentes
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: production-release
  cancel-in-progress: false

env:
  RELEASE_BRANCH: codex/production-release
  PRODUCTION_BASE_URL: https://routebook-one.vercel.app
  VERCEL_CLI_VERSION: 58.4.0
  VERCEL_PROJECT_ID: prj_o7utdxB9SymdCL56AOH57B64NRec
  VERCEL_ORG_ID: team_Vj5YB1D4TkH2S3nLeQnjrRog

jobs:
  resolve-candidate:
    name: Resolve explicitly approved immutable candidate
    runs-on: ubuntu-latest
    outputs:
      candidate_sha: ${{ steps.candidate.outputs.candidate_sha }}
      allow_high_risk: ${{ steps.candidate.outputs.allow_high_risk }}
    steps:
      - name: Resolve explicit Production authorization
        id: candidate
        shell: bash
        env:
          MANUAL_SHA: ${{ inputs.candidate_sha }}
          CONFIRM_PROMOTION: ${{ inputs.confirm_production_promotion }}
          MANUAL_APPROVAL: ${{ inputs.approve_high_risk_migrations }}
        run: |
          set -euo pipefail

          if [[ "$CONFIRM_PROMOTION" != "true" ]]; then
            echo "::error::Promoção de Production não autorizada. Marque confirm_production_promotion explicitamente."
            exit 1
          fi

          candidate_sha="$MANUAL_SHA"
          allow_high_risk="$MANUAL_APPROVAL"

          if [[ ! "$candidate_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Candidate SHA inválido."
            exit 1
          fi

          echo "candidate_sha=$candidate_sha" >> "$GITHUB_OUTPUT"
          echo "allow_high_risk=$allow_high_risk" >> "$GITHUB_OUTPUT"

  validate-candidate:
    name: Validate candidate and migration history
    needs: resolve-candidate
    runs-on: ubuntu-latest
    outputs:
      release_sha: ${{ steps.refs.outputs.release_sha }}
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve-candidate.outputs.candidate_sha }}
          fetch-depth: 0

      - name: Fetch protected references
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            "+refs/heads/main:refs/remotes/origin/main" \
            "+refs/heads/${RELEASE_BRANCH}:refs/remotes/origin/${RELEASE_BRANCH}"

      - name: Validate ancestry
        id: refs
        shell: bash
        env:
          CANDIDATE_SHA: ${{ needs.resolve-candidate.outputs.candidate_sha }}
        run: |
          set -euo pipefail
          release_sha="$(git rev-parse "origin/${RELEASE_BRANCH}")"
          main_sha="$(git rev-parse origin/main)"

          if ! git merge-base --is-ancestor "$CANDIDATE_SHA" "$main_sha"; then
            echo "::error::Candidate não pertence ao histórico atual de main."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$release_sha" "$CANDIDATE_SHA"; then
            echo "::error::Promoção recusada: release branch não é ancestral do candidate."
            exit 1
          fi

          echo "release_sha=$release_sha" >> "$GITHUB_OUTPUT"

      - name: Verify successful Engineering Validation on main
        uses: actions/github-script@v8
        env:
          CANDIDATE_SHA: ${{ needs.resolve-candidate.outputs.candidate_sha }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const response = await github.rest.actions.listWorkflowRuns({
              owner,
              repo,
              workflow_id: "engineering-validation.yml",
              head_sha: process.env.CANDIDATE_SHA,
              event: "push",
              status: "completed",
              per_page: 20,
            });
            const passed = response.data.workflow_runs.some((run) => run.conclusion === "success");
            if (!passed) {
              core.setFailed("Candidate não possui Engineering Validation de push em main concluída com sucesso.");
            }

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Check migration history policy
        shell: bash
        env:
          CANDIDATE_SHA: ${{ needs.resolve-candidate.outputs.candidate_sha }}
          RELEASE_SHA: ${{ steps.refs.outputs.release_sha }}
        run: |
          set -euo pipefail
          node scripts/release-migration-policy.mjs \
            --base-ref "$RELEASE_SHA" \
            --head-ref "$CANDIDATE_SHA"

  migrate-and-promote:
    name: Migrate, stage, verify and promote
    needs:
      - resolve-candidate
      - validate-candidate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: Production
    env:
      DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL_DIRECT }}
      RELEASE_SSH_KEY_B64: ${{ secrets.PRODUCTION_RELEASE_SSH_KEY_B64 }}
      VERCEL_API_TOKEN: ${{ secrets.VERCEL_API_TOKEN }}
      VERCEL_PROTECTION_BYPASS_SECRET: ${{ secrets.VERCEL_PROTECTION_BYPASS_SECRET }}
      CANDIDATE_SHA: ${{ needs.resolve-candidate.outputs.candidate_sha }}
      RELEASE_SHA: ${{ needs.validate-candidate.outputs.release_sha }}
      ALLOW_HIGH_RISK: ${{ needs.resolve-candidate.outputs.allow_high_risk }}
    steps:
      - name: Require Production release secrets
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${DATABASE_URL:-}" ]]; then
            echo "::error::Environment secret PRODUCTION_DATABASE_URL_DIRECT não configurado."
            exit 1
          fi
          if [[ -z "${RELEASE_SSH_KEY_B64:-}" ]]; then
            echo "::error::Environment secret PRODUCTION_RELEASE_SSH_KEY_B64 não configurado."
            exit 1
          fi
          if [[ -z "${VERCEL_API_TOKEN:-}" ]]; then
            echo "::error::Environment secret VERCEL_API_TOKEN não configurado."
            exit 1
          fi
          if [[ -z "${VERCEL_PROTECTION_BYPASS_SECRET:-}" ]]; then
            echo "::error::Environment secret VERCEL_PROTECTION_BYPASS_SECRET não configurado."
            exit 1
          fi

      - name: Checkout candidate
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve-candidate.outputs.candidate_sha }}
          fetch-depth: 0

      - name: Prepare and validate release deploy key
        shell: bash
        run: |
          set -euo pipefail
          key_file="${RUNNER_TEMP}/routebook-production-release"
          known_hosts="${RUNNER_TEMP}/routebook-github-known-hosts"

          if ! printf '%s' "$RELEASE_SSH_KEY_B64" | base64 --decode > "$key_file"; then
            echo "::error::Environment secret PRODUCTION_RELEASE_SSH_KEY_B64 não contém Base64 válido."
            exit 1
          fi
          chmod 600 "$key_file"

          if ! ssh-keygen -y -f "$key_file" >/dev/null 2>&1; then
            echo "::error::Deploy Key decodificada é inválida ou exige passphrase."
            exit 1
          fi

          curl --fail --silent --show-error https://api.github.com/meta \
            | jq -r '.ssh_keys[] | "github.com " + .' \
            > "$known_hosts"
          if [[ ! -s "$known_hosts" ]]; then
            echo "::error::Não foi possível preparar os host keys oficiais do GitHub."
            exit 1
          fi
          chmod 600 "$known_hosts"

          git_ssh_command="ssh -i $key_file -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$known_hosts"
          echo "GIT_SSH_COMMAND=$git_ssh_command" >> "$GITHUB_ENV"

          GIT_SSH_COMMAND="$git_ssh_command" \
            git ls-remote "git@github.com:${GITHUB_REPOSITORY}.git" \
            "refs/heads/${RELEASE_BRANCH}" >/dev/null

      - name: Fetch release reference
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "+refs/heads/${RELEASE_BRANCH}:refs/remotes/origin/${RELEASE_BRANCH}"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Inspect Production migration ledger
        id: ledger-before
        run: pnpm db:migration-status

      - name: Classify all pending Production migrations
        id: migration-policy
        shell: bash
        env:
          LATEST_APPLIED_AT: ${{ steps.ledger-before.outputs.latest_applied_at }}
        run: |
          set -euo pipefail
          node scripts/release-migration-policy.mjs \
            --base-ref "$RELEASE_SHA" \
            --head-ref "$CANDIDATE_SHA" \
            --latest-applied-at "$LATEST_APPLIED_AT" \
            --github-output "$GITHUB_OUTPUT"

      - name: Require explicit approval for high-risk migrations
        if: steps.migration-policy.outputs.migration_risk == 'high' && env.ALLOW_HIGH_RISK != 'true'
        shell: bash
        env:
          PENDING_TAGS: ${{ steps.migration-policy.outputs.pending_tags }}
          RISK_REASONS: ${{ steps.migration-policy.outputs.risk_reasons }}
        run: |
          echo "::error::Migration de alto risco bloqueada. Candidate: ${CANDIDATE_SHA}; migrations: ${PENDING_TAGS}; motivos: ${RISK_REASONS}. Execute novamente via workflow_dispatch com o mesmo SHA e aprovação explícita."
          exit 1

      - name: Apply pending Production migrations
        if: steps.migration-policy.outputs.pending_count != '0'
        run: pnpm db:migrate

      - name: Verify Production migration ledger
        id: ledger-after
        run: pnpm db:migration-status

      - name: Require zero pending migrations
        shell: bash
        env:
          PENDING_COUNT: ${{ steps.ledger-after.outputs.pending_count }}
          PENDING_TAGS: ${{ steps.ledger-after.outputs.pending_tags }}
        run: |
          set -euo pipefail
          if [[ "$PENDING_COUNT" != "0" ]]; then
            echo "::error::Schema não foi promovido integralmente; migrations ainda pendentes: ${PENDING_TAGS}."
            exit 1
          fi

      - name: Create staged Vercel Production deployment
        id: staged-deployment
        shell: bash
        run: |
          set -euo pipefail
          staged_url="$(pnpm dlx "vercel@${VERCEL_CLI_VERSION}" deploy \
            --prod \
            --skip-domain \
            --yes \
            --token "$VERCEL_API_TOKEN")"

          if [[ ! "$staged_url" =~ ^https://[A-Za-z0-9.-]+\.vercel\.app$ ]]; then
            echo "::error::Vercel não retornou URL imutável válida para o staged deployment."
            exit 1
          fi

          echo "staged_url=$staged_url" >> "$GITHUB_OUTPUT"
          echo "Staged Production deployment criado sem atribuição de domínio público."

      - name: Verify staged Vercel deployment identity
        id: staged-verification
        shell: bash
        env:
          STAGED_URL: ${{ steps.staged-deployment.outputs.staged_url }}
        run: |
          set -euo pipefail
          node scripts/verify-vercel-staged-deployment.mjs \
            --deployment "$STAGED_URL" \
            --expected-sha "$CANDIDATE_SHA" \
            --project-id "$VERCEL_PROJECT_ID" \
            --team-id "$VERCEL_ORG_ID" \
            --forbidden-domains "routebook-one.vercel.app" \
            --timeout-ms 10000 \
            --github-output "$GITHUB_OUTPUT"

      - name: Smoke staged Production deployment
        id: staged-smoke
        shell: bash
        env:
          STAGED_URL: ${{ steps.staged-deployment.outputs.staged_url }}
        run: |
          set -euo pipefail

          release_json="$(curl --fail --silent --show-error \
            --header "x-vercel-protection-bypass: ${VERCEL_PROTECTION_BYPASS_SECRET}" \
            "${STAGED_URL}/api/health/release")"
          printf '%s' "$release_json" | jq -e --arg sha "$CANDIDATE_SHA" '
            .service == "routebook-web" and
            .signal == "release" and
            .status == "identified" and
            .commitSha == $sha
          ' >/dev/null

          live_json="$(curl --fail --silent --show-error \
            --header "x-vercel-protection-bypass: ${VERCEL_PROTECTION_BYPASS_SECRET}" \
            "${STAGED_URL}/api/health/live")"
          printf '%s' "$live_json" | jq -e '
            .service == "routebook-web" and
            .signal == "liveness" and
            .status == "ok"
          ' >/dev/null

          ready_json="$(curl --fail --silent --show-error \
            --header "x-vercel-protection-bypass: ${VERCEL_PROTECTION_BYPASS_SECRET}" \
            "${STAGED_URL}/api/health/ready")"
          printf '%s' "$ready_json" | jq -e '
            .service == "routebook-web" and
            .signal == "readiness" and
            .status == "ready" and
            .dependencies.database == "available"
          ' >/dev/null

          echo "Staged release/liveness/readiness confirmados."

      - name: Promote immutable candidate to Production release branch
        shell: bash
        run: |
          set -euo pipefail
          current_release="$(git rev-parse "origin/${RELEASE_BRANCH}")"
          if [[ "$current_release" == "$CANDIDATE_SHA" ]]; then
            echo "Release branch já aponta para o candidate."
            exit 0
          fi
          if ! git merge-base --is-ancestor "$current_release" "$CANDIDATE_SHA"; then
            echo "::error::Release branch avançou fora do histórico do candidate; promoção abortada."
            exit 1
          fi
          git push "git@github.com:${GITHUB_REPOSITORY}.git" \
            "$CANDIDATE_SHA:refs/heads/${RELEASE_BRANCH}"

      - name: Remove release deploy key
        if: always()
        shell: bash
        run: |
          rm -f \
            "${RUNNER_TEMP}/routebook-production-release" \
            "${RUNNER_TEMP}/routebook-github-known-hosts"

      - name: Promote staged Vercel deployment to Production
        id: vercel-promotion
        shell: bash
        env:
          STAGED_DEPLOYMENT_ID: ${{ steps.staged-verification.outputs.deployment_id }}
        run: |
          set -euo pipefail

          promotion_json="$(curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${VERCEL_API_TOKEN}" \
            --header "Content-Type: application/json" \
            --data '{}' \
            "https://api.vercel.com/v10/projects/${VERCEL_PROJECT_ID}/promote/${STAGED_DEPLOYMENT_ID}?teamId=${VERCEL_ORG_ID}")"

          printf '%s' "$promotion_json" | jq -e \
            --arg project_id "$VERCEL_PROJECT_ID" \
            --arg deployment_id "$STAGED_DEPLOYMENT_ID" '
              .projectId == $project_id and
              .deploymentId == $deployment_id
            ' >/dev/null

      - name: Verify immutable candidate is served in Production
        id: deployment-verification
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-production-deployment.mjs \
            --url "${PRODUCTION_BASE_URL}/api/health/release" \
            --expected-sha "$CANDIDATE_SHA" \
            --attempts 60 \
            --interval-ms 10000 \
            --timeout-ms 5000

      - name: Run Production operational smoke
        id: operational-smoke
        run: pnpm smoke:operational "$PRODUCTION_BASE_URL"

      - name: Record Production release evidence
        if: always()
        shell: bash
        env:
          STAGED_URL: ${{ steps.staged-deployment.outputs.staged_url }}
          STAGED_OUTCOME: ${{ steps.staged-deployment.outcome }}
          STAGED_VERIFICATION_OUTCOME: ${{ steps.staged-verification.outcome }}
          STAGED_SMOKE_OUTCOME: ${{ steps.staged-smoke.outcome }}
          PROMOTION_OUTCOME: ${{ steps.vercel-promotion.outcome }}
          DEPLOYMENT_OUTCOME: ${{ steps.deployment-verification.outcome }}
          SMOKE_OUTCOME: ${{ steps.operational-smoke.outcome }}
        run: |
          {
            echo "## Production Release Evidence"
            echo
            echo "- Candidate SHA: \`$CANDIDATE_SHA\`"
            echo "- Release branch: \`$RELEASE_BRANCH\`"
            echo "- Production domain: \`$PRODUCTION_BASE_URL\`"
            echo "- Staged Production deployment: \`${STAGED_URL:-unavailable}\`"
            echo "- Staged deployment creation: \`$STAGED_OUTCOME\`"
            echo "- Staged identity verification: \`$STAGED_VERIFICATION_OUTCOME\`"
            echo "- Staged health smoke: \`$STAGED_SMOKE_OUTCOME\`"
            echo "- Vercel promotion: \`$PROMOTION_OUTCOME\`"
            echo "- Immutable public SHA verification: \`$DEPLOYMENT_OUTCOME\`"
            echo "- Public liveness/readiness smoke: \`$SMOKE_OUTCOME\`"
          } >> "$GITHUB_STEP_SUMMARY"
