name: Temporary Maintenance Sync

on:
  pull_request:
    paths:
      - ".github/workflows/temporary-maintenance-sync.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: corepack enable
      - name: Synchronize lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Format changed files
        run: pnpm exec prettier --write modules/decision-intelligence/src/deterministic-recommendations.ts modules/decision-intelligence/src/deterministic-recommendations.test.ts modules/decision-intelligence/src/index.ts modules/decision-intelligence/package.json docs/implementation/increments/rb-inc-039-deterministic-recommendations.md docs/implementation/context-packs/rb-inc-039-deterministic-recommendations.md docs/registry.md
      - name: Commit generated changes
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml modules/decision-intelligence docs
          git commit -m "chore: synchronize RB-INC-039 generated files"
          git push origin "HEAD:${{ github.head_ref }}"
