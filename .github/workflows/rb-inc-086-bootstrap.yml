name: RB-INC-086 Bootstrap

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
    paths:
      - .github/workflows/rb-inc-086-bootstrap.yml

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.head_ref == 'feature/rb-inc-086-better-auth-session-foundation'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/rb-inc-086-better-auth-session-foundation
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: corepack enable
      - name: Register migration
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          journal = Path("packages/database/drizzle/meta/_journal.json")
          data = json.loads(journal.read_text(encoding="utf-8"))
          if not any(entry["tag"] == "0020_create_better_auth_tables" for entry in data["entries"]):
              data["entries"].append({
                  "idx": 20,
                  "version": "7",
                  "when": 1785706200000,
                  "tag": "0020_create_better_auth_tables",
                  "breakpoints": True,
              })
          journal.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY
      - name: Resolve lockfile and format
        run: |
          pnpm install --lockfile-only
          pnpm exec prettier --write \
            apps/web/package.json \
            apps/web/lib/auth.ts \
            apps/web/lib/auth-session.ts \
            'apps/web/app/api/auth/[...all]/route.ts' \
            packages/database/src/auth-schema.ts \
            packages/database/src/index.ts \
            packages/database/drizzle/meta/_journal.json
          rm .github/workflows/rb-inc-086-bootstrap.yml
      - name: Commit bootstrap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/package.json pnpm-lock.yaml apps/web/lib/auth.ts apps/web/lib/auth-session.ts 'apps/web/app/api/auth/[...all]/route.ts' packages/database/src/auth-schema.ts packages/database/src/index.ts packages/database/drizzle/meta/_journal.json .env.example .github/workflows/rb-inc-086-bootstrap.yml
          git commit -m "build: bootstrap Better Auth foundation"
          git push origin HEAD:feature/rb-inc-086-better-auth-session-foundation

# retry without env formatting
