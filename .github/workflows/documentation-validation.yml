name: RB-INC-093 Client Action Binding Patch

on:
  pull_request:
    paths:
      - ".github/workflows/documentation-validation.yml"

permissions:
  contents: write

jobs:
  migrate-action-binding:
    name: Migrate acceptance action binding
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          package-manager-cache: false

      - name: Install dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Patch prop chain, tests and restore workflow
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("node:fs");

          function replace(path, before, after) {
            const source = fs.readFileSync(path, "utf8");
            if (!source.includes(before)) {
              throw new Error(`Patch marker not found in ${path}: ${before.slice(0, 100)}`);
            }
            fs.writeFileSync(path, source.replace(before, after));
          }

          const reviewPath = "apps/web/components/itinerary-proposal-review.tsx";
          replace(
            reviewPath,
            'import type { AcceptItineraryProposalActionState } from "../lib/itinerary-proposal-acceptance";\n',
            "",
          );
          replace(
            reviewPath,
            'type AcceptAction = (\n  state: AcceptItineraryProposalActionState,\n  formData: FormData,\n) => Promise<AcceptItineraryProposalActionState>;\n\n',
            "",
          );
          replace(reviewPath, "  acceptAction,\n", "");
          replace(reviewPath, "  acceptAction: AcceptAction;\n", "");
          replace(reviewPath, "  review,\n}: {", "  review,\n  tripId,\n}: {");
          replace(reviewPath, "  review: ReviewModel;\n})", "  review: ReviewModel;\n  tripId: string;\n})");
          replace(reviewPath, "          acceptAction={acceptAction}\n", "");
          replace(
            reviewPath,
            "          proposalId={review.proposalId}\n",
            "          proposalId={review.proposalId}\n          tripId={tripId}\n",
          );

          const pagePath = "apps/web/app/viagens/[tripId]/roteiro/proposta/page.tsx";
          replace(
            pagePath,
            'import { acceptItineraryProposalAction } from "./accept-action";\n',
            "",
          );
          replace(
            pagePath,
            "  const acceptAction = acceptItineraryProposalAction.bind(null, trip.id);\n",
            "",
          );
          replace(pagePath, "        acceptAction={acceptAction}\n", "");
          replace(
            pagePath,
            "        review={review}\n",
            "        review={review}\n        tripId={trip.id}\n",
          );

          const decisionTestPath =
            "apps/web/components/itinerary-proposal-decision-actions.test.tsx";
          replace(
            decisionTestPath,
            "const routerMocks = vi.hoisted(() => ({ push: vi.fn(), refresh: vi.fn() }));\n",
            'const routerMocks = vi.hoisted(() => ({ push: vi.fn(), refresh: vi.fn() }));\nconst acceptanceMocks = vi.hoisted(() => ({ accept: vi.fn() }));\n',
          );
          replace(
            decisionTestPath,
            'vi.mock("next/navigation", () => ({\n  useRouter: () => routerMocks,\n}));\n',
            'vi.mock("next/navigation", () => ({\n  useRouter: () => routerMocks,\n}));\n\nvi.mock("../app/viagens/[tripId]/roteiro/proposta/accept-action", () => ({\n  acceptItineraryProposalAction: acceptanceMocks.accept,\n}));\n',
          );
          replace(decisionTestPath, "const acceptAction = vi.fn();\n", "");
          replace(decisionTestPath, "  acceptAction,\n", "");
          replace(
            decisionTestPath,
            '  proposalId: "proposal-ready",\n',
            '  proposalId: "proposal-ready",\n  tripId: "trip-1",\n',
          );

          const reviewTestPath = "apps/web/components/itinerary-proposal-review.test.tsx";
          replace(
            reviewTestPath,
            'import type { AcceptItineraryProposalActionState } from "../lib/itinerary-proposal-acceptance";\n',
            "",
          );
          replace(
            reviewTestPath,
            "const routerMocks = vi.hoisted(() => ({ push: vi.fn(), refresh: vi.fn() }));\n",
            "const routerMocks = vi.hoisted(() => ({ push: vi.fn(), refresh: vi.fn() }));\nconst acceptanceMocks = vi.hoisted(() => ({ accept: vi.fn() }));\n",
          );
          replace(
            reviewTestPath,
            'vi.mock("next/navigation", () => ({\n  useRouter: () => routerMocks,\n}));\n',
            'vi.mock("next/navigation", () => ({\n  useRouter: () => routerMocks,\n}));\n\nvi.mock("../app/viagens/[tripId]/roteiro/proposta/accept-action", () => ({\n  acceptItineraryProposalAction: acceptanceMocks.accept,\n}));\n',
          );
          replace(
            reviewTestPath,
            'const acceptAction = vi.fn(\n  async (state: AcceptItineraryProposalActionState): Promise<AcceptItineraryProposalActionState> =>\n    state,\n);\n',
            "",
          );
          replace(reviewTestPath, "  acceptAction,\n", "");
          replace(
            reviewTestPath,
            '  itineraryHref: "/viagens/trip-1/roteiro",\n',
            '  itineraryHref: "/viagens/trip-1/roteiro",\n  tripId: "trip-1",\n',
          );
          NODE

          pnpm exec prettier --write \
            apps/web/app/viagens/[tripId]/roteiro/proposta/page.tsx \
            apps/web/components/itinerary-proposal-decision-actions.tsx \
            apps/web/components/itinerary-proposal-decision-actions.test.tsx \
            apps/web/components/itinerary-proposal-review.tsx \
            apps/web/components/itinerary-proposal-review.test.tsx

          git fetch origin main
          git checkout origin/main -- .github/workflows/documentation-validation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/web/app/viagens/[tripId]/roteiro/proposta/page.tsx \
            apps/web/components/itinerary-proposal-decision-actions.tsx \
            apps/web/components/itinerary-proposal-decision-actions.test.tsx \
            apps/web/components/itinerary-proposal-review.tsx \
            apps/web/components/itinerary-proposal-review.test.tsx \
            .github/workflows/documentation-validation.yml
          git commit -m "fix: preserve Server Action reference inside client acceptance boundary"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
