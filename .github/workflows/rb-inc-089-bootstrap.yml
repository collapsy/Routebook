name: RB-INC-089 Bootstrap

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize
    paths:
      - .github/workflows/rb-inc-089-bootstrap.yml

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.head_ref == 'feature/rb-inc-089-server-auth-experience'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/rb-inc-089-server-auth-experience
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: corepack enable
      - name: Format and register increment
        run: |
          python - <<'PY'
          from pathlib import Path

          registry = Path("docs/registry.md")
          content = registry.read_text(encoding="utf-8")
          rows = """| RB-INC-089 | Experiência Server-side de Cadastro, Entrada e Saída | Implementation | Draft | 0.1.0 | [rb-inc-089-server-auth-experience.md](./implementation/increments/rb-inc-089-server-auth-experience.md) |
          | RB-CTX-089 | Context Pack do RB-INC-089 | Implementation Context | Draft | 0.1.0 | [rb-inc-089-server-auth-experience.md](./implementation/context-packs/rb-inc-089-server-auth-experience.md) |
          """
          marker = "\n## Status possíveis"
          if "| RB-INC-089 |" not in content:
              if marker not in content:
                  raise SystemExit("registry marker not found")
              content = content.replace(marker, "\n" + rows + marker, 1)
              registry.write_text(content, encoding="utf-8")

          matrix = Path("docs/implementation/traceability-matrix.md")
          content = matrix.read_text(encoding="utf-8")
          row = "| RB-INC-089 | RB-SEC-001, RB-ADR-007 e RB-INC-086–088 | #203 | `feature/rb-inc-089-server-auth-experience`, PR #204 | páginas e Server Actions de cadastro, entrada e saída, retorno seguro e sessão no App Shell | validações funcionais em execução | Em validação |\n"
          marker = "\n## Evidências do RB-INC-003"
          if "| RB-INC-089 |" not in content:
              if marker not in content:
                  raise SystemExit("matrix marker not found")
              content = content.replace(marker, "\n" + row + marker, 1)
              matrix.write_text(content, encoding="utf-8")
          PY
          pnpm install --frozen-lockfile
          pnpm exec prettier --write \
            apps/web/app/auth.css \
            apps/web/components/auth-form.tsx \
            apps/web/lib/auth-experience.ts \
            apps/web/lib/auth-experience.test.ts \
            apps/web/app/auth-actions.ts \
            apps/web/app/entrar/page.tsx \
            apps/web/app/criar-conta/page.tsx \
            apps/web/components/auth-page.tsx \
            apps/web/components/app-shell.tsx \
            apps/web/e2e/auth.spec.ts \
            docs/implementation/increments/rb-inc-089-server-auth-experience.md \
            docs/implementation/context-packs/rb-inc-089-server-auth-experience.md \
            docs/registry.md \
            docs/implementation/traceability-matrix.md
          rm .github/workflows/rb-inc-089-bootstrap.yml
      - name: Commit bootstrap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "chore: format and register RB-INC-089"
          git push origin HEAD:feature/rb-inc-089-server-auth-experience
