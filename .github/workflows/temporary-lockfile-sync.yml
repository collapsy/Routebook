name: Temporary Lockfile Sync

on:
  pull_request:
    paths:
      - "modules/decision-intelligence/package.json"
      - ".github/workflows/temporary-lockfile-sync.yml"

permissions:
  contents: write

jobs:
  generate:
    name: Synchronize pnpm lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Generate lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile

      - name: Commit generated lockfile
        shell: bash
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "Lockfile already synchronized."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore: synchronize pnpm lockfile"
          git push origin "HEAD:${{ github.head_ref }}"
