name: RB-INC-084 Date Patch

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize
    paths:
      - .github/workflows/rb-inc-084-date-patch.yml

permissions:
  contents: write

jobs:
  patch-dates:
    if: github.head_ref == 'feature/rb-inc-084-apply-itinerary-proposal-transaction'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/rb-inc-084-apply-itinerary-proposal-transaction
          fetch-depth: 0

      - name: Serialize PostgreSQL timestamp parameters
        run: |
          python - <<'PY'
          from pathlib import Path

          repository = Path("packages/database/src/proposal-application-repository.ts")
          content = repository.read_text(encoding="utf-8")
          if content.count("${application.startedAt}") != 3:
              raise SystemExit("Expected three startedAt SQL parameters")
          if content.count("${application.completedAt}") != 2:
              raise SystemExit("Expected two completedAt SQL parameters")
          content = content.replace(
              "${application.startedAt}",
              "${application.startedAt.toISOString()}",
          )
          content = content.replace(
              "${application.completedAt}",
              "${application.completedAt.toISOString()}",
          )
          repository.write_text(content, encoding="utf-8")
          Path(".github/workflows/rb-inc-084-date-patch.yml").unlink()
          PY

      - name: Commit timestamp serialization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/database/src/proposal-application-repository.ts .github/workflows/rb-inc-084-date-patch.yml
          git commit -m "fix(database): serialize proposal application timestamps"
          git push origin HEAD:feature/rb-inc-084-apply-itinerary-proposal-transaction

# trigger
