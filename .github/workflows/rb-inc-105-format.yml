name: RB-INC-105 Format

on:
  push:
    branches:
      - feature/rb-inc-105-authorized-itinerary-proposal-edit-action
    paths:
      - ".github/workflows/rb-inc-105-format.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/rb-inc-105-authorized-itinerary-proposal-edit-action
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Format RB-INC-105 files
        run: >-
          pnpm exec prettier --write
          apps/web/lib/itinerary-proposal-editing.ts
          apps/web/lib/itinerary-proposal-editing.test.ts
          apps/web/app/viagens/[tripId]/roteiro/proposta/edit-action.test.ts
      - name: Commit canonical formatting and remove helper
        run: |
          git config user.name "collapsy"
          git config user.email "38116052+collapsy@users.noreply.github.com"
          git add apps/web/lib/itinerary-proposal-editing.ts apps/web/lib/itinerary-proposal-editing.test.ts apps/web/app/viagens/[tripId]/roteiro/proposta/edit-action.test.ts
          git rm .github/workflows/rb-inc-105-format.yml
          git commit -m "style(rb-inc-105): apply canonical formatting"
          git push
