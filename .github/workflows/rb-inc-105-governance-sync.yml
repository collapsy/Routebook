name: RB-INC-105 Governance Sync

on:
  push:
    branches:
      - feature/rb-inc-105-authorized-itinerary-proposal-edit-action
    paths:
      - .github/workflows/rb-inc-105-governance-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/rb-inc-105-authorized-itinerary-proposal-edit-action
          fetch-depth: 0

      - name: Synchronize registry and traceability
        shell: python
        run: |
          from pathlib import Path

          registry = Path("docs/registry.md")
          text = registry.read_text()
          rows = """| RB-INC-105 | Server Action Autorizada para Edição de Itinerary Proposal | Implementation | Draft | 0.1.0 | [rb-inc-105-authorized-itinerary-proposal-edit-action.md](./implementation/increments/rb-inc-105-authorized-itinerary-proposal-edit-action.md) |
          | RB-CTX-105 | Context Pack do RB-INC-105 | Implementation Context | Draft | 0.1.0 | [rb-inc-105-authorized-itinerary-proposal-edit-action.md](./implementation/context-packs/rb-inc-105-authorized-itinerary-proposal-edit-action.md) |
          """
          if "| RB-INC-105 |" not in text:
              text = text.replace("\n## Status possíveis", "\n" + rows + "\n## Status possíveis", 1)
          registry.write_text(text)

          matrix = Path("docs/implementation/traceability-matrix.md")
          text = matrix.read_text().replace('last_updated: "2026-08-07"', 'last_updated: "2026-08-09"', 1)
          section = """## Evidências previstas do RB-INC-105

          | Evidência | Localização/resultado |
          | --- | --- |
          | definição do incremento | `docs/implementation/increments/rb-inc-105-authorized-itinerary-proposal-edit-action.md` |
          | Context Pack | `docs/implementation/context-packs/rb-inc-105-authorized-itinerary-proposal-edit-action.md` |
          | executor web | `apps/web/lib/itinerary-proposal-editing.ts` |
          | testes do executor | `apps/web/lib/itinerary-proposal-editing.test.ts` |
          | Server Action | `apps/web/app/viagens/[tripId]/roteiro/proposta/edit-action.ts` |
          | testes da Server Action | `apps/web/app/viagens/[tripId]/roteiro/proposta/edit-action.test.ts` |
          | autorização | `resolveTripRouteAccess` com `trip:edit` |
          | application service reutilizado | `editAndPersistItineraryProposalProposedActivity` |
          | repository concreto | `DrizzleItineraryProposalRepository` |
          | rastreabilidade | issue #239 e PR #240 |
          | SHA técnico validado | `fdba3b2c2c2e88987936d04c673748f764b49f35` |
          | Engineering Validation técnico | #1306, run `31257205455`, success em format, docs, lint, typecheck, migrations, testes, smoke, build e Playwright responsivo |
          | migration | nenhuma nova migration; RB-INC-104 reutilizado |

          """
          if "## Evidências previstas do RB-INC-105" not in text:
              text = text.replace("## Cadeia mínima", section + "## Cadeia mínima", 1)
          matrix.write_text(text)

      - name: Commit canonical governance and remove helper
        run: |
          rm .github/workflows/rb-inc-105-governance-sync.yml
          git config user.name "collapsy"
          git config user.email "38116052+collapsy@users.noreply.github.com"
          git add docs/registry.md docs/implementation/traceability-matrix.md .github/workflows/rb-inc-105-governance-sync.yml
          git commit -m "docs(rb-inc-105): synchronize canonical governance"
          git push origin HEAD:feature/rb-inc-105-authorized-itinerary-proposal-edit-action
