name: RB-INC-167 documentation sync

on:
  push:
    branches:
      - codex/rb-inc-167-google-place-photos-refresh

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Synchronize registry and traceability
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          registry_path = Path("docs/registry.md")
          registry = registry_path.read_text()
          registry_marker = "| RB-INC-168 | Ranking e qualidade contextual de Places |"
          if "| RB-INC-167 | Google Places Photos para cobertura visual governada |" not in registry:
              index = registry.find(registry_marker)
              if index < 0:
                  raise SystemExit("RB-INC-168 registry marker not found")
              rows = (
                  "| RB-INC-167 | Google Places Photos para cobertura visual governada | Implementation | Draft | 0.2.0 | "
                  "[rb-inc-167-google-place-photos.md](./implementation/increments/rb-inc-167-google-place-photos.md) |\n"
                  "| RB-CTX-167 | Context Pack do RB-INC-167 — Google Places Photos governadas | Implementation Context Pack | Draft | 0.2.0 | "
                  "[rb-inc-167-google-place-photos.md](./implementation/context-packs/rb-inc-167-google-place-photos.md) |\n\n"
              )
              registry = registry[:index] + rows + registry[index:]
          registry_path.write_text(registry)

          trace_path = Path("docs/implementation/traceability-matrix.md")
          trace = trace_path.read_text()
          trace = trace.replace('last_updated: "2026-08-20"', 'last_updated: "2026-09-04"', 1)

          matrix_section_end = "## Evidências do RB-INC-003"
          matrix_row = (
              "| RB-INC-167 | RB-ADR-012, RB-ARC-003, RB-INC-141, RB-INC-162, RB-INC-168, RB-INC-172, RB-INC-179 | "
              "#382 | `codex/rb-inc-167-google-place-photos-refresh`, PR substituta de #410 | Google Places Photos server-side, token efêmero, attribution, no-store e fallback | testes de adapter/rotas/componente; CI e Preview pendentes no HEAD final | Em execução |\n"
          )
          if matrix_row not in trace:
              index = trace.find(matrix_section_end)
              if index < 0:
                  raise SystemExit("traceability matrix end marker not found")
              trace = trace[:index] + matrix_row + "\n" + trace[index:]

          evidence_marker = "## Evidências previstas do RB-INC-168"
          evidence_lines = [
              "## Evidências previstas do RB-INC-167",
              "",
              "| Evidência | Localização/resultado |",
              "| --- | --- |",
              "| definição do incremento | `docs/implementation/increments/rb-inc-167-google-place-photos.md` |",
              "| Context Pack | `docs/implementation/context-packs/rb-inc-167-google-place-photos.md` |",
              "| origem | feedback de uso humano real: cobertura Wikimedia insuficiente para estabelecimentos, issue #382 |",
              "| base atual | `main@604433b7eb403f577b7ca142eed12f28607d731b`, após RouteBook Anywhere / RB-INC-179 |",
              "| branch | `codex/rb-inc-167-google-place-photos-refresh`; substitui tecnicamente a PR antiga #410 |",
              "| autorização | Google Places Photos autorizado somente em Preview em 01/09/2026; Production continua gate separado |",
              "| identidade | reutiliza `PlaceQualitySignals.externalId` Google e revalida ID, nome e proximidade antes de liberar mídia |",
              "| segurança | key server-side; token HMAC efêmero; `photo name` não sai do servidor e é re-resolvido no request de mídia |",
              "| attribution | Google Maps + `authorAttributions` + link de fonte quando disponíveis |",
              "| cache | metadata/mídia Google `private, no-store`; Wikimedia mantém cache governado do RB-INC-162 |",
              "| fallback | `Place.primaryImage` → Google seguro → Wikimedia secure quando suportada → ilustração de categoria |",
              "| destination-agnostic | Google Photo pode operar fora de Pipa quando existe Google Place ID seguro; nenhum seed regional é requisito |",
              "| compliance | Termos/Política de Privacidade públicos permanecem gate antes de ativação pública/Production |",
              "| validação | testes focados, Documentation, Engineering/Playwright, Vercel Preview e medição live pendentes no HEAD final |",
              "",
              "",
          ]
          evidence = "\n".join(evidence_lines)
          if "## Evidências previstas do RB-INC-167" not in trace:
              index = trace.find(evidence_marker)
              if index < 0:
                  raise SystemExit("RB-INC-168 evidence marker not found")
              trace = trace[:index] + evidence + trace[index:]

          trace_path.write_text(trace)
          Path(".github/workflows/rb-inc-167-doc-sync-helper.yml").unlink()
          PY
      - name: Commit synchronized documentation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "docs: synchronize RB-INC-167 registry and traceability"
          git push
