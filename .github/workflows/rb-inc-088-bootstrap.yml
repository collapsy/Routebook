name: RB-INC-088 Bootstrap

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize
    paths:
      - .github/workflows/rb-inc-088-bootstrap.yml

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.head_ref == 'feature/rb-inc-088-personal-account-authenticated-trip'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/rb-inc-088-personal-account-authenticated-trip
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: corepack enable
      - name: Patch exports and governance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          index = Path("packages/database/src/index.ts")
          content = index.read_text(encoding="utf-8")
          old = 'export { accountMemberships, accounts } from "./identity-schema";'
          new = 'export {\n  accountMemberships,\n  accounts,\n  personalAccountOwnerships,\n} from "./identity-schema";'
          if 'personalAccountOwnerships' not in content:
              if old not in content:
                  raise SystemExit("identity schema export anchor not found")
              content = content.replace(old, new, 1)
          client_anchor = 'export { closeDatabase, getDatabase } from "./client";\n'
          service_export = '\nexport {\n  AuthenticatedTripCreationError,\n  createPostgresAuthenticatedTrip,\n  type CreateAuthenticatedTripInput,\n  type CreateAuthenticatedTripResult,\n} from "./authenticated-trip-service";\n'
          if 'from "./authenticated-trip-service"' not in content:
              content = content.replace(client_anchor, client_anchor + service_export, 1)
          index.write_text(content, encoding="utf-8")

          journal = Path("packages/database/drizzle/meta/_journal.json")
          data = json.loads(journal.read_text(encoding="utf-8"))
          if not any(entry["tag"] == "0022_create_personal_account_ownerships" for entry in data["entries"]):
              data["entries"].append({
                  "idx": 22,
                  "version": "7",
                  "when": 1785714600000,
                  "tag": "0022_create_personal_account_ownerships",
                  "breakpoints": True,
              })
          journal.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          registry = Path("docs/registry.md")
          content = registry.read_text(encoding="utf-8")
          anchor = "| RB-CTX-087 | Context Pack do RB-INC-087 | Implementation Context | Draft | 0.1.0 | [rb-inc-087-account-membership-trip-authorization.md](./implementation/context-packs/rb-inc-087-account-membership-trip-authorization.md) |"
          rows = "\n".join([
              "| RB-INC-088 | Provisionamento Idempotente de Account Pessoal e Trip Escopada | Implementation | Draft | 0.1.0 | [rb-inc-088-personal-account-authenticated-trip.md](./implementation/increments/rb-inc-088-personal-account-authenticated-trip.md) |",
              "| RB-CTX-088 | Context Pack do RB-INC-088 | Implementation Context | Draft | 0.1.0 | [rb-inc-088-personal-account-authenticated-trip.md](./implementation/context-packs/rb-inc-088-personal-account-authenticated-trip.md) |",
          ])
          if "| RB-INC-088 |" not in content:
              if anchor not in content:
                  raise SystemExit("RB-CTX-087 registry anchor not found")
              registry.write_text(content.replace(anchor, anchor + "\n" + rows, 1), encoding="utf-8")

          matrix = Path("docs/implementation/traceability-matrix.md")
          content = matrix.read_text(encoding="utf-8")
          anchor = "| RB-INC-087 | RB-SEC-001, RB-DATA-001–002, RB-ADR-007–008 e RB-INC-085–086 | #199 | `feature/rb-inc-087-account-membership-trip-authorization`, PR #200 | Account, Membership, matriz deny-by-default e autorização PostgreSQL de Trip | runs 30770613047 e 30770613051; migration 0021, PostgreSQL real, smoke, build e E2E responsivo verdes | Pronto para integração |"
          row = "| RB-INC-088 | RB-DATA-001–002, RB-ADR-007–008 e RB-INC-086–087 | #201 | `feature/rb-inc-088-personal-account-authenticated-trip`, PR #202 | vínculo pessoal um-para-um, provisioning idempotente e criação transacional de Trip escopada | validações finais em execução | Em validação |"
          if "| RB-INC-088 |" not in content:
              if anchor not in content:
                  raise SystemExit("RB-INC-087 traceability anchor not found")
              matrix.write_text(content.replace(anchor, anchor + "\n" + row, 1), encoding="utf-8")
          PY
      - name: Apply canonical formatting
        run: |
          pnpm install --frozen-lockfile
          pnpm exec prettier --write \
            modules/trip-management/src/trip.ts \
            modules/trip-management/src/authenticated-trip-owner.test.ts \
            packages/database/src/identity-schema.ts \
            packages/database/src/authenticated-trip-service.ts \
            packages/database/src/authenticated-trip-service-postgres.test.ts \
            packages/database/src/index.ts \
            packages/database/drizzle/meta/_journal.json \
            docs/implementation/increments/rb-inc-088-personal-account-authenticated-trip.md \
            docs/implementation/context-packs/rb-inc-088-personal-account-authenticated-trip.md \
            docs/implementation/traceability-matrix.md \
            docs/registry.md
          rm .github/workflows/rb-inc-088-bootstrap.yml
      - name: Commit bootstrap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add modules/trip-management packages/database docs .github/workflows/rb-inc-088-bootstrap.yml
          git commit -m "build: integrate RB-INC-088 contracts"
          git push origin HEAD:feature/rb-inc-088-personal-account-authenticated-trip
