name: Format RB-INC-082 Fix

on:
  push:
    branches:
      - feature/rb-inc-082-persist-itinerary-proposal-decision

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/rb-inc-082-persist-itinerary-proposal-decision
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write packages/database/src/itinerary-proposal-decision-repository.test.ts
      - run: git rm .github/workflows/format-rb-inc-082-fix.yml
      - name: Commit formatted test
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/database/src/itinerary-proposal-decision-repository.test.ts
          git commit -m "style(database): formatar teste do RB-INC-082"
          git push origin HEAD:feature/rb-inc-082-persist-itinerary-proposal-decision
