name: RB-INC-108 Format

on:
  push:
    branches:
      - feature/rb-inc-108-partial-itinerary-proposal-acceptance-core
    paths:
      - .github/workflows/rb-inc-108-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/rb-inc-108-partial-itinerary-proposal-acceptance-core
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Format RB-INC-108 files
        run: |
          pnpm exec prettier --write \
            modules/proposal-management/src/accept-itinerary-proposal-partially.ts \
            modules/proposal-management/src/accept-itinerary-proposal-partially.test.ts
      - name: Commit canonical formatting and remove helper
        run: |
          rm .github/workflows/rb-inc-108-format.yml
          git config user.name "collapsy"
          git config user.email "38116052+collapsy@users.noreply.github.com"
          git add modules/proposal-management/src/accept-itinerary-proposal-partially.ts modules/proposal-management/src/accept-itinerary-proposal-partially.test.ts .github/workflows/rb-inc-108-format.yml
          git commit -m "style(rb-inc-108): apply canonical formatting"
          git push origin HEAD:feature/rb-inc-108-partial-itinerary-proposal-acceptance-core
