name: RB-INC-097 Format Diagnostic

on:
  push:
    branches:
      - feature/rb-inc-097-authoritative-itinerary-proposal-generation

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write modules/proposal-management/src/authoritative-itinerary-proposal-generation.ts
      - uses: actions/upload-artifact@v4
        with:
          name: rb-inc-097-formatted
          path: modules/proposal-management/src/authoritative-itinerary-proposal-generation.ts
