name: RB-INC-088 Final Governance

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize
    paths:
      - .github/workflows/rb-inc-088-final-governance.yml

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'feature/rb-inc-088-personal-account-authenticated-trip'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/rb-inc-088-personal-account-authenticated-trip
          fetch-depth: 0
      - name: Record final evidence
        run: |
          python - <<'PY'
          from pathlib import Path

          matrix = Path("docs/implementation/traceability-matrix.md")
          content = matrix.read_text(encoding="utf-8")
          old = "| RB-INC-088 | RB-DATA-001–002, RB-ADR-007–008 e RB-INC-086–087 | #201 | `feature/rb-inc-088-personal-account-authenticated-trip`, PR #202 | vínculo pessoal um-para-um, provisioning idempotente e criação transacional de Trip escopada | validações finais em execução | Em validação |"
          new = "| RB-INC-088 | RB-DATA-001–002, RB-ADR-007–008 e RB-INC-086–087 | #201 | `feature/rb-inc-088-personal-account-authenticated-trip`, PR #202 | vínculo pessoal um-para-um, provisioning idempotente e criação transacional de Trip escopada | runs 30771744270 e 30771744252; migration 0022, replay, concorrência, rollback, PostgreSQL real, smoke, build e E2E verdes | Pronto para integração |"
          if old not in content:
              raise SystemExit("RB-INC-088 traceability row not found")
          matrix.write_text(content.replace(old, new, 1), encoding="utf-8")
          Path(".github/workflows/rb-inc-088-final-governance.yml").unlink()
          PY
      - name: Commit final governance
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/implementation/traceability-matrix.md .github/workflows/rb-inc-088-final-governance.yml
          git commit -m "docs: record RB-INC-088 final validation"
          git push origin HEAD:feature/rb-inc-088-personal-account-authenticated-trip
