name: RB-INC-092 Format Fix

on:
  push:
    branches:
      - feature/rb-inc-092-itinerary-proposal-acceptance-experience

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/rb-inc-092-itinerary-proposal-acceptance-experience
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply Prettier
        run: pnpm format

      - name: Commit canonical formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "style(web): aplicar Prettier canônico ao RB-INC-092"
          git push origin HEAD:feature/rb-inc-092-itinerary-proposal-acceptance-experience
