name: Engineering Validation

on:
  pull_request:
    paths:
      - ".github/workflows/engineering-validation.yml"
      - "modules/**"
      - "packages/**"
      - "docs/**"
      - "pnpm-lock.yaml"

permissions:
  contents: write

jobs:
  synchronize-rb-inc-040:
    name: Synchronize RB-INC-040 generated files
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Install and synchronize lockfile
        run: pnpm install --no-frozen-lockfile

      - name: Format changed files
        run: pnpm exec prettier --write modules/decision-intelligence/src/recommendation-fingerprint.ts modules/decision-intelligence/src/recommendation-fingerprint.test.ts modules/decision-intelligence/src/repository.ts modules/decision-intelligence/src/index.ts packages/database/src/schema.ts packages/database/src/recommendation-repository.ts packages/database/src/recommendation-repository.test.ts packages/database/src/index.ts packages/database/package.json packages/database/drizzle/meta/_journal.json docs/implementation/increments/rb-inc-040-recommendation-persistence.md docs/implementation/context-packs/rb-inc-040-recommendation-persistence.md docs/registry.md

      - name: Commit generated changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Generated files already synchronized."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml modules/decision-intelligence packages/database docs
          git commit -m "chore: synchronize RB-INC-040 generated files"
          git push origin "HEAD:${{ github.head_ref }}"
