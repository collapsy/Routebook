name: RB-INC-090 Audit E2E

on:
  push:
    branches:
      - feature/rb-inc-090-authenticated-trip-workspace
    paths:
      - ".github/workflows/rb-inc-090-audit-e2e.yml"

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: feature/rb-inc-090-authenticated-trip-workspace

      - name: List legacy Trip fixtures
        shell: bash
        run: |
          echo "=== DrizzleTripRepository ==="
          grep -R -n "DrizzleTripRepository" apps/web/e2e || true
          echo "=== createTrip ==="
          grep -R -n "createTrip" apps/web/e2e || true
          echo "=== owner field ==="
          grep -R -n "Responsável pela viagem\|ownerName" apps/web/e2e || true

      - name: Remove workflow
        shell: bash
        run: |
          rm .github/workflows/rb-inc-090-audit-e2e.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/rb-inc-090-audit-e2e.yml
          git commit -m "chore: remove RB-INC-090 E2E audit workflow"
          git push origin HEAD:feature/rb-inc-090-authenticated-trip-workspace
