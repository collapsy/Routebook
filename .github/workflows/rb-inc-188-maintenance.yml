name: RB-INC-188 Maintenance Helper

on:
  push:
    branches:
      - codex/rb-inc-188-real-place-media-quality
    paths:
      - .github/workflows/rb-inc-188-maintenance.yml

permissions:
  contents: write

jobs:
  apply-maintenance:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout RB-INC-188 branch
        uses: actions/checkout@v6
        with:
          ref: codex/rb-inc-188-real-place-media-quality
          fetch-depth: 0

      - name: Apply fail-closed maintenance edits
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          registry_path = Path("docs/registry.md")
          registry = registry_path.read_text()
          inc = "| RB-INC-188 | Fotos reais dos lugares, fallback compacto e qualidade do catálogo | Implementation | Draft | 0.1.0 | [rb-inc-188-real-place-media-quality.md](./implementation/increments/rb-inc-188-real-place-media-quality.md) |"
          ctx = "| RB-CTX-188 | Context Pack do RB-INC-188 — Fotos reais e qualidade do catálogo | Implementation Context Pack | Draft | 0.1.0 | [rb-inc-188-real-place-media-quality.md](./implementation/context-packs/rb-inc-188-real-place-media-quality.md) |"
          anchor = "| RB-CTX-187 | Context Pack do RB-INC-187 — Microcopy de confiança e remoção de justificativas técnicas | Implementation Context Pack | Draft | 0.1.0 | [rb-inc-187-trustworthy-microcopy.md](./implementation/context-packs/rb-inc-187-trustworthy-microcopy.md) |\n\n## Status possíveis"

          if inc in registry or ctx in registry:
              raise SystemExit("RB-INC-188/RB-CTX-188 já estão registrados; abortando para não duplicar.")
          if registry.count(anchor) != 1:
              raise SystemExit("Anchor único do Registry não encontrado; nenhuma alteração aplicada.")
          registry = registry.replace(
              anchor,
              anchor.replace(
                  "\n\n## Status possíveis",
                  f"\n\n{inc}\n{ctx}\n\n## Status possíveis",
              ),
          )
          registry_path.write_text(registry)

          places_path = Path("apps/web/app/viagens/[tripId]/lugares/page.tsx")
          places = places_path.read_text()
          old = "Calcular rota real"
          new = "Ver rota"
          if places.count(old) != 1:
              raise SystemExit(
                  f"Esperava exatamente uma ocorrência de {old!r}; encontrei {places.count(old)}."
              )
          places_path.write_text(places.replace(old, new))

          helper = Path(".github/workflows/rb-inc-188-maintenance.yml")
          if not helper.exists():
              raise SystemExit("Helper temporário não encontrado para auto-remoção.")
          helper.unlink()
          PY

      - name: Verify diff safety
        shell: bash
        run: |
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' '.github/workflows/rb-inc-188-maintenance.yml' 'apps/web/app/viagens/[tripId]/lugares/page.tsx' 'docs/registry.md' | sort)"
          test "$changed" = "$expected"

      - name: Commit maintenance result
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(rb-inc-188): register docs and simplify route action"
          git push origin HEAD:codex/rb-inc-188-real-place-media-quality
