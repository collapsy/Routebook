name: RB-INC-093 E2E Fixture Repair

on:
  push:
    branches:
      - feature/rb-inc-093-itinerary-proposal-acceptance-e2e

permissions:
  contents: write

jobs:
  repair-e2e-fixtures:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: feature/rb-inc-093-itinerary-proposal-acceptance-e2e
          fetch-depth: 0

      - name: Repair canonical fixture values
        run: |
          python - <<'PY'
          from pathlib import Path

          paths = [
              Path("apps/web/e2e/itinerary-proposal-review.spec.ts"),
              Path("apps/web/e2e/00-itinerary-proposal-acceptance-diagnostic.spec.ts"),
          ]

          for path in paths:
              text = path.read_text()
              if text.count('proposedOrder: 2,') != 1:
                  raise SystemExit(f"expected one proposedOrder fixture in {path}")
              if text.count('flexibility: "flexível",') != 1:
                  raise SystemExit(f"expected one localized flexibility fixture in {path}")
              text = text.replace('proposedOrder: 2,', 'proposedOrder: 1,')
              text = text.replace('flexibility: "flexível",', 'flexibility: "flexible",')
              path.write_text(text)
          PY

      - name: Restore canonical workflow
        run: |
          git fetch origin main --depth=1
          git checkout origin/main -- .github/workflows/rb-inc-043-sync-lockfile.yml

      - name: Commit repaired fixtures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/e2e/itinerary-proposal-review.spec.ts \
            apps/web/e2e/00-itinerary-proposal-acceptance-diagnostic.spec.ts \
            .github/workflows/rb-inc-043-sync-lockfile.yml
          git commit -m "test(rb-inc-093): align acceptance fixtures with canonical contract"
          git push origin HEAD:feature/rb-inc-093-itinerary-proposal-acceptance-e2e
