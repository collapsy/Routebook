# Temporary helper documented by RB-INC-163/RB-CTX-163. Must self-remove.
name: RB-INC-163 temporary route helper

on:
  push:
    branches:
      - codex/rb-inc-163-google-maps-destination-reliability
    paths:
      - .github/workflows/rb-inc-163-route-helper.yml
  pull_request:
    types: [opened, synchronize]
    paths:
      - .github/workflows/rb-inc-163-route-helper.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'codex/rb-inc-163-google-maps-destination-reliability' || github.ref_name == 'codex/rb-inc-163-google-maps-destination-reliability'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/rb-inc-163-google-maps-destination-reliability
          fetch-depth: 0

      - name: Apply deterministic replacements
        shell: python
        run: |
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str, count: int = 1) -> None:
              file = Path(path)
              text = file.read_text()
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f"{path}: esperado {count} ocorrência(s), encontrado {actual}: {old!r}")
              file.write_text(text.replace(old, new, count))

          discovery = "apps/web/app/viagens/[tripId]/lugares/page.tsx"
          replace_exact(
              discovery,
              "  buildGoogleMapsDirectionsUrl,\n  buildGoogleMapsSearchUrl,",
              "  buildGoogleMapsDirectionsUrl,\n  buildGoogleMapsPlaceLabel,\n  buildGoogleMapsSearchUrl,",
          )
          replace_exact(
              discovery,
              "    coordinate,\n  });\n\n  return (",
              "    coordinate,\n  });\n  const destinationLabel = buildGoogleMapsPlaceLabel({\n    name: place.name,\n    addressLabel: place.addressLabel,\n  });\n\n  return (",
          )
          replace_exact(
              discovery,
              "    : providerCategoryLabel(candidate.providerCategory);\n\n  return (",
              "    : providerCategoryLabel(candidate.providerCategory);\n  const destinationLabel = buildGoogleMapsPlaceLabel({\n    name: candidate.name,\n    addressLabel: candidate.addressLabel,\n  });\n\n  return (",
          )
          replace_exact(
              discovery,
              '              destination: coordinate,\n              travelMode: "walking",',
              '              destination: coordinate,\n              destinationLabel,\n              travelMode: "walking",',
              2,
          )

          details = "apps/web/app/viagens/[tripId]/lugares/[placeSlug]/page.tsx"
          replace_exact(
              details,
              "  buildGoogleMapsDirectionsUrl,\n  buildGoogleMapsSearchUrl,",
              "  buildGoogleMapsDirectionsUrl,\n  buildGoogleMapsPlaceLabel,\n  buildGoogleMapsSearchUrl,",
          )
          replace_exact(
              details,
              "    coordinate: placeCoordinate,\n  });\n  const practicalGuide",
              "    coordinate: placeCoordinate,\n  });\n  const destinationLabel = buildGoogleMapsPlaceLabel({\n    name: place.name,\n    addressLabel: place.addressLabel,\n  });\n  const practicalGuide",
          )
          replace_exact(
              details,
              '                    destination: placeCoordinate,\n                    travelMode: "walking",',
              '                    destination: placeCoordinate,\n                    destinationLabel,\n                    travelMode: "walking",',
          )
          replace_exact(
              details,
              '                    destination: placeCoordinate,\n                    travelMode: "driving",',
              '                    destination: placeCoordinate,\n                    destinationLabel,\n                    travelMode: "driving",',
          )

          guide = "apps/web/lib/pipa-day-guide.ts"
          replace_exact(
              guide,
              "  buildGoogleMapsDirectionsUrl,\n  buildGoogleMapsItineraryUrl,",
              "  buildGoogleMapsDirectionsUrl,\n  buildGoogleMapsItineraryUrl,\n  buildGoogleMapsPlaceLabel,",
          )
          replace_exact(
              guide,
              "                  destination: placeCoordinate(place),\n                  travelMode: input.travelMode,",
              "                  destination: placeCoordinate(place),\n                  destinationLabel: buildGoogleMapsPlaceLabel({\n                    name: place.name,\n                    addressLabel: place.addressLabel,\n                  }),\n                  travelMode: input.travelMode,",
          )

          registry = Path("docs/registry.md")
          registry_text = registry.read_text()
          registry_anchor = "| RB-CTX-161 | Context Pack do RB-INC-161 — Experiência de viagem ativa e navegação mobile | Implementation Context Pack | Draft | 0.1.0 | [rb-inc-161-active-trip-mobile-experience.md](./implementation/context-packs/rb-inc-161-active-trip-mobile-experience.md) |\n"
          rows = (
              "| RB-INC-163 | Confiabilidade dos destinos no Google Maps | Implementation | Draft | 0.1.0 | [rb-inc-163-google-maps-destination-reliability.md](./implementation/increments/rb-inc-163-google-maps-destination-reliability.md) |\n"
              "| RB-CTX-163 | Context Pack do RB-INC-163 — Confiabilidade dos destinos no Google Maps | Implementation Context Pack | Draft | 0.1.0 | [rb-inc-163-google-maps-destination-reliability.md](./implementation/context-packs/rb-inc-163-google-maps-destination-reliability.md) |\n"
          )
          if "| RB-INC-163 |" not in registry_text:
              if registry_text.count(registry_anchor) != 1:
                  raise SystemExit("Âncora RB-CTX-161 ausente/duplicada no Registry")
              registry.write_text(registry_text.replace(registry_anchor, registry_anchor + rows, 1))

          Path(".github/workflows/rb-inc-163-route-helper.yml").unlink()

      - name: Commit deterministic result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            'apps/web/app/viagens/[tripId]/lugares/page.tsx' \
            'apps/web/app/viagens/[tripId]/lugares/[placeSlug]/page.tsx' \
            apps/web/lib/pipa-day-guide.ts \
            docs/registry.md \
            .github/workflows/rb-inc-163-route-helper.yml
          git diff --cached --check
          git commit -m "RB-163: apply semantic route destinations"
          git push origin HEAD:codex/rb-inc-163-google-maps-destination-reliability
