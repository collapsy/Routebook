name: Normalize Known Documentation Debt

on:
  push:
    branches:
      - chore/rb-inc-000-readiness
    paths:
      - ".github/workflows/normalize-known-documentation-debt.yml"

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: chore/rb-inc-000-readiness

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Normalize known documentation debt
        run: node scripts/normalize-known-documentation-debt.mjs

      - name: Commit normalized documents
        run: |
          git config user.name "routebook-automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/foundation/product-scope.md \
            docs/foundation/product-vision.md \
            docs/product/mvp-definition.md \
            docs/product/product-overview.md \
            docs/ai/ai-security-red-teaming-and-resilience.md
          git commit -m "docs: corrigir datas e frontmatter legados"
          git push origin HEAD:chore/rb-inc-000-readiness