name: Restore RB-INC-005 Registry

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/restore-rb-inc-005-registry.yml"

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/rb-inc-005-traveler-context
          fetch-depth: 0
      - name: Restore canonical registry and add increment
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          content = subprocess.check_output(
              ["git", "show", "origin/main:docs/registry.md"], text=True
          )
          anchor = "| RB-INC-004 | Visão Inicial da Viagem | Implementation Increment | Published | 1.0.0 | [rb-inc-004-trip-overview.md](./implementation/increments/rb-inc-004-trip-overview.md) |"
          entry = "| RB-INC-005 | Contexto Progressivo da Viagem | Implementation Increment | Draft | 0.1.0 | [rb-inc-005-traveler-context.md](./implementation/increments/rb-inc-005-traveler-context.md) |"
          content = content.replace(anchor, anchor + "\n" + entry)
          Path("docs/registry.md").write_text(content, encoding="utf-8")
      - name: Commit registry
        run: |
          git config user.name "routebook-automation"
          git config user.email "routebook-automation@users.noreply.github.com"
          git add docs/registry.md
          git commit -m "docs: restore canonical registry and register RB-INC-005"
          git pull --rebase origin feature/rb-inc-005-traveler-context
          git push origin HEAD:feature/rb-inc-005-traveler-context
