name: Register RB-INC-133 docs

on:
  push:
    branches:
      - codex/rb-inc-133-production-migration-gate
    paths:
      - .github/workflows/rb-inc-133-doc-registry-patch.yml

permissions:
  contents: write

jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/rb-inc-133-production-migration-gate

      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Register increment documentation
        run: node scripts/rb-inc-133-register-docs.mjs

      - name: Remove one-time helpers and commit
        shell: bash
        run: |
          set -euo pipefail
          rm scripts/rb-inc-133-register-docs.mjs
          rm .github/workflows/rb-inc-133-doc-registry-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/registry.md docs/implementation/traceability-matrix.md scripts/rb-inc-133-register-docs.mjs .github/workflows/rb-inc-133-doc-registry-patch.yml
          git commit -m "docs: register RB-INC-133 traceability"
          git push origin HEAD:codex/rb-inc-133-production-migration-gate
