name: RB-INC-133 Closeout

on:
  push:
    branches:
      - codex/rb-inc-133-closeout
    paths:
      - .github/workflows/rb-inc-133-closeout.yml

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/rb-inc-133-closeout
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - run: corepack enable

      - run: pnpm install --frozen-lockfile

      - name: Atualizar evidências canônicas
        shell: python
        run: |
          from pathlib import Path

          inc_path = Path("docs/implementation/increments/rb-inc-133-production-migration-gate.md")
          inc = inc_path.read_text(encoding="utf-8")
          inc = inc.replace('last_updated: "2026-08-11"', 'last_updated: "2026-08-12"', 1)
          criteria = [
              '`main` deixa de ser a Production Branch da Vercel antes da ativação deste incremento;',
              '`PRODUCTION_RELEASE_SSH_KEY_B64` contém Base64 dos bytes exatos da chave privada da Deploy Key dedicada;',
              'execução real comprova autenticação SSH, bloqueio da 0025 e ausência de write sem aprovação;',
              'Engineering Validation e Documentation Validation passam no mesmo SHA da correção.',
          ]
          for item in criteria:
              inc = inc.replace(f'- [ ] {item}', f'- [x] {item}')
          marker = "## 11. Evidências de execução\n"
          if marker not in inc:
              raise SystemExit("Seção de evidências do incremento não encontrada")
          inc = inc.split(marker, 1)[0] + marker + """

- estado inicial: `main` e `codex/production-release` em `90c90cb8e95f48a6e799213486d71c63eca00634`;
- PR #310 integrada por squash em `7c27ebe61c755ec267ad0d4a40b345a02b8c32f0`;
- PR #311 integrou a correção de transporte Base64 da Deploy Key em `a9c0496eca45d90618808a853eaa692ccafc3702`;
- Documentation Validation #1049 e Engineering Validation #1471 passaram no mesmo SHA `a9c0496eca45d90618808a853eaa692ccafc3702`;
- ruleset ativo de `codex/production-release` contém `update`, `deletion`, `non_fast_forward` e bypass exclusivo por `DeployKey`;
- Production Release #1 (`31556534393`) falhou fechado antes do banco ao detectar chave SSH multiline inválida no runner;
- a primeira tentativa do Production Release #2 (`31558997377`) falhou fechado na leitura do banco por URI inválida, sem migration e sem promoção;
- após correção da URI Direct, a reexecução do Production Release #2 leu o ledger real com 25 registros, detectou `0025_add_place_price_range` pendente, classificou risco `high` por `drop-constraint` e `update-data` e bloqueou antes de qualquer write;
- o responsável aprovou explicitamente a migration 0025 para o candidate `a9c0496eca45d90618808a853eaa692ccafc3702`;
- Production Release #3 (`31596977124`), disparado por `workflow_dispatch` com `approve_high_risk_migrations=true`, aplicou a 0025 e concluiu com sucesso;
- verificação pós-migration registrou 26 migrations, `latestAppliedAt=1786482000000`, zero pendências, constraint `places_price_range_check` válido e os cinco `price_range` de Pipa preservados;
- somente após o ledger chegar a zero pendências, `codex/production-release` avançou por fast-forward autenticado de `90c90cb8e95f48a6e799213486d71c63eca00634` para `a9c0496eca45d90618808a853eaa692ccafc3702`;
- o push de promoção registrou bypass do ruleset pela Deploy Key dedicada, comprovando que updates comuns permanecem bloqueados;
- Vercel criou `dpl_FBfJuNxULQ64X7NaWzWDTXFAWu1x` como `READY`, `target=production`, `githubCommitRef=codex/production-release` e `githubCommitSha=a9c0496eca45d90618808a853eaa692ccafc3702`;
- `https://routebook-one.vercel.app` respondeu HTTP 200 após a promoção e não houve logs `error` ou `fatal` no novo deployment na janela verificada;
- nenhum secret, URL de banco ou conteúdo de chave privada foi registrado nas evidências.
"""
          inc_path.write_text(inc, encoding="utf-8")

          ctx_path = Path("docs/implementation/context-packs/rb-inc-133-production-migration-gate.md")
          ctx = ctx_path.read_text(encoding="utf-8")
          ctx = ctx.replace('last_updated: "2026-08-11"', 'last_updated: "2026-08-12"', 1)
          state_start = "## Estado operacional observado\n"
          state_end = "## Restrições\n"
          if state_start not in ctx or state_end not in ctx:
              raise SystemExit("Seções do Context Pack não encontradas")
          before, rest = ctx.split(state_start, 1)
          _, after = rest.split(state_end, 1)
          state = """## Estado operacional observado

- `main` canônica e candidate validado: `a9c0496eca45d90618808a853eaa692ccafc3702`;
- PRs #310 e #311 integradas; Documentation Validation #1049 e Engineering Validation #1471 verdes no SHA da correção;
- Vercel Production acompanha `codex/production-release`, comprovado pelo deployment produtivo após o fast-forward;
- GitHub Environment `Production` fornece conexão Direct do Neon e a Deploy Key em Base64; a existência e validade foram comprovadas pelo workflow sem enumerar ou expor valores;
- ruleset ativo aponta exatamente para `refs/heads/codex/production-release`, com `update`, `deletion`, `non_fast_forward` e bypass `DeployKey`;
- execução automática válida leu 25 registros no ledger, detectou a 0025 pendente e a bloqueou como alto risco por `drop-constraint` e `update-data`, sem migration e sem promoção;
- após aprovação humana explícita do SHA e da migration, Production Release #3 (`31596977124`) aplicou a 0025, verificou 26 registros, `latestAppliedAt=1786482000000` e zero pendências;
- `codex/production-release` avançou somente depois da verificação do schema e agora aponta para `a9c0496eca45d90618808a853eaa692ccafc3702`;
- Vercel deployment `dpl_FBfJuNxULQ64X7NaWzWDTXFAWu1x` está `READY`, `target=production`, originado de `codex/production-release` no mesmo SHA;
- Production respondeu HTTP 200 e não apresentou logs `error`/`fatal` na janela pós-release verificada;
- #305 permanece fora deste incremento.

"""
          ctx = before + state + state_end + after
          validation = "## Validação\n"
          if validation not in ctx:
              raise SystemExit("Seção de validação do Context Pack não encontrada")
          ctx = ctx.split(validation, 1)[0] + validation + """

A cadeia foi comprovada em execução real: CI verde em `main`, autenticação da Deploy Key,
leitura do ledger, bloqueio automático da 0025 sem write, aprovação humana explícita,
migration, verificação de zero pendências, fast-forward da referência protegida e
Production Vercel `READY` no mesmo SHA. O ledger final possui 26 registros e o smoke
produtivo respondeu HTTP 200 sem erros de runtime observados.
"""
          ctx_path.write_text(ctx, encoding="utf-8")

          trace_path = Path("docs/implementation/traceability-matrix.md")
          trace = trace_path.read_text(encoding="utf-8")
          trace = trace.replace('last_updated: "2026-08-11"', 'last_updated: "2026-08-12"', 1)
          trace_marker = "## Evidências previstas do RB-INC-133\n"
          if trace_marker not in trace:
              raise SystemExit("Seção RB-INC-133 da rastreabilidade não encontrada")
          trace = trace.split(trace_marker, 1)[0] + """## Evidências do RB-INC-133

| Evidência | Localização/resultado |
| --- | --- |
| definição do incremento | `docs/implementation/increments/rb-inc-133-production-migration-gate.md` |
| Context Pack | `docs/implementation/context-packs/rb-inc-133-production-migration-gate.md` |
| origem | incidente de ordem de deployment observado no RB-INC-132 e issue #308 |
| implementação | PR #310; correção operacional PR #311; candidate final `a9c0496eca45d90618808a853eaa692ccafc3702` |
| CI | Documentation Validation #1049 e Engineering Validation #1471 verdes no SHA final |
| release gate | `.github/workflows/production-release.yml`; SHA imutável, ledger real, classificação de risco e promoção serializada |
| segurança | ruleset com update/deletion/non-fast-forward e bypass `DeployKey`; secrets validados sem exposição |
| fail-closed | Production Release #2 (`31558997377`) bloqueou a 0025 `high` por `drop-constraint`/`update-data` antes de migration ou promoção |
| aprovação humana | 0025 aprovada explicitamente para `a9c0496eca45d90618808a853eaa692ccafc3702` antes do despacho manual |
| migration | Production Release #3 (`31596977124`) aplicou `0025_add_place_price_range` com sucesso |
| ledger final | 26 registros, `latestAppliedAt=1786482000000`, zero pendências |
| referência de Production | `codex/production-release` promovida por fast-forward para `a9c0496eca45d90618808a853eaa692ccafc3702` somente após o schema |
| Vercel | `dpl_FBfJuNxULQ64X7NaWzWDTXFAWu1x` READY, `target=production`, branch `codex/production-release`, SHA `a9c0496eca45d90618808a853eaa692ccafc3702` |
| smoke | `https://routebook-one.vercel.app` HTTP 200; nenhum log `error`/`fatal` na janela pós-release |
| rastreabilidade | issue #308; PRs #310 e #311; entrega operacional comprovada em Production |
"""
          trace_path.write_text(trace, encoding="utf-8")

      - name: Formatar documentação
        run: pnpm exec prettier --write docs/implementation/increments/rb-inc-133-production-migration-gate.md docs/implementation/context-packs/rb-inc-133-production-migration-gate.md docs/implementation/traceability-matrix.md

      - name: Validar documentação
        run: pnpm docs:validate

      - name: Remover artefatos temporários e publicar closeout
        shell: bash
        run: |
          set -euo pipefail
          rm -f _noop
          git rm .github/workflows/rb-inc-133-closeout.yml
          git add docs/implementation/increments/rb-inc-133-production-migration-gate.md \
            docs/implementation/context-packs/rb-inc-133-production-migration-gate.md \
            docs/implementation/traceability-matrix.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: consolidar evidências do RB-INC-133"
          git push origin HEAD:codex/rb-inc-133-closeout
