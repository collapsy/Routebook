name: Engineering Validation

on:
  pull_request:
    paths:
      - ".github/workflows/engineering-validation.yml"
      - "packages/database/src/**"

permissions:
  contents: write

concurrency:
  group: rb-inc-109-format-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  format:
    name: Format RB-INC-109 canonically
    if: github.event.pull_request.head.ref == 'feature/rb-inc-109-postgres-partial-itinerary-proposal-acceptance'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: feature/rb-inc-109-postgres-partial-itinerary-proposal-acceptance
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format changed TypeScript
        run: |
          pnpm exec prettier --write \
            packages/database/src/apply-itinerary-proposal-partially-transaction-postgres.test.ts \
            packages/database/src/apply-itinerary-proposal-partially-transaction.test.ts \
            packages/database/src/apply-itinerary-proposal-partially-transaction.ts \
            packages/database/src/decision-transaction-fragment.ts \
            packages/database/src/itinerary-proposal-transaction-fragment.ts \
            packages/database/src/itinerary-transaction-fragment.ts

      - name: Restore canonical workflow and commit formatting
        run: |
          git show origin/main:.github/workflows/engineering-validation.yml > .github/workflows/engineering-validation.yml
          git config user.name "RouteBook Automation"
          git config user.email "actions@users.noreply.github.com"
          git add .github/workflows/engineering-validation.yml packages/database/src
          git diff --cached --quiet && exit 0
          git commit -m "style(rb-inc-109): apply canonical prettier formatting"
          git push origin HEAD:feature/rb-inc-109-postgres-partial-itinerary-proposal-acceptance
