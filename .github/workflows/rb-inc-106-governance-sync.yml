name: RB-INC-106 Governance Sync

on:
  push:
    branches:
      - feature/rb-inc-106-itinerary-proposal-edit-experience
    paths:
      - .github/workflows/rb-inc-106-governance-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/rb-inc-106-itinerary-proposal-edit-experience
          fetch-depth: 0

      - name: Synchronize registry and traceability
        shell: python
        run: |
          from pathlib import Path

          registry = Path("docs/registry.md")
          text = registry.read_text()
          rows = """| RB-INC-106 | Experiência de Edição de Proposed Activity na Itinerary Proposal | Implementation | Draft | 0.1.0 | [rb-inc-106-itinerary-proposal-edit-experience.md](./implementation/increments/rb-inc-106-itinerary-proposal-edit-experience.md) |
          | RB-CTX-106 | Context Pack do RB-INC-106 | Implementation Context | Draft | 0.1.0 | [rb-inc-106-itinerary-proposal-edit-experience.md](./implementation/context-packs/rb-inc-106-itinerary-proposal-edit-experience.md) |
          """
          if "| RB-INC-106 |" not in text:
              text = text.replace("\n## Status possíveis", "\n" + rows + "\n## Status possíveis", 1)
          registry.write_text(text)

          matrix = Path("docs/implementation/traceability-matrix.md")
          text = matrix.read_text().replace('last_updated: "2026-08-08"', 'last_updated: "2026-08-09"', 1)
          section = """## Evidências previstas do RB-INC-106

          | Evidência | Localização/resultado |
          | --- | --- |
          | definição do incremento | `docs/implementation/increments/rb-inc-106-itinerary-proposal-edit-experience.md` |
          | Context Pack | `docs/implementation/context-packs/rb-inc-106-itinerary-proposal-edit-experience.md` |
          | editor client | `apps/web/components/itinerary-proposal-activity-editor.tsx` |
          | estilos responsivos | `apps/web/components/itinerary-proposal-activity-editor.module.css` |
          | testes do editor | `apps/web/components/itinerary-proposal-activity-editor.test.tsx` |
          | integração da review | `apps/web/components/itinerary-proposal-review.tsx` |
          | testes de estados da review | `apps/web/components/itinerary-proposal-review.test.tsx` |
          | review model | `apps/web/lib/itinerary-proposal-experience.ts` |
          | testes do review model | `apps/web/lib/itinerary-proposal-experience.test.ts` |
          | página autorizada | `apps/web/app/viagens/[tripId]/roteiro/proposta/page.tsx` |
          | rastreabilidade | issue #241 e PR #242 |
          | SHA técnico validado | `ffc6fc4e214c76c0241303ab7a80c51376fbfc48` |
          | Engineering Validation técnico | #1319, run `31326575512`, success em format, docs, lint, typecheck, migrations, testes, smoke, build e Playwright responsivo |
          | migration | nenhuma nova migration; RB-INC-104/RB-INC-105 reutilizados |

          """
          if "## Evidências previstas do RB-INC-106" not in text:
              text = text.replace("## Cadeia mínima", section + "## Cadeia mínima", 1)
          matrix.write_text(text)

      - name: Commit canonical governance and remove helper
        run: |
          rm .github/workflows/rb-inc-106-governance-sync.yml
          git config user.name "collapsy"
          git config user.email "38116052+collapsy@users.noreply.github.com"
          git add docs/registry.md docs/implementation/traceability-matrix.md .github/workflows/rb-inc-106-governance-sync.yml
          git commit -m "docs(rb-inc-106): synchronize canonical governance"
          git push origin HEAD:feature/rb-inc-106-itinerary-proposal-edit-experience
