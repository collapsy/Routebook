name: RB-INC-167 refresh assembly

on:
  push:
    branches:
      - codex/rb-inc-167-google-place-photos-refresh

permissions:
  contents: write

jobs:
  assemble:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply deterministic refresh patches
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          page_path = Path("apps/web/app/viagens/[tripId]/lugares/page.tsx")
          lines = page_path.read_text().splitlines()

          def unique_index(fragment: str) -> int:
              matches = [index for index, line in enumerate(lines) if fragment in line]
              if len(matches) != 1:
                  raise SystemExit(f"expected one line containing {fragment!r}, found {len(matches)}")
              return matches[0]

          canonical_start = unique_index("{place.primaryImage || !candidate ? (")
          lines[canonical_start] = lines[canonical_start].replace(
              "{place.primaryImage || !candidate ? (",
              "{place.primaryImage ? (",
          )

          canonical_name = next(
              index
              for index in range(canonical_start, min(canonical_start + 30, len(lines)))
              if "placeName={place.name}" in lines[index]
          )
          canonical_lat = next(
              index
              for index in range(canonical_start, canonical_name)
              if "latitude={candidate.latitude}" in lines[index]
          )
          canonical_lon = next(
              index
              for index in range(canonical_start, canonical_name)
              if "longitude={candidate.longitude}" in lines[index]
          )
          indent = lines[canonical_lat][: len(lines[canonical_lat]) - len(lines[canonical_lat].lstrip())]
          google_id_lines = [
              f"{indent}googlePlaceId={{",
              f'{indent}  qualitySignals?.provider === "google-places"',
              f"{indent}    ? qualitySignals.externalId",
              f"{indent}    : undefined",
              f"{indent}}}",
          ]
          lines[canonical_lat] = lines[canonical_lat].replace(
              "latitude={candidate.latitude}", "latitude={coordinate.latitude}"
          )
          lines[canonical_lon] = lines[canonical_lon].replace(
              "longitude={candidate.longitude}", "longitude={coordinate.longitude}"
          )
          lines[canonical_lat:canonical_lat] = google_id_lines

          external_name_matches = [
              index for index, line in enumerate(lines) if "placeName={candidate.name}" in line
          ]
          if len(external_name_matches) != 1:
              raise SystemExit(
                  f"expected one external preview placeName, found {len(external_name_matches)}"
              )
          external_name = external_name_matches[0]
          external_lat = next(
              index
              for index in range(max(0, external_name - 15), external_name)
              if "latitude={candidate.latitude}" in lines[index]
          )
          external_indent = lines[external_lat][
              : len(lines[external_lat]) - len(lines[external_lat].lstrip())
          ]
          external_google_id_lines = [
              f"{external_indent}googlePlaceId={{",
              f'{external_indent}  qualitySignals?.provider === "google-places"',
              f"{external_indent}    ? qualitySignals.externalId",
              f"{external_indent}    : undefined",
              f"{external_indent}}}",
          ]
          lines[external_lat:external_lat] = external_google_id_lines

          media_start = unique_index("const externalMediaItemIds = new Set(")
          bootstrap_start = unique_index("const bootstrapStage = derivePlaceBootstrapStage(")
          if bootstrap_start <= media_start:
              raise SystemExit("bootstrap stage unexpectedly precedes media budget")
          media_end = max(
              index
              for index in range(media_start, bootstrap_start)
              if lines[index].strip() == ");"
          )
          replacement = [
              "  const externalMediaItemIds = new Set(",
              "    bootstrapPolicy.media.enabled",
              "      ? ranking.items",
              "          .filter(({ item, signals }) => {",
              "            const hasGovernedMediaSource =",
              '              Boolean(destinationId) || signals?.provider === "google-places";',
              "            if (!hasGovernedMediaSource) return false;",
              '            if (item.kind === "external") return true;',
              "            return !item.place.primaryImage;",
              "          })",
              "          .slice(0, bootstrapPolicy.media.previewBudget)",
              "          .map(({ item }) => item.id)",
              "      : [],",
              "  );",
          ]
          lines[media_start : media_end + 1] = replacement
          page_path.write_text("\n".join(lines) + "\n")

          turbo_path = Path("turbo.json")
          turbo = json.loads(turbo_path.read_text())
          global_env = turbo.setdefault("globalEnv", [])
          if "ROUTEBOOK_PLACE_PHOTO_PROVIDER" not in global_env:
              quality_index = global_env.index("ROUTEBOOK_PLACE_QUALITY_PROVIDER")
              global_env.insert(quality_index + 1, "ROUTEBOOK_PLACE_PHOTO_PROVIDER")
          turbo_path.write_text(json.dumps(turbo, indent=2, ensure_ascii=False) + "\n")

          Path(".github/workflows/rb-inc-167-refresh-helper.yml").unlink()
          PY
      - name: Commit assembled refresh
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: assemble RB-INC-167 refresh"
          git push
