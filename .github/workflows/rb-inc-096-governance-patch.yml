name: RB-INC-096 Governance Patch

on:
  push:
    branches:
      - feature/rb-inc-096-itinerary-proposal-generation-input-assembler
    paths:
      - .github/workflows/rb-inc-096-governance-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/rb-inc-096-itinerary-proposal-generation-input-assembler
      - name: Patch governance files
        shell: python
        run: |
          from pathlib import Path
          registry = Path("docs/registry.md")
          text = registry.read_text()
          marker = "\n## Status possíveis\n"
          entries = "| RB-INC-096 | Assembler Determinístico de Entrada para Geração de Itinerary Proposal | Implementation | Draft | 0.1.0 | [rb-inc-096-itinerary-proposal-generation-input-assembler.md](./implementation/increments/rb-inc-096-itinerary-proposal-generation-input-assembler.md) |\n| RB-CTX-096 | Context Pack do RB-INC-096 | Implementation Context | Draft | 0.1.0 | [rb-inc-096-itinerary-proposal-generation-input-assembler.md](./implementation/context-packs/rb-inc-096-itinerary-proposal-generation-input-assembler.md) |\n"
          if "| RB-INC-096 |" not in text:
              registry.write_text(text.replace(marker, f"\n{entries}{marker}"))
          matrix = Path("docs/implementation/traceability-matrix.md")
          text = matrix.read_text()
          marker = "\n## Evidências do RB-INC-003\n"
          row = "| RB-INC-096 | RB-UC-022, RB-FR-087–096, RB-ARC-003 e RB-INC-094–095 | #217 | `feature/rb-inc-096-itinerary-proposal-generation-input-assembler`, PR #218 | assembler puro de snapshots autoritativos de Itinerary, Recommendations e Places para Dias e candidatos normalizados | CI final pendente | Em validação |\n"
          if "| RB-INC-096 |" not in text:
              matrix.write_text(text.replace(marker, f"{row}\n{marker}"))
      - name: Commit governance files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/registry.md docs/implementation/traceability-matrix.md
          git commit -m "docs(implementation): register RB-INC-096 governance"
          git push
