name: RB-INC-093 E2E Alert Locator Repair

on:
  push:
    branches:
      - feature/rb-inc-093-itinerary-proposal-acceptance-e2e

permissions:
  contents: write

jobs:
  repair-alert-locators:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: feature/rb-inc-093-itinerary-proposal-acceptance-e2e
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Repair exact error locators
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("apps/web/e2e/itinerary-proposal-review.spec.ts")
          text = path.read_text()
          replacements = [
              (
                  r'''    await expect\(conflictingPage\.getByRole\("alert"\)\)\.toHaveText\(\s*"A proposta não está pronta para ser aceita\."\s*,\s*\);''',
                  '''    await expect(
                      conflictingPage.getByText("A proposta não está pronta para ser aceita.", {
                        exact: true,
                      }),
                    ).toBeVisible();''',
              ),
              (
                  r'''  await expect\(page\.getByRole\("alert"\)\)\.toHaveText\(\s*"O roteiro mudou desde a geração desta proposta\."\s*,\s*\);''',
                  '''  await expect(
                      page.getByText("O roteiro mudou desde a geração desta proposta.", {
                        exact: true,
                      }),
                    ).toBeVisible();''',
              ),
          ]

          for pattern, replacement in replacements:
              text, count = re.subn(pattern, replacement, text, count=1)
              if count != 1:
                  raise SystemExit(f"expected one locator matching {pattern!r}, found {count}")

          path.write_text(text)
          PY
          pnpm exec prettier --write apps/web/e2e/itinerary-proposal-review.spec.ts

      - name: Restore canonical workflow
        run: |
          git fetch origin main --depth=1
          git checkout origin/main -- .github/workflows/rb-inc-043-sync-lockfile.yml

      - name: Commit repaired locators
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/e2e/itinerary-proposal-review.spec.ts \
            .github/workflows/rb-inc-043-sync-lockfile.yml
          git commit -m "test(rb-inc-093): disambiguate Next.js alert locators"
          git push origin HEAD:feature/rb-inc-093-itinerary-proposal-acceptance-e2e
