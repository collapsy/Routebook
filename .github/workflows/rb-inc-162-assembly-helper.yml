name: RB-162 acceptance helper

on:
  pull_request:
    types: [synchronize]
    branches: [main]

permissions:
  contents: write

jobs:
  patch-external-route:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'codex/rb-inc-162-external-place-images'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout RB-162 branch
        uses: actions/checkout@v4
        with:
          ref: codex/rb-inc-162-external-place-images
          fetch-depth: 0

      - name: Keep external route available without accommodation
        shell: python
        run: |
          from pathlib import Path

          path = Path("apps/web/app/viagens/[tripId]/lugares/page.tsx")
          text = path.read_text()
          marker = "function ExternalDiscoveryCard({"
          if text.count(marker) != 1:
              raise SystemExit("ExternalDiscoveryCard marker is not unique")

          before, external = text.split(marker, 1)
          old = '''        {accommodationCoordinate ? (
          <a
            className="product-secondary-action"
            href={buildGoogleMapsDirectionsUrl({
              origin: accommodationCoordinate,
              destination: coordinate,
              destinationLabel,
              travelMode: "walking",
            })}
            rel="noreferrer"
            target="_blank"
          >
            Calcular rota real
          </a>
        ) : null}'''
          new = '''        <a
          className="product-secondary-action"
          href={buildGoogleMapsDirectionsUrl({
            ...(accommodationCoordinate ? { origin: accommodationCoordinate } : {}),
            destination: coordinate,
            destinationLabel,
            travelMode: "walking",
          })}
          rel="noreferrer"
          target="_blank"
        >
          Calcular rota real
        </a>'''

          if external.count(old) != 1:
              raise SystemExit(f"Expected one external route block, found {external.count(old)}")

          path.write_text(before + marker + external.replace(old, new, 1))

      - name: Remove transient helper and push result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/rb-inc-162-assembly-helper.yml
          git add -- 'apps/web/app/viagens/[tripId]/lugares/page.tsx'
          git diff --cached --check
          git commit -m "fix: keep external Place route available"
          git push origin HEAD:codex/rb-inc-162-external-place-images
