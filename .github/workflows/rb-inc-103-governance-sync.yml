name: RB-INC-103 Governance Sync

on:
  push:
    branches:
      - feature/rb-inc-103-edit-itinerary-proposal-activity
    paths:
      - ".github/workflows/rb-inc-103-governance-sync.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/rb-inc-103-edit-itinerary-proposal-activity
      - name: Synchronize registry and traceability
        shell: python
        run: |
          from pathlib import Path

          registry_path = Path("docs/registry.md")
          registry = registry_path.read_text()
          anchor = "| RB-CTX-102 | Context Pack do RB-INC-102 | Implementation Context | Draft | 0.1.0 | [rb-inc-102-authorized-itinerary-proposal-generation-e2e.md](./implementation/context-packs/rb-inc-102-authorized-itinerary-proposal-generation-e2e.md) |"
          rows = """| RB-INC-103 | Núcleo de Edição de Proposed Activity em Itinerary Proposal | Implementation | Draft | 0.1.0 | [rb-inc-103-edit-itinerary-proposal-activity.md](./implementation/increments/rb-inc-103-edit-itinerary-proposal-activity.md) |
          | RB-CTX-103 | Context Pack do RB-INC-103 | Implementation Context | Draft | 0.1.0 | [rb-inc-103-edit-itinerary-proposal-activity.md](./implementation/context-packs/rb-inc-103-edit-itinerary-proposal-activity.md) |"""
          if "| RB-INC-103 |" not in registry:
              if anchor not in registry:
                  raise SystemExit("RB-CTX-102 registry anchor not found")
              registry = registry.replace(anchor, anchor + "\n" + rows, 1)
              registry_path.write_text(registry)

          matrix_path = Path("docs/implementation/traceability-matrix.md")
          matrix = matrix_path.read_text()
          section = """## Evidências previstas do RB-INC-103

          | Evidência | Localização |
          | --- | --- |
          | definição do incremento | `docs/implementation/increments/rb-inc-103-edit-itinerary-proposal-activity.md` |
          | Context Pack | `docs/implementation/context-packs/rb-inc-103-edit-itinerary-proposal-activity.md` |
          | núcleo de edição | `modules/proposal-management/src/edit-itinerary-proposal.ts` |
          | testes de domínio | `modules/proposal-management/src/edit-itinerary-proposal.test.ts` |
          | exports públicos | `modules/proposal-management/src/index.ts` |
          | requisito de produto | `RB-FR-094` |
          | interação | `RB-INT-065` |
          | rastreabilidade | issue #235 e PR #236 |
          | migration | nenhuma nova migration; domínio sem alteração de schema |

          """
          if "## Evidências previstas do RB-INC-103" not in matrix:
              marker = "## Cadeia mínima"
              if marker not in matrix:
                  raise SystemExit("traceability marker not found")
              matrix = matrix.replace(marker, section + marker, 1)
              matrix_path.write_text(matrix)
      - name: Commit canonical governance and remove helper
        run: |
          git config user.name "collapsy"
          git config user.email "38116052+collapsy@users.noreply.github.com"
          git add docs/registry.md docs/implementation/traceability-matrix.md
          git rm .github/workflows/rb-inc-103-governance-sync.yml
          git commit -m "docs(rb-inc-103): sync registry and traceability"
          git push
