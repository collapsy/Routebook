name: Prepare RB-INC-003 Content

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/prepare-rb-inc-003-content.yml"

permissions:
  contents: write

jobs:
  prepare:
    name: Format and register increment
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v6
        with:
          ref: feature/rb-inc-003-trip-creation
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format new implementation files
        run: |
          pnpm exec prettier --write --ignore-path /dev/null \
            apps/web/app/viagens/nova/actions.ts \
            apps/web/app/viagens/nova/page.tsx \
            apps/web/components/trip-card.tsx \
            apps/web/components/trip-form.tsx \
            apps/web/e2e/product-shell.spec.ts \
            modules/trip-management/src/trip.ts \
            packages/database/src/trip-repository.ts

      - name: Synchronize document registry
        shell: python
        run: |
          from pathlib import Path

          path = Path("docs/registry.md")
          content = path.read_text(encoding="utf-8")
          row = "| RB-INC-003 | Criação Canônica de Viagem | Implementation Increment | Draft | 0.1.0 | [rb-inc-003-trip-creation.md](./implementation/increments/rb-inc-003-trip-creation.md) |"
          anchor = "| RB-INC-002 | Product Shell e Minhas Viagens | Implementation Increment | Published | 1.0.0 | [rb-inc-002-product-shell.md](./implementation/increments/rb-inc-002-product-shell.md) |"

          if row not in content:
              content = content.replace(anchor, f"{anchor}\n{row}")
              path.write_text(content, encoding="utf-8")

      - name: Commit preparation
        run: |
          git config user.name "routebook-automation"
          git config user.email "routebook-automation@users.noreply.github.com"
          git add apps/web modules/trip-management packages/database docs/registry.md

          if git diff --cached --quiet; then
            exit 0
          fi

          git commit -m "chore: format and register RB-INC-003"
          git pull --rebase origin feature/rb-inc-003-trip-creation
          git push origin HEAD:feature/rb-inc-003-trip-creation
