name: Temporary Production Browser Validation

on:
  push:
    branches:
      - codex/production-validation-20260815

permissions:
  contents: read

jobs:
  validate-production:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --filter @routebook/web exec playwright install --with-deps chromium

      - name: Run Production validation
        id: validation
        shell: bash
        continue-on-error: true
        env:
          ROUTEBOOK_BASE_URL: https://routebook-one.vercel.app
        run: |
          mkdir -p validation
          set +e
          pnpm --dir apps/web exec node <<'NODE'
          const crypto = require('node:crypto');
          const fs = require('node:fs');
          const path = require('node:path');
          const { chromium } = require('@playwright/test');

          const baseURL = process.env.ROUTEBOOK_BASE_URL;
          const runId = process.env.GITHUB_RUN_ID;
          const account = {
            name: `RouteBook Validation ${runId}`,
            email: `routebook.validation.${runId}@example.com`,
            password: `${crypto.randomBytes(24).toString('base64url')}Aa1!`,
          };
          const result = {
            baseURL,
            runId,
            account: { name: account.name, email: account.email },
            startedAt: new Date().toISOString(),
            steps: [],
            observations: {},
            consoleErrors: [],
            pageErrors: [],
          };

          function record(name, status, details = {}) {
            result.steps.push({ name, status, ...details });
          }

          async function screenshot(page, name) {
            const file = path.join('..', '..', 'validation', `${name}.png`);
            await page.screenshot({ path: file, fullPage: true });
          }

          async function run() {
            const browser = await chromium.launch({ headless: true });
            const context = await browser.newContext({ viewport: { width: 1440, height: 1100 } });
            const page = await context.newPage();
            page.on('console', (msg) => {
              if (msg.type() === 'error') result.consoleErrors.push(msg.text());
            });
            page.on('pageerror', (error) => result.pageErrors.push(String(error)));

            try {
              let response = await page.goto(baseURL, { waitUntil: 'networkidle', timeout: 60000 });
              record('home', response && response.status() === 200 ? 'pass' : 'fail', {
                httpStatus: response?.status(),
                title: await page.title(),
              });
              await screenshot(page, '01-home');

              response = await page.goto(`${baseURL}/criar-conta`, { waitUntil: 'networkidle', timeout: 60000 });
              if (!response || response.status() >= 400) throw new Error(`Signup page HTTP ${response?.status()}`);
              await page.getByLabel('Nome').fill(account.name);
              await page.getByLabel('Email').fill(account.email);
              await page.getByLabel('Senha').fill(account.password);
              await Promise.all([
                page.waitForURL(/\/viagens(?:\?.*)?$/, { timeout: 30000 }),
                page.getByRole('button', { name: 'Criar conta' }).click(),
              ]);
              record('signup', 'pass', { url: page.url() });
              await screenshot(page, '02-signed-up');

              const tripName = `Pipa Validation ${runId}`;
              await page.goto(`${baseURL}/viagens/nova`, { waitUntil: 'networkidle', timeout: 60000 });
              await page.getByLabel('Nome da viagem').fill(tripName);
              await page.getByLabel('Data de início').fill('2026-08-22');
              await page.getByLabel('Data de término').fill('2026-08-29');
              await Promise.all([
                page.waitForURL(/\/viagens\?created=1$/, { timeout: 30000 }),
                page.getByRole('button', { name: 'Criar viagem' }).click(),
              ]);
              await Promise.all([
                page.waitForURL(/\/viagens\/[^/?]+$/, { timeout: 30000 }),
                page.getByRole('link', { name: tripName }).click(),
              ]);
              const tripUrl = new URL(page.url()).pathname;
              result.observations.tripUrl = tripUrl;
              record('create-trip', 'pass', { tripUrl });
              await screenshot(page, '03-trip-overview-initial');

              await page.goto(`${baseURL}${tripUrl}/contexto`, { waitUntil: 'networkidle', timeout: 60000 });
              for (const interest of ['Praias', 'Gastronomia', 'Vida noturna']) {
                const box = page.getByRole('checkbox', { name: interest });
                if (await box.count()) await box.check();
              }
              await Promise.all([
                page.waitForURL(/\/viagens\/[^/]+\?contextUpdated=1$/, { timeout: 30000 }),
                page.getByRole('button', { name: 'Salvar contexto' }).click(),
              ]);
              record('configure-context', 'pass');

              await page.goto(`${baseURL}${tripUrl}/hospedagem`, { waitUntil: 'networkidle', timeout: 60000 });
              await page.getByLabel('Nome da hospedagem').fill('Condomínio Solar Água');
              await page.getByLabel('Endereço', { exact: true }).fill('Pipa, Tibau do Sul — RN');
              await page.getByLabel('Latitude', { exact: true }).fill('-6,2302');
              await page.getByLabel('Longitude', { exact: true }).fill('-35,0503');
              await Promise.all([
                page.waitForURL(/\/hospedagem\?saved=1$/, { timeout: 30000 }),
                page.getByRole('button', { name: 'Salvar hospedagem' }).click(),
              ]);
              record('configure-accommodation', 'pass');

              await page.goto(`${baseURL}${tripUrl}`, { waitUntil: 'networkidle', timeout: 60000 });
              const overviewText = await page.locator('body').innerText();
              result.observations.overview = {
                hasAccommodation: overviewText.includes('Condomínio Solar Água'),
                hasMapHeading: overviewText.includes('Mapa de Pipa'),
                hasContextualDecisionHeading: overviewText.includes('O que vale a pena considerar?'),
              };
              result.observations.overview.mapState = await page.locator('[data-map-state]').first().getAttribute('data-map-state').catch(() => null);
              record('trip-overview', result.observations.overview.hasAccommodation && result.observations.overview.mapState === 'ready' ? 'pass' : 'fail', result.observations.overview);
              await screenshot(page, '04-trip-overview-configured');

              await page.goto(`${baseURL}${tripUrl}/lugares`, { waitUntil: 'networkidle', timeout: 60000 });
              await page.waitForTimeout(2500);
              const placesText = await page.locator('body').innerText();
              const knownPlaces = ['Praia do Amor', 'Baía dos Golfinhos', 'Chapadão de Pipa', 'Praia do Madeiro', 'Lagoa de Guaraíras', 'Praia de Tibau do Sul'];
              const knownPresence = Object.fromEntries(knownPlaces.map((name) => [name, placesText.includes(name)]));
              const imageSources = await page.locator('img').evaluateAll((images) => images.map((image) => image.getAttribute('src') || ''));
              const curatedImageCount = imageSources.filter((src) => src.includes('place-images%2Fpipa%2F') || src.includes('/place-images/pipa/')).length;
              const fallbackCount = await page.locator('[data-place-image-fallback="true"]').count();
              const publishedCountText = (placesText.match(/(\d+) lugares encontrados/) || [])[1];
              const placeMapState = await page.locator('[data-map-state]').first().getAttribute('data-map-state').catch(() => null);
              result.observations.places = {
                publishedCount: publishedCountText ? Number(publishedCountText) : null,
                knownPresence,
                curatedImageCount,
                fallbackCount,
                mapState: placeMapState,
              };
              record('places', Object.values(knownPresence).every(Boolean) && curatedImageCount === 6 && fallbackCount === 24 && placeMapState === 'ready' ? 'pass' : 'fail', result.observations.places);
              await screenshot(page, '05-places');

              const discoveryLink = page.getByRole('link', { name: 'Descobrir mais lugares', exact: true });
              if (await discoveryLink.count()) {
                await Promise.all([
                  page.waitForURL(/descoberta=externa/, { timeout: 60000 }),
                  discoveryLink.click(),
                ]);
                await page.waitForLoadState('networkidle', { timeout: 60000 }).catch(() => {});
                const discoveryText = await page.locator('body').innerText();
                const externalSection = page.locator('section[aria-labelledby="external-place-discovery"]');
                const externalCandidateCount = await externalSection.locator('li').count().catch(() => 0);
                const providerError = discoveryText.includes('A fonte externa não respondeu agora.');
                result.observations.discovery = {
                  linkPresent: true,
                  headingPresent: discoveryText.includes('Mais lugares encontrados no Overture'),
                  externalCandidateCount,
                  providerError,
                  hasGovernanceLanguage: discoveryText.includes('candidatos externos') && discoveryText.includes('catálogo publicado'),
                };
                record('organic-discovery', !providerError && result.observations.discovery.headingPresent ? 'pass' : 'fail', result.observations.discovery);
                await screenshot(page, '06-organic-discovery');
              } else {
                result.observations.discovery = { linkPresent: false };
                record('organic-discovery', 'fail', result.observations.discovery);
              }

              await page.goto(`${baseURL}${tripUrl}/recomendacoes`, { waitUntil: 'networkidle', timeout: 60000 });
              await page.waitForTimeout(1500);
              const recommendationArticles = page.getByRole('article');
              const articleCount = await recommendationArticles.count();
              const recText = await page.locator('body').innerText();
              result.observations.recommendations = {
                articleCount,
                hasPraiaDoAmor: recText.includes('Praia do Amor'),
                hasDistance: /Distância da hospedagem:/i.test(recText),
                hasConfidence: /Confiança/i.test(recText),
                hasExplicitActionLanguage: /ação explícita/i.test(recText),
              };
              record('recommendations', articleCount === 30 && result.observations.recommendations.hasDistance && result.observations.recommendations.hasConfidence ? 'pass' : 'fail', result.observations.recommendations);
              await screenshot(page, '07-recommendations');

              await page.goto(`${baseURL}${tripUrl}/roteiro`, { waitUntil: 'networkidle', timeout: 60000 });
              const itineraryText = await page.locator('body').innerText();
              result.observations.itinerary = {
                hasZeroActivities: /0\s*atividades/i.test(itineraryText),
                hasDays: itineraryText.includes('22/08/2026') || itineraryText.includes('22 de agosto'),
              };
              record('itinerary', result.observations.itinerary.hasZeroActivities && result.observations.itinerary.hasDays ? 'pass' : 'fail', result.observations.itinerary);
              await screenshot(page, '08-itinerary');

              result.finishedAt = new Date().toISOString();
              fs.writeFileSync(path.join('..', '..', 'validation', 'summary.json'), JSON.stringify(result, null, 2));

              const criticalFailures = result.steps.filter((step) => step.status === 'fail');
              await browser.close();
              if (criticalFailures.length) {
                console.error(`Critical validation failures: ${criticalFailures.map((s) => s.name).join(', ')}`);
                process.exit(2);
              }
            } catch (error) {
              result.fatalError = String(error && error.stack ? error.stack : error);
              result.finishedAt = new Date().toISOString();
              try { await screenshot(page, '99-failure'); } catch {}
              fs.writeFileSync(path.join('..', '..', 'validation', 'summary.json'), JSON.stringify(result, null, 2));
              await browser.close();
              throw error;
            }
          }

          run().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE
          code=$?
          echo "$code" > validation/exit-code.txt
          exit 0

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-validation-${{ github.run_id }}
          path: validation/
          if-no-files-found: error
          retention-days: 7

      - name: Fail on critical validation error
        if: always()
        shell: bash
        run: |
          code=$(cat validation/exit-code.txt 2>/dev/null || echo 1)
          exit "$code"
