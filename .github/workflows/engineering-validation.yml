name: Engineering Validation

on:
  pull_request:
    paths:
      - ".github/workflows/engineering-validation.yml"
      - "apps/web/package.json"
      - "pnpm-lock.yaml"

permissions:
  contents: write

jobs:
  synchronize-postcss-dependency:
    name: Synchronize PostCSS dependency
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Synchronize lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile

      - name: Format package and lockfile
        run: pnpm exec prettier --write apps/web/package.json pnpm-lock.yaml

      - name: Commit generated lockfile
        shell: bash
        run: |
          if git diff --quiet -- apps/web/package.json pnpm-lock.yaml; then
            echo "Dependency files already synchronized."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/package.json pnpm-lock.yaml
          git commit -m "chore: synchronize Tailwind PostCSS dependency"
          git push origin "HEAD:${{ github.head_ref }}"
