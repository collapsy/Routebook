name: RB-INC-076 Apply Scoped Repository

on:
  push:
    branches:
      - feature/rb-inc-076-scoped-proposal-repository

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Apply scoped repository refactor
        run: node scripts/apply-rb-inc-076-scoped-proposal-repository.mjs

      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(database): escopar repository de Itinerary Proposal"
          git push origin "HEAD:${GITHUB_REF_NAME}"
